---
# Example inventory — one inventory describes the WHOLE install, all regions.
# Copy inventories/example -> inventories/<yourenv> and edit.
#
# All addresses here are documentation ranges (RFC 5737 / RFC 1918). Never
# commit real hostnames, IPs, or credentials to this public repository.
#
# Vocabulary: `region` == controller Location (e.g. ams005);
#             `az`     == controller Region (e.g. exm-005), exactly ONE node per az.
#             `site`   == the physical facility a host lives in.
#
# Required vars on every node (asserted by preflight; templates use inventory
# vars ONLY — never gathered facts — so partial runs can't drop regions from
# shared-host config): hostname, primary_ip, public_ip, region, az,
# container_network, container_network_name.
#
# SITES. This example describes TWO of them, `east` and `west`, because that
# is the shape the site model exists for and documenting it by construction
# beats describing it. A site is neither a region nor an az: it is the
# facility, and it decides which metrics host scrapes a node and which backup
# server that node writes to. One metrics host and AT MOST one backup server
# per site; a region never spans sites; two regions may share a site.
#
# `site` is an inventory HOST var, set on nodes, metrics hosts and backup
# hosts. It is deliberately NOT set on the controller, the registry or the
# nameservers: those are platform-wide, and giving them a site would make
# them belong to one facility's prometheus and to no other's.
#
# A SINGLE-SITE INSTALL SETS `site` NOWHERE AT ALL. Every host then lands in
# the site called `default`, every site map has exactly one key, and every
# role resolves the same single metrics host and single backup server it
# resolved before sites existed. No existing inventory needs an edit — see
# tests/fixtures/single-site, which is exactly that inventory, frozen.
all:
  children:
    controller:
      hosts:
        ctl1:
          ansible_host: 192.0.2.10
          hostname: ctl1
          primary_ip: 10.100.0.10
          public_ip: 192.0.2.10

    # ONE metrics host per site, and every site holding a node must have one
    # (preflight fails the run otherwise: the controller's placement queries
    # go to that site's prometheus, and with none every order for its regions
    # is rejected).
    #
    # `metrics_domain` is the public name THIS host's prometheus and loki
    # vhosts answer on, and the name its ACME certificate covers. It is
    # optional and per host: a metrics host that does not set it uses the
    # environment-wide `cs_metrics_domain` from group_vars/all/main.yml, which
    # is what a single-site install has always used. Each name must already
    # resolve to that host's public address before the run — the certificates
    # are issued during it.
    metrics:
      hosts:
        metrics1:
          ansible_host: 192.0.2.11
          hostname: metrics1
          primary_ip: 10.100.0.11
          public_ip: 192.0.2.11
          site: east
          # no metrics_domain -> cs_metrics_domain (metrics.example.com)
        metrics2:
          ansible_host: 192.0.2.14
          hostname: metrics2
          primary_ip: 10.100.0.14
          public_ip: 192.0.2.14
          site: west
          metrics_domain: metrics.west.example.com

    # AT MOST one backup server per site. Zero in a site is legal and means
    # that site's nodes install with backups disabled; two in one site is an
    # error, because every node in a site shares one repository host.
    backup:
      hosts:
        backup1:
          ansible_host: 192.0.2.12
          hostname: backup1
          primary_ip: 10.100.0.12
          public_ip: 192.0.2.12
          site: east
        backup2:
          ansible_host: 192.0.2.15
          hostname: backup2
          primary_ip: 10.100.0.15
          public_ip: 192.0.2.15
          site: west

    registry:
      hosts:
        registry1:
          ansible_host: 192.0.2.13
          hostname: registry1
          primary_ip: 10.100.0.13
          public_ip: 192.0.2.13

    # `powerdns_name` is REQUIRED on every nameserver and must be unique: it
    # is that server's FQDN, and it becomes the NS records of the tenant
    # zone (`controller_seed` asserts presence and uniqueness; the leader
    # also uses the first one as the zone's SOA identity). These names must
    # resolve publicly to the addresses below.
    nameservers:
      children:
        ns_primary:
          hosts:
            ns1:
              ansible_host: 198.51.100.10
              hostname: ns1
              primary_ip: 198.51.100.10
              public_ip: 198.51.100.10
              powerdns_name: ns1.example.com
        ns_followers:
          hosts:
            ns2:
              ansible_host: 198.51.100.11
              hostname: ns2
              primary_ip: 198.51.100.11
              public_ip: 198.51.100.11
              powerdns_name: ns2.example.com

    nodes:
      hosts:
        node1001:
          ansible_host: 203.0.113.10
          hostname: node1001
          primary_ip: 10.100.1.10
          public_ip: 203.0.113.10
          region: exm001          # -> Location
          az: exm-001             # -> Region (1 node per az)
          site: east              # -> metrics1 + backup1
          container_network: 10.100.4.0/22
          container_network_name: net-exm-001
          # uplink_interface: eth0
          #   Optional, node-only, no default. Set it on a node that has a
          #   GLOBAL IPv6 address: docker sets
          #   net.ipv6.conf.all.forwarding=1 the first time it creates an
          #   IPv6 network, which withdraws the RA-learned default route
          #   about 30 minutes later. roles/node_kernel pins
          #   accept_ra=2 on this interface to stop that, and skips the fix
          #   (with a note) rather than guessing the name when it is unset.
          # controller_acme_address: 192.0.2.10
          #   Optional, node-only. The address THIS node's haproxy dials the
          #   controller's ACME backend on (`region.acme_server`). Defaults
          #   to the controller's tailnet address when both ends are on the
          #   tailnet, else its primary_ip — override it in a remote region
          #   where primary_ip is not routable.
        # Two regions, one site: exm001 and exm002 are separate controller
        # Locations that share metrics1 and backup1. That is the case no
        # controller-side grouping expresses, and the reason `site` exists.
        node2001:
          ansible_host: 203.0.113.20
          hostname: node2001
          primary_ip: 10.100.2.10
          public_ip: 203.0.113.20
          region: exm002
          az: exm-002
          site: east
          container_network: 10.100.8.0/22
          container_network_name: net-exm-002
          # tailscale_enabled: false   # opt out for same-L2 nodes
        # A second facility: scraped by metrics2 on metrics.west.example.com,
        # backed up to backup2. Nothing about this node reaches the east
        # site's metrics host or backup server.
        node3001:
          ansible_host: 203.0.113.30
          hostname: node3001
          primary_ip: 10.100.3.10
          public_ip: 203.0.113.30
          region: exm003
          az: exm-003
          site: west
          container_network: 10.100.12.0/22
          container_network_name: net-exm-003
