---
# SAMPLE ONLY — in a real environment this file is ansible-vault encrypted:
#   ansible-vault encrypt inventories/<env>/group_vars/all/secrets.yml
#
# SECRET_KEY_BASE and USER_AUTH_SECRET are IMMUTABLE INSTALL INPUTS. Generate
# each ONCE with `openssl rand -hex 64` (>=128 chars). Rotating
# secret_key_base later silently destroys every encrypted credential in the
# controller (agent tokens, DNS keys, LB certificates) — treat rotation as a
# full reinstall. Preflight hard-fails on blank/short values and NEVER
# generates them for you.
secret_key_base: "CHANGEME__openssl_rand_hex_64__128_chars_minimum"
user_auth_secret: "CHANGEME__openssl_rand_hex_64__128_chars_minimum"

cs_admin_password: "CHANGEME"
node_enrollment_token: "CHANGEME__openssl_rand_hex_32"

postgres_password: "CHANGEME"

# The nginx basic-auth credentials in front of every metrics host's
# prometheus and loki vhosts. These are the environment-wide values: with one
# metrics host they are all you need, and a single-site inventory sets nothing
# else.
prometheus_basic_auth_password: "CHANGEME"
loki_basic_auth_password: "CHANGEME"

# Per-site override, keyed by the `site` host var (hosts.yml). Metrics hosts
# built separately — a v1 host being attached to, or a second facility stood
# up later — do not share credentials, and a wrong one is a 401 with exactly
# the same symptom as a wrong password: logs silently dropped and roles/validate
# failing at the very end of a converge. THE USERNAMES MATTER AS MUCH AS THE
# PASSWORDS.
#
# Resolution, per value: the specific key, then the `username`/`password`
# shorthand, then the environment-wide global above. An empty string counts as
# absent at every stage — a blank password is a mistake, not a credential. So
# name only the sites that differ, and use the shorthand for the shape a v1
# metrics host has (ONE password covering both vhosts).
#
# metrics_site_credentials:
#   east:
#     username: promuser        # shorthand: fills BOTH usernames
#     password: "CHANGEME"      # and BOTH passwords (the v1 one-per-VM shape)
#   west:
#     prometheus_username: promuser
#     prometheus_password: "CHANGEME"
#     loki_username: loguser
#     loki_password: "CHANGEME"

# Borg passphrase. NOTE: this value also selects the cs-agent Sentry
# environment (changeme!/tester! label the node development/testing).
backups_key: "CHANGEME"

# PowerDNS (when dns_driver == powerdns) — generated once by the operator.
pdns_api_key: "CHANGEME"
pdns_web_key: "CHANGEME"
pdns_db_password: "CHANGEME"

# The haproxy stats endpoint the metrics host scrapes. Optional but
# recommended: the controller column ships a hard-coded default, so leaving
# this unset publishes the same stats password on every ComputeStacks
# install. When unset, controller_seed derives a stable, per-install value
# from secret_key_base instead.
# haproxy_stats_password: "CHANGEME"

# Private container registries. One entry per registry host, applied on every
# docker host, so a node can pull a privately mirrored image too. `registry` is
# the host[:port] exactly as it appears in the image reference; a Docker Hub
# reference carries no host, so write `docker.io` for those.
#
# GitLab (gitlab.com or self-hosted): use a DEPLOY TOKEN with the
# `read_registry` scope — project-level under Settings -> Repository -> Deploy
# tokens, or group-level to cover every project in the group. The username is
# the whole `gitlab+deploy-token-<n>` string GitLab shows you, and the password
# is shown exactly once. Deploy tokens can expire; when one does, every pull
# and every `cstacks upgrade` fails until it is replaced. A personal access
# token with `read_registry` also works but ties the fleet to one person's
# account, and a CI job token is far too short-lived for this.
#
# docker_registries:
#   - registry: registry.gitlab.com
#     username: "gitlab+deploy-token-42"
#     password: "CHANGEME"
#
# The registry must serve a publicly-trusted TLS certificate: the provisioner
# writes no /etc/docker/certs.d material and enables no insecure registries.

# Optional integrations — features activate when set.
# tailscale_authkey: "tskey-auth-..."   # short-lived: joins tailscale_enabled hosts not yet logged in
# ubuntu_pro_token: "..."
# Pull credentials for a private controller image repo. Equivalent to a
# docker_registries entry for that repo's registry host, kept because it is
# what v1 called it; the registry host is read off controller_image_repo. A
# docker_registries entry for the same host wins over this pair.
# controller_registry_username: "..."
# controller_registry_password: "..."
# sentry_dsn: "..."
# Backup export to S3 (cs_agent_s3_export_* in main.yml). Required once a
# bucket is set; a region using its own S3 account sets them in a vaulted
# group_vars/region_<name>.yml instead.
# s3_export_access_key: "CHANGEME"
# s3_export_secret_key: "CHANGEME"
