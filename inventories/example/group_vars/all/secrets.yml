---
# SAMPLE ONLY — in a real environment this file is ansible-vault encrypted:
#   ansible-vault encrypt inventories/<env>/group_vars/all/secrets.yml
#
# SECRET_KEY_BASE and USER_AUTH_SECRET are IMMUTABLE INSTALL INPUTS. Generate
# each ONCE with `openssl rand -hex 64` (>=128 chars). Rotating
# secret_key_base later silently destroys every encrypted credential in the
# controller (agent tokens, DNS keys, LB certificates) — treat rotation as a
# full reinstall. Preflight hard-fails on blank/short values and NEVER
# generates them for you.
secret_key_base: "CHANGEME__openssl_rand_hex_64__128_chars_minimum"
user_auth_secret: "CHANGEME__openssl_rand_hex_64__128_chars_minimum"

cs_admin_password: "CHANGEME"
node_enrollment_token: "CHANGEME__openssl_rand_hex_32"

postgres_password: "CHANGEME"
prometheus_basic_auth_password: "CHANGEME"
loki_basic_auth_password: "CHANGEME"

# Borg passphrase. NOTE: this value also selects the cs-agent Sentry
# environment (changeme!/tester! label the node development/testing).
backups_key: "CHANGEME"

# PowerDNS (when dns_driver == powerdns) — generated once by the operator.
pdns_api_key: "CHANGEME"
pdns_web_key: "CHANGEME"
pdns_db_password: "CHANGEME"

# Optional integrations — features activate when set.
# tailscale_authkey: "tskey-auth-..."
# ubuntu_pro_token: "..."
# controller_registry_username: "..."   # enterprise image repo pull creds
# controller_registry_password: "..."
# sentry_dsn: "..."
# s3_export_access_key: "..."
# s3_export_secret_key: "..."
