---
# Environment-level settings (non-secret). Secrets live in secrets.yml (vault).

# The playbooks connect as root and use no privilege escalation — there is no
# play-level `become` in this repo. ansible.cfg sets no remote_user, so without
# this ansible connects as your local username and every task fails.
#
# Ubuntu cloud images block root by default: cloud-init installs your key into
# /root/.ssh/authorized_keys behind a forced command that prints "Please login
# as the user ubuntu". Pass `disable_root: false` in the instance's cloud-init
# user-data. Root SSH has to be open on the nodes in any case — the controller
# uses it at runtime for volumes, haproxy certificate deploys and load balancer
# reloads (docs/control-plane.md row 4), and roles/validate asserts it.
ansible_user: root

# sshd's port, per host: set `ssh_port` on any host whose sshd does not listen
# on 22 (hosts.yml). The playbooks open that port in the host's own firewall
# and give it to everything that dials the host -- the controller (Node rows,
# its ssh config, the registry setting) and a node's borg connection to its
# backup server. Moving sshd itself is yours to do before the run; nothing
# here edits sshd_config. ansible connects on `ansible_port`, which this line
# keeps in step with it:
ansible_port: "{{ ssh_port | default(22) }}"

# Portal / domains
cs_portal_domain: portal.example.com
cs_registry_domain: cr.example.com
# The DEFAULT metrics/logging domain: the name used by any site whose metrics
# host does not set a `metrics_domain` host var of its own (hosts.yml). A
# single-site install has only this one.
cs_metrics_domain: metrics.example.com
# The ONE tenant Dns::Zone: one `pdnsutil create-zone`, one entry in the
# manifest's `dns.zones`, and the parent of every load balancer domain in the
# environment. It stays environment-wide.
#
# What is PER AZ is the load balancer's own domain, the `app_domain` host var
# on each node (hosts.yml). Every az has its own load balancer and its own
# wildcard certificate; a node that sets no `app_domain` uses this value, so
# an inventory written before per-az domains existed renders exactly what it
# always did. Every `app_domain` must sit at or under this zone, and this
# zone must be 2 to 5 labels long — the controller finds a container's zone
# by walking UP the container FQDN and taking the first exact match, so a
# domain outside it, or a zone too deep to be reached, silently never issues
# a tenant certificate. roles/preflight asserts both.
cs_app_zone: usercontent.example.com
cs_admin_email: admin@example.com

locale: en
currency: USD

# DNS driver: powerdns | autodns | none
dns_driver: powerdns

# ACME (portal/registry/metrics certs)
# acme_ca: zerossl | letsencrypt | letsencrypt_test (staging, for throwaway
# environments) | google | ... | a full directory URL. Default zerossl.
acme_ca: zerossl
acme_account_email: admin@example.com
# acme_eab_kid: ""            # External Account Binding — required by Google
# acme_eab_hmac_key: in secrets.yml  # Trust Services; optional for ZeroSSL.
# acme_dns_provider: <see docs/acme-providers.md>; default HTTP-01 webroot

# Tailscale: enabled globally when tailscale_authkey is set in secrets.yml.
# Opt out per host/group with `tailscale_enabled: false` (same-L2 regions).
# In ATTACH mode the default flips: add-region.yml requires every host to
# declare `tailscale_enabled` explicitly when an auth key is present, because
# an existing v1 controller and metrics host are not on a tailnet until you
# join them yourself.

# Ubuntu Pro (optional): enabled when ubuntu_pro_token is set in secrets.yml.

# Backup export to S3 ("download backup", optional; roles/cs_agent/README.md).
# Off until a bucket is set. Read per node, so a region with its own S3
# endpoint sets these in group_vars/region_<name>.yml (or a node's
# host_vars) instead of here. The keys, s3_export_access_key and
# s3_export_secret_key, go in secrets.yml. Defaults are cs-agent's own.
# cs_agent_s3_export_bucket: exports-example
# cs_agent_s3_export_endpoint: https://s3.example.com   # omit for AWS
# cs_agent_s3_export_region: us-east-1
# cs_agent_s3_export_prefix: "exports/"
# cs_agent_s3_export_force_path_style: false   # true for MinIO
# cs_agent_s3_export_workers: 1
# cs_agent_s3_export_tar_filter: gzip          # "" = uncompressed
# cs_agent_s3_export_timeout_sec: 14400
# cs_agent_s3_export_part_size_mb: 64          # >= 5
# cs_agent_s3_export_concurrency: 4
# cs_agent_s3_export_sse: AES256               # aws:kms, aws:kms:dsse, or ""
# cs_agent_s3_export_default_ttl_sec: 43200    # <= max_ttl_sec
# cs_agent_s3_export_max_ttl_sec: 86400        # < 604800 (agent task retention)

# Post-install checks (roles/validate). Names: services, storage, containers,
# agent, backfill, prometheus, borg, ssh, portal, acme_backend, lb_domain, dns,
# dns_replication, pdns_api.
# validate_skip: []
# validate_tls_verify: true    # false while the portal is self-signed

# Docker's apt repository is keyed on the release codename, and
# geerlingguy.docker derives it from `ansible_distribution_release`. On
# Ubuntu 26.04 that is `resolute`, which download.docker.com publishes, so
# this override is NOT needed here -- it exists only for a future release
# Docker has not shipped a suite for yet. Setting it also means the pinned
# versions in versions.yml (`...~ubuntu.26.04~resolute`) no longer exist in
# the suite you point at, so change both together:
# docker_apt_repository: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu <codename> stable"

# Attach mode (add-region.yml): set on EXISTING shared hosts in the inventory.
# existing_env: true
# Attach-mode required inputs describing the existing environment:
# backup_host_path: /mnt
# backup_borg_remote_path: /usr/bin/borg
# In secrets.yml, these must ALSO be the existing environment's values, not
# new ones — nothing on a shared host is re-rendered to match them:
#   secret_key_base (asserted byte-for-byte), backups_key, and the metrics
#   host's nginx basic-auth credentials (prometheus_basic_auth_password /
#   loki_basic_auth_password, or a `metrics_site_credentials` entry for that
#   site — see secrets.yml).
# See docs/attach-mode.md.
