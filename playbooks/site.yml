---
# Greenfield full converge: a complete ComputeStacks environment from bare
# Ubuntu 26.04 hosts.
#
#   ansible-playbook -i inventories/<env> playbooks/site.yml --ask-vault-pass
#
# Play ORDER is a frozen contract (docs/contracts.md §Play ordering) —
# enrollment and the backfills depend on it:
#
#   seed creates Node rows (minting agent tokens)
#     -> the nodes install cs-agent and ENROLL
#       -> controller_post_enroll runs the backfills
#         -> validate asserts the whole graph
#
# and, on nodes, the container data disk is mounted before docker exists:
# `Node container storage` must precede `Docker hosts`.
#
# Attach mode (a new region against an EXISTING v1-built environment) is a
# different playbook: playbooks/add-region.yml. Do not run this one against
# hosts flagged `existing_env: true`.

# First, before anything gathers facts: ansible drops an unreachable host
# from the play and carries on without it, so this fails the run instead,
# naming every host that did not answer (roles/preflight/README.md). Tagged
# `always` so `make validate` (--tags validate) checks it too.
- name: Every targeted host is reachable
  hosts: all
  gather_facts: false
  tasks:
    - name: Check every targeted host answers over ssh
      ansible.builtin.import_role:
        name: preflight
        tasks_from: reachable
      tags: [always]

# `any_errors_fatal` here regardless of ansible.cfg (which sets it for every
# play): one host failing preflight must stop the run before any host is
# changed, not leave the others to carry on.
- name: Preflight validation
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  roles:
    - preflight

- name: Base system
  hosts: all
  roles:
    # packages, sshd, chrony, motd fragment, reboot-if-required, root keypair
    - common
    # distro prometheus-node-exporter on every host; roles/metrics scrapes
    # nodes via per-AZ file_sd and the infrastructure groups statically.
    - node_exporter

# Membership is the pure-inventory predicate (docs/contracts.md): an auth key
# in the vaulted secrets, minus per-host/group opt-outs for same-L2 regions.
# A member with `tailscale_access_only: true` still joins here; the consumers
# (firewall, cs_agent, metrics file_sd, controller_seed) just route none of
# its control-plane traffic over the tailnet.
- name: Tailscale mesh and Ubuntu Pro
  hosts: all
  roles:
    - role: tailscale
      when:
        - (tailscale_authkey | default('')) | length > 0
        - tailscale_enabled | default(true) | bool
    - role: ubuntu_pro
      when: (ubuntu_pro_token | default('')) | length > 0

- name: Nameservers
  hosts: nameservers
  roles:
    - postgres_repo              # PGDG apt repo + pin (the pinned major)
    - powerdns

# Before docker is installed, so dockerd and containerd never write a byte to
# the root disk: the data disk from `docker_data_device` is formatted (only
# when provably blank), mounted with prjquota, and bind-mounted over
# /var/lib/docker and /var/lib/containerd, and both daemons require those
# mounts (roles/node_storage/README.md). Preflight has already refused any
# node whose disk this role would not touch.
- name: Node container storage
  hosts: nodes
  roles:
    - node_storage

# geerlingguy.docker installs the engine only. /etc/docker/daemon.json belongs
# to docker_config and the node TCP/TLS listener to docker_tls; docker
# hard-errors when an option is set in two places, so `docker_daemon_options`
# must stay empty here (roles/docker_config/README.md).
#
# The engine packages are HELD around the install, as v1 did: an unattended
# apt upgrade that moves dockerd restarts every container on the node. The
# hold is released first, so editing `docker_apt_packages` in versions.yml
# rolls through on a rerun (contracts rule 3) -- EXCEPT on a live node.
#
# A LIVE NODE (one with tenant containers; roles/node_upgrade detect_live) is
# never upgraded here: a docker upgrade restarts dockerd, and tenant
# containers have no restart policy, so they would stay down. When a live
# node's docker drifts from its pin, this play skips the hold release,
# geerlingguy.docker and the re-hold for that node and warns; the pin rolls
# out through `make upgrade-docker ENV=<env>` in a maintenance window
# (playbooks/upgrade-docker.yml). Skip, not fail: a pin bump must not block
# every unrelated site.yml run until the whole fleet is upgraded. A node that
# is not live (first build, no tenants yet) and every non-node host behave as
# before. docker_config still runs on a skipped node: it only reloads dockerd.
- name: Docker hosts
  hosts: controller:metrics:registry:nodes
  pre_tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Probe whether this node is live
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: detect_live
      when: "'nodes' in group_names"

    - name: Decide whether docker's packages are left alone on this host
      ansible.builtin.set_fact:
        docker_packages_deferred: >-
          {{ 'nodes' in group_names
             and (node_upgrade_live | default(false) | bool)
             and (node_upgrade_docker_drift | default(false) | bool) }}

    - name: Warn that docker on this live node is not upgraded by this run
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} is a LIVE node and its docker does
          not match the pins in versions.yml
          ({% for p in node_upgrade_drift_list %}{{ p.name }} installed
          {{ p.installed | default('nothing', true) }}, pinned
          {{ p.pin | default('any', true) }}{{ '; ' if not loop.last else '' }}{% endfor %}).
          site.yml does not upgrade docker on a live node -- doing so restarts
          dockerd under its tenants -- so docker's packages were left alone
          on this host. Run `make upgrade-docker ENV={{ inventory_dir | basename }}`
          in a maintenance window.
      when: docker_packages_deferred | bool

    # roles/docker_tls writes its ExecStart drop-in in a LATER play (it needs
    # Vault). A drop-in left from a previous converge pins the address this
    # host had THEN, and dockerd refuses to start if that address is gone --
    # killing the run before the task that would fix it. See the task file.
    #
    # `nodes` ONLY, even though this play is wider: docker_tls runs on nodes
    # alone, so a startup.conf on the controller, the metrics host or the
    # registry was written by something else and is not ours to delete.
    - name: Clear a docker TLS drop-in left pinning an address this host no longer has
      ansible.builtin.include_role:
        name: docker_tls
        tasks_from: clear_stale_dropin
      when: "'nodes' in group_names"

    - name: Release the docker apt holds before installing
      ansible.builtin.dpkg_selections:
        name: "{{ item | regex_replace('=.*$', '') }}"
        selection: install
      loop: "{{ docker_apt_packages }}"
      when:
        - not (docker_packages_deferred | bool)
        - (item | regex_replace('=.*$', '')) in ansible_facts.packages
  roles:
    # The role has no switch for "everything but the packages", so the whole
    # role is skipped on a deferred node: docker is already installed,
    # configured from its repo and running there.
    - role: geerlingguy.docker
      when: not (docker_packages_deferred | bool)
      vars:
        docker_packages: "{{ docker_apt_packages }}"
        docker_packages_state: present
        docker_daemon_options: {}       # daemon.json is docker_config's
        docker_install_compose: false   # the standalone binary is unused
        docker_users: []                # no non-root docker access anywhere
    - docker_config
  post_tasks:
    - name: Re-gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Hold the docker packages
      ansible.builtin.dpkg_selections:
        name: "{{ item | regex_replace('=.*$', '') }}"
        selection: hold
      loop: "{{ docker_apt_packages }}"
      when:
        - not (docker_packages_deferred | bool)
        - (item | regex_replace('=.*$', '')) in ansible_facts.packages

# geerlingguy.postgresql's platform values come from playbooks/vars/
# Ubuntu-26.yml (it ships no Ubuntu-26 vars file of its own — see the header
# there). What this play sets is the ComputeStacks half, per
# roles/controller/README.md §Postgres:
#
#   * listen_addresses 127.0.0.1 — geerlingguy defaults to '*', and nothing
#     outside this host may reach the controller database;
#   * the application role and database DATABASE_URL points at.
#
# geerlingguy's default pg_hba (peer for local, md5 for 127.0.0.1/32) is
# already what DATABASE_URL and `cstacks database-backup` respectively need,
# so it is left alone. The peer-auth `root` SUPERUSER role that
# `database-backup` connects as is created by roles/controller — geerlingguy
# does not make it, and without it `cstacks upgrade` dies at pg_dump.
#
# Redis stays loopback-bound with NO requirepass: REDIS_HOST is interpolated
# bare into `redis://` URLs and the application has no password path. Both
# values are geerlingguy's defaults; they are restated because they are load
# bearing, not incidental.
- name: Controller infrastructure
  hosts: controller
  vars:
    postgresql_global_config_options:
      - option: unix_socket_directories
        value: "{{ postgresql_unix_socket_directories | join(',') }}"
      - option: log_directory
        value: log
      - option: listen_addresses
        value: 127.0.0.1
    postgresql_databases:
      - name: "{{ controller_postgres_database | default('cloudportal') }}"
        owner: "{{ controller_postgres_user | default('computestacks') }}"
    postgresql_users:
      - name: "{{ controller_postgres_user | default('computestacks') }}"
        password: "{{ postgres_password }}"
        role_attr_flags: SUPERUSER
    redis_port: "{{ cs_ports.redis }}"
    redis_bind_interface: 127.0.0.1
    redis_requirepass: ""
  roles:
    - vault                     # init/unseal + pki/docker mount + client cert
    - postgres_repo             # PGDG apt repo + pin for the pinned major.
                                # MUST precede geerlingguy.postgresql.
    - geerlingguy.postgresql
    - geerlingguy.redis
    - acme_web                  # nginx TLS terminator + acme.sh, before the
                                # portal: it owns 443 and proxies :3000
    - controller                # cstacks CLI, env file, portal container

- name: Node docker TLS
  hosts: nodes
  roles:
    - docker_tls                # vault-issued daemon certs (needs vault up)

- name: Metrics host
  hosts: metrics
  roles:
    - acme_web                  # the 3101/3102 vhosts prometheus/loki sit behind
    - metrics                   # prometheus + alertmanager + `ops` network (owner)
    - loki                      # joins `ops`, never creates it

- name: Registry host
  hosts: registry
  roles:
    - acme_web                  # writes /opt/container_registry/ssl
    - registry

- name: Backup server
  hosts: backup
  roles:
    - backup_server

- name: Node base stack
  hosts: nodes
  roles:
    - node_kernel               # sysctls, modules, BBR, inotify, IPv6 RA
    - haproxy                   # apt + certs/errors dirs (config comes from
                                # the controller at runtime)
    - node_observability        # cadvisor + fluentd containers, image preloads

- name: Host firewalls
  hosts: all
  roles:
    - firewall                  # own nftables table; never flush ruleset

# After the controller play, so the application keypair exists and both keys
# land in one pass.
- name: SSH trust
  hosts: controller:nodes:registry
  roles:
    - ssh_trust                 # controller keys -> node and registry root

- name: Seed controller
  hosts: controller
  roles:
    - controller_seed           # render manifest -> cstacks seed

- name: Node agents (requires seeded Node rows)
  hosts: nodes
  roles:
    - cs_agent                  # apt install, agent.yml, enroll, borg key

- name: Post-enrollment controller tasks
  hosts: controller
  roles:
    - controller_post_enroll    # datachannel + metadata backfills, test_connection

# The one play that is NOT any_errors_fatal (ansible.cfg makes the rest so):
# validate changes nothing, so a failing check on one host should not hide
# the results of every other host.
- name: Validate
  hosts: all
  any_errors_fatal: false
  roles:
    - validate
