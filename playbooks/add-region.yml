---
# Attach mode: provision a NEW region/az/node against an EXISTING, v1-built
# environment.
#
#   ansible-playbook -i inventories/<env> playbooks/add-region.yml --ask-vault-pass
#
# The existing shared hosts (controller, metrics, backup, registry) carry
# `existing_env: true` in the inventory and receive ONLY the enumerated
# additive write set from docs/contracts.md §Attach mode. The new node is
# built in full, exactly as site.yml builds one.
#
# With `dns_driver: powerdns`, the existing leader nameserver (ns_primary,
# also `existing_env: true`) receives the new az's load balancer records in
# cs_app_zone — apex A, wildcard CNAME and the `_cs-lb` ownership marker —
# and nothing else. They are written only for the new region's names, and a
# name holding records this provisioner cannot show are its own fails the
# run before anything is written (roles/powerdns/README.md). An inventory
# with no ns_primary, or `powerdns_manage_lb_records: false` on it, skips
# that play; the records are then the operator's, and preflight digs for
# them publicly as it does for dns_driver none.
#
# Read docs/attach-mode.md before running this. In short:
#   * the existing controller must already be upgraded to a release carrying
#     `rake bootstrap:apply`;
#   * `secret_key_base` in your vaulted secrets must be the EXISTING
#     controller's value, byte for byte (the controller prep play aborts
#     otherwise);
#   * `backup_host_path`, `backup_borg_remote_path` and `backups_key` describe
#     the EXISTING backup server (v1 defaults: /mnt and /usr/bin/borg) and have
#     no safe fallback;
#   * tailscale is OFF unless every host in the run says otherwise explicitly;
#   * the controller prep play restarts the portal (~30s of downtime).
#
# DO NOT `--limit` this playbook, and in particular not with a `region_*` or
# `az_*` pattern. Those groups are constructed from node host vars, so they
# contain the new node and nothing else: the controller, metrics and backup
# plays below would match zero hosts, and ansible SKIPS a play with no hosts
# rather than failing it. The run would end green having built the node and
# skipped the controller prep, the prometheus file_sd fragments, every v1
# firewall append and the seed itself — a node nothing can reach and the
# controller has never heard of. This inventory already describes exactly one
# new region; that is the scoping.
#
# Why `include_role` and not `roles:` here. Five of these steps run a role's
# alternate entry point (`tasks_from:`), which is a parameter of
# include_role/import_role and NOT of a play's `roles:` keyword — ansible
# silently ignores it there and runs `tasks/main.yml` instead. That is a
# greenfield converge against a live production controller
# (roles/controller/README.md, "Attach mode"). Every alternate entry point
# below is therefore a task.

# First, before anything gathers facts: ansible drops an unreachable host
# from the play and carries on without it, and in attach mode that host is
# usually a shared production one (roles/preflight/README.md). Tagged
# `always` so `make add-region-validate` checks it too.
- name: Every targeted host is reachable
  hosts: all
  gather_facts: false
  tasks:
    - name: Check every targeted host answers over ssh
      ansible.builtin.import_role:
        name: preflight
        tasks_from: reachable
      tags: [always]

# `any_errors_fatal` here regardless of ansible.cfg (which sets it for every
# play): one host failing preflight must stop the run before any host is
# changed.
- name: Preflight validation and attach-mode inventory checks
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  roles:
    - preflight
  tasks:
    # The three attach-mode inventory checks: every shared host flagged
    # `existing_env`, no new node flagged, and tailnet membership explicit on
    # every host. playbooks/firewall.yml runs the same file on an attach
    # inventory.
    - name: Run the attach-mode inventory checks
      ansible.builtin.include_role:
        name: preflight
        tasks_from: attach

# Early, before anything is built, so the records have the whole run to
# propagate before roles/validate checks them (`dns` on every nameserver,
# `lb_domain_public` through public resolution). Writes only the new
# region's names: powerdns_lb_records_nodes defaults to cs_new_nodes, and
# the other nodes of the fleet are not in this inventory.
#
# The `when:` is the "managed" expression roles/preflight and roles/validate
# use, spelled the same way; with no ns_primary this play has no hosts at
# all, and the expression is false, so preflight falls back to its public
# dig for hand-made records.
- name: Existing nameserver — the new az's load balancer records only
  hosts: ns_primary
  tasks:
    - name: Write the new az's load balancer records into the tenant zone
      ansible.builtin.include_role:
        name: powerdns
        tasks_from: lb_records
      when:
        - dns_driver | default('none') == 'powerdns'
        - groups['ns_primary'] | default([]) | length > 0
        - (hostvars[groups['ns_primary'][0]].powerdns_manage_lb_records | default(true)) | bool

# Gate for everything downstream: takes a pg_dump first, asserts the
# secret_key_base match, appends the two new environment keys (never
# rewrites), installs the v2 cstacks script, and recreates the portal.
- name: Controller prep (gated — pg_dump, append-only env, v2 cstacks, portal restart)
  hosts: controller
  tasks:
    - name: Prepare the existing controller for a new region
      ansible.builtin.include_role:
        name: controller
        tasks_from: attach_prep

- name: New node base system
  hosts: nodes
  roles:
    - common
    - node_exporter
    - role: tailscale
      when:
        - (tailscale_authkey | default('')) | length > 0
        - tailscale_enabled | default(false) | bool
    - role: ubuntu_pro
      when: (ubuntu_pro_token | default('')) | length > 0

# As in site.yml: the new node's data disk is set up before docker is
# installed, so neither daemon ever writes to the root disk
# (roles/node_storage/README.md).
- name: New node container storage
  hosts: nodes
  roles:
    - node_storage

# The same docker play as site.yml's, and the same live-node rule: a node that
# already carries tenant containers (roles/node_upgrade detect_live) -- a
# re-run after the region went into service -- never has docker upgraded
# here. When its docker drifts from the pins, the hold release,
# geerlingguy.docker and the re-hold are skipped for that node with a warning,
# and the pin rolls out through `make upgrade-docker ENV=<env>` in a
# maintenance window (contracts rule 3). A new, empty node installs exactly
# as before.
- name: New node docker
  hosts: nodes
  pre_tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Probe whether this node is live
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: detect_live

    - name: Decide whether docker's packages are left alone on this node
      ansible.builtin.set_fact:
        docker_packages_deferred: >-
          {{ (node_upgrade_live | default(false) | bool)
             and (node_upgrade_docker_drift | default(false) | bool) }}

    - name: Warn that docker on this live node is not upgraded by this run
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} is a LIVE node and its docker does
          not match the pins in versions.yml
          ({% for p in node_upgrade_drift_list %}{{ p.name }} installed
          {{ p.installed | default('nothing', true) }}, pinned
          {{ p.pin | default('any', true) }}{{ '; ' if not loop.last else '' }}{% endfor %}).
          add-region.yml does not upgrade docker on a live node -- doing so
          restarts dockerd under its tenants -- so docker's packages were left
          alone on this host. Run `make upgrade-docker ENV={{ inventory_dir | basename }}`
          in a maintenance window.
      when: docker_packages_deferred | bool

    # roles/docker_tls writes its ExecStart drop-in in a LATER play (it needs
    # Vault). A drop-in left from a previous converge pins the address this
    # host had THEN, and dockerd refuses to start if that address is gone --
    # killing the run before the task that would fix it. See the task file.
    - name: Clear a docker TLS drop-in left pinning an address this host no longer has
      ansible.builtin.include_role:
        name: docker_tls
        tasks_from: clear_stale_dropin

    - name: Release the docker apt holds before installing
      ansible.builtin.dpkg_selections:
        name: "{{ item | regex_replace('=.*$', '') }}"
        selection: install
      loop: "{{ docker_apt_packages }}"
      when:
        - not (docker_packages_deferred | bool)
        - (item | regex_replace('=.*$', '')) in ansible_facts.packages
  roles:
    - role: geerlingguy.docker
      when: not (docker_packages_deferred | bool)
      vars:
        docker_packages: "{{ docker_apt_packages }}"
        docker_packages_state: present
        docker_daemon_options: {}
        docker_install_compose: false
        docker_users: []
    - docker_config
  post_tasks:
    - name: Re-gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Hold the docker packages
      ansible.builtin.dpkg_selections:
        name: "{{ item | regex_replace('=.*$', '') }}"
        selection: hold
      loop: "{{ docker_apt_packages }}"
      when:
        - not (docker_packages_deferred | bool)
        - (item | regex_replace('=.*$', '')) in ansible_facts.packages

# The whole role, not `tasks_from: issue`. Its main.yml routes through
# issue.yml, which is the piece that reaches the EXISTING controller: it
# unseals that vault first (a v1 controller that ever rebooted is sealed and
# nobody notices, because certificates are static files), clamps the TTL to
# the CA's remaining lifetime, and writes nothing on the controller. The rest
# of main.yml — the listener drop-in on primary_ip:2376 — is what makes the
# new node dialable at all, so including only the issuance half would leave
# the certificate on disk and no listener for the controller to reach.
- name: New node docker TLS, issued from the existing Vault
  hosts: nodes
  roles:
    - docker_tls

# AFTER the docker plays, exactly as site.yml orders it (Docker hosts, then
# Node base stack). `node_observability` creates the cadvisor and fluentd
# containers and preloads the pinned images over the local docker socket, so a
# bare node has nothing for it to talk to until docker is installed: running it
# in the base play failed every attach with
#
#   Error connecting: ... FileNotFoundError(2, 'No such file or directory')
#
# which is the missing /var/run/docker.sock, not a registry problem.
- name: New node base stack
  hosts: nodes
  roles:
    - node_kernel               # sysctls, modules, BBR, inotify, IPv6 RA
    - haproxy                   # apt + certs/errors dirs (config comes from
                                # the controller at runtime)
    - node_observability        # cadvisor + fluentd containers, image preloads

- name: New node firewall
  hosts: nodes
  roles:
    - firewall                  # nftables; the new node is not `existing_env`

# The additive write set on the existing shared hosts, and nothing else.
# Each of these is a role's own attach entry point — see the role READMEs.
- name: Existing metrics host — prometheus file_sd fragments only
  hosts: metrics
  tasks:
    # Whole-file writes keyed by az, into v1's own paths
    # (/etc/prometheus/{node_exporter,cadvisor,haproxy}/<az>.yml). Prometheus
    # picks them up within one scrape interval on its own, so nothing is
    # restarted or reloaded here.
    - name: Render this new region's prometheus file_sd fragments
      ansible.builtin.include_role:
        name: metrics
        tasks_from: file_sd

    # v1's INPUT-policy-DROP script blocks the new node's loki ingest and the
    # exporter scrape return path until its addresses are allowed.
    - name: Append the new node addresses to this host's firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: append

- name: Existing controller — firewall appends only
  hosts: controller
  tasks:
    # :3000 (the node's haproxy ACME backend), :2376 return traffic, the
    # enrollment path — v1 grants a peer its whole inbound set with one
    # blanket accept per address, which is what this appends.
    - name: Append the new node addresses to this host's firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: append

# roles/backup_server gates itself on `existing_env`: only tasks/account.yml
# runs, so v2's borg is never installed over the server's existing one. What
# it writes there is exactly one thing — `~cstacks/.ssh`, which cs_agent needs
# to drop the new node's key into. The repository path is only `stat`ed (v1's
# value is /mnt; chmod 0770 on it would clear world traverse for everything
# mounted underneath), and the existing account's shell and shadow entry are
# left as they are. The per-node authorized_keys entry is added later, by
# cs_agent.
- name: Existing backup server — account, repository path, firewall appends
  hosts: backup
  roles:
    - backup_server
  tasks:
    # The node's borg container dials this host over SSH. v1's script only
    # accepts 22 from anywhere when `default_allow_ssh` is true; with it
    # false, the new node's backups fail silently until its addresses are
    # allowed. Same append as the metrics and controller plays.
    - name: Append the new node addresses to this host's firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: append

# The controller trusts the new node over SSH (control-plane row #4: volumes,
# haproxy certificate deploy, LB reload). ssh_trust skips the controller's
# whole-file /root/.ssh/config render on an `existing_env` controller.
- name: SSH trust for the new node
  hosts: controller:nodes
  roles:
    - ssh_trust

# The attach manifest carries topology only — locations/regions/nodes/
# networks/load balancers plus the user-group region link. No settings, no
# DNS driver, no products. DRY_RUN=1 runs first and pauses for the operator.
#
# TWO-STEP ATTACH (docs/attach-mode.md). With
# `-e controller_seed_stop_after_preview=true` the seed prints the DRY_RUN
# preview and its fingerprint, removes the manifest and ends this play
# without applying anything; every play below then ends at its first task
# (the guard), and the run finishes green. The second run passes
# `-e controller_seed_expect_preview_sha256=<fingerprint>` and applies only
# that preview. `controller_seed_stop_after_preview_supported` is how the role
# knows it is running in a playbook that guards its later plays — site.yml
# does not, and the role refuses the stop there.
- name: Seed the new region
  hosts: controller
  vars:
    controller_seed_stop_after_preview_supported: true
  roles:
    - controller_seed

# Every play from here on starts with this guard, and tests/
# controller_seed_preview.yml fails if one does not: a play that ran after a
# preview stop would enroll an agent against a Node row that was never
# created. It ends the play when the stop was requested (the variable, as an
# extra var) or happened (the fact the seed sets on the controller), whichever
# this host can see. Tagged `always` so a `--tags` run cannot skip it.
- name: New node agent (requires the seeded Node row)
  hosts: nodes
  pre_tasks:
    - &preview_stop_guard
      name: End this play if the seed stopped after its preview
      ansible.builtin.meta: end_play
      when: >-
        (controller_seed_stop_after_preview | default(false) | bool)
        or ((groups['controller'] | default([]))
            | map('extract', hostvars, 'controller_seed_preview_stopped')
            | select('defined') | select | list | length > 0)
      tags: [always]
  roles:
    - cs_agent

# Scoped per new node (NODE=<hostname>) rather than fleet-wide: a fleet pass
# would re-PUT desired state to every existing node, and one unrelated
# failure would mask the result for the node being attached.
- name: Post-enrollment controller tasks
  hosts: controller
  pre_tasks:
    - *preview_stop_guard
  roles:
    - controller_post_enroll

# Not any_errors_fatal (ansible.cfg makes every other play so): validate
# changes nothing, and a failing check on one host should not hide the
# other's results.
- name: Validate the new region
  hosts: controller:nodes
  any_errors_fatal: false
  pre_tasks:
    - *preview_stop_guard
  roles:
    - validate

# Last, so it is the last thing a two-step attach's phase 1 prints. Skipped
# on every other run.
- name: Two-step attach summary
  hosts: controller
  gather_facts: false
  tasks:
    - name: Say that the run stopped after the preview
      ansible.builtin.debug:
        msg: >-
          STOPPED AFTER THE DRY_RUN PREVIEW. Nothing was applied to the
          controller database: no `cstacks seed` apply, no agent enrollment,
          no post-enrollment tasks, no validation. The new node is built and
          the additive writes on the shared hosts are in place. Review the
          preview above; to apply exactly it, run this playbook again with
          -e controller_seed_expect_preview_sha256={{ controller_seed_preview_sha256 | default('<fingerprint>') }}
      when: controller_seed_preview_stopped | default(false) | bool
      tags: [always]
