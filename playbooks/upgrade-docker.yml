---
# Rolling docker upgrade of the NODES, one at a time, inside a scheduled
# customer maintenance window. Never unattended.
#
#   make upgrade-docker ENV=<env>        (after bumping docker_apt_packages)
#   ansible-playbook -i inventories/<env> playbooks/upgrade-docker.yml --ask-vault-pass
#
# Per node (roles/node_upgrade/README.md has the full account): hold the node
# through `cs-agent maintenance on --wait`, record the running tenant
# containers, stop them, upgrade the OS with docker held and then docker to
# its pins, reboot if required, start exactly what was running, release the
# hold, wait for the controller to confirm -- then run roles/validate against
# that node before the next one starts.
#
# The FIRST FAILURE STOPS THE WHOLE RUN (`any_errors_fatal`,
# `max_fail_percentage: 0`) and leaves that node as the failure message
# describes. A targeted node that cannot be reached stops it before any node
# is touched. A node part-way through keeps its state in
# /var/lib/computestacks/upgrade/state.json, and re-running resumes it.
#
# Scope: `nodes` only, and never an `existing_env` (v1-built) host -- those
# are left out of the targets, not failed on. The controller, metrics and
# registry docker hosts are not upgraded by this playbook.
#
# Unlike add-region.yml, `--limit` is meaningful and safe here: every play
# targets nodes alone, and each node's upgrade is self-contained. `--limit
# <node>` is how a single failed node is resumed. `--check` runs the
# preflight and reports what each node would get, changing nothing.
#
# Requires cs-agent >= 3.4.0 on every node (checked, never installed) and a
# controller >= 9.8.0 (one that confirms agent holds), and every target's
# docker and containerd state on its data disk (roles/node_storage `ready`) --
# checked first, never set up here.

- name: Select the nodes this playbook upgrades
  hosts: nodes
  gather_facts: false
  tasks:
    # group_by rather than an assert: an existing_env node is simply not this
    # playbook's business. A host that says `existing_env: false` explicitly
    # is a new one, as everywhere else in the repo.
    - name: Group the provisioner-built nodes
      ansible.builtin.group_by:
        key: node_upgrade_targets
      when: not (existing_env | default(false) | bool)
      changed_when: false

# Before anything gathers facts: ansible drops an unreachable node from the
# play and carries on without it, so this fails the run instead, naming every
# targeted node that did not answer (roles/preflight/README.md).
- name: Every targeted node is reachable
  hosts: node_upgrade_targets
  gather_facts: false
  tasks:
    - name: Check every targeted node answers over ssh
      ansible.builtin.import_role:
        name: preflight
        tasks_from: reachable
      tags: [always]

# Every targeted node, in parallel, before any of them is touched: an agent
# too old across the fleet, a pin missing from the mirror or a downgrade in
# versions.yml fails here rather than after the first node has been taken
# down and brought back.
- name: Preflight every targeted node
  hosts: node_upgrade_targets
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    # First, before node_upgrade's own preflight: docker 29 keeps images and
    # container layers under /var/lib/containerd, so upgrading a node whose
    # docker and containerd state is not on its data disk would move every
    # layer onto the root disk. roles/node_storage's read-only probe and pure
    # classifier record the verdict on each target; the run_once assert below
    # fails every host if any target is not `ready`.
    - name: Probe and classify the container data disk
      vars:
        node_storage_classify_fail: false
      block:
        - name: Probe the container data disk
          ansible.builtin.include_role:
            name: node_storage
            tasks_from: probe

        - name: Classify the container data disk
          ansible.builtin.include_role:
            name: node_storage
            tasks_from: classify

    - name: Assert every targeted node keeps docker and containerd on its data disk
      ansible.builtin.assert:
        that:
          - (upgrade_docker_storage_not_ready | length) == 0
        fail_msg: >-
          {{ upgrade_docker_storage_not_ready | length }} node(s) do not keep
          docker and containerd on a data disk:
          {% for n in upgrade_docker_storage_not_ready %}{{ n }}
          ({{ hostvars[n].node_storage_state | default('not probed') }}{{ ': ' ~ hostvars[n].node_storage_reason
             if hostvars[n].node_storage_reason | default('') | length > 0 else '' }}){{ '; ' if not loop.last else '' }}{% endfor %}.
          A node built before the data-disk requirement must be rebuilt, or
          its data disk set up by site.yml / add-region.yml, before docker is
          upgraded on it. Nothing was changed on any node.
        success_msg: "every targeted node keeps docker and containerd on its data disk"
      vars:
        # Every target that is not `ready`, including one with no verdict.
        upgrade_docker_storage_not_ready: >-
          {{ groups['node_upgrade_targets'] | default([])
             | reject('in', groups['node_upgrade_targets'] | default([])
                            | map('extract', hostvars)
                            | selectattr('node_storage_state', 'defined')
                            | selectattr('node_storage_state', 'equalto', 'ready')
                            | map(attribute='inventory_hostname') | list)
             | list | sort }}
      run_once: true

    - name: Preflight checks
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: preflight

# One node at a time, upgrade then validate, before the next node starts. The
# validate checks for a node run on (or are delegated from the controller to)
# that node alone -- the same scoping add-region.yml relies on for its new
# node -- so nothing fleet-wide is re-asserted per node.
- name: Upgrade docker, one node at a time
  hosts: node_upgrade_targets
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Upgrade the node
      ansible.builtin.include_role:
        name: node_upgrade

    - name: Validate the node
      ansible.builtin.include_role:
        name: validate
