---
# Re-render and apply the host firewall, and nothing else.
#
#   make firewall ENV=<env>
#   make firewall ENV=<env> ARGS='--check --diff'     # show the table diff first
#   make lock-ssh ENV=<env>                           # the same, and refuse any
#                                                     # host left open to anywhere
#   ansible-playbook -i inventories/<env> playbooks/firewall.yml --ask-vault-pass
#
# For an inventory change that only the firewall reads — `firewall_allow_ssh_from`,
# `firewall_extra_allowed_ipv4` / `_ipv6`, `firewall_extra_input_rules`, a
# host's `ssh_port`, a peer's `primary_ip` / `public_ip`, tailnet membership
# or `tailscale_access_only` —
# applied without a full site.yml or add-region.yml run. roles/firewall reads
# inventory vars only (never facts), so what it renders here is exactly what
# the next full converge would render.
#
# Each host is treated exactly as the playbook that built it treats it:
#
#   greenfield inventory   every host not flagged `existing_env` gets the whole
#   (site.yml)             `inet cs_static` table re-rendered and applied, as in
#                          site.yml's "Host firewalls" play.
#   attach inventory       the nodes get the whole table, as in add-region.yml's
#   (add-region.yml; its   "New node firewall" play. The existing controller,
#   controller is          metrics and backup hosts get ONLY tasks/append.yml --
#   `existing_env`)        the new node addresses added to whichever firewall
#                          they run, never a re-render (docs/contracts.md
#                          rule 9) -- and every other existing host is not
#                          touched at all. So an ssh allowlist or ssh_port change
#                          never reaches an existing_env host from here; that
#                          host's firewall is not this repository's.
#
# As in the other entry points, every targeted host must first answer a ping
# (roles/preflight/tasks/reachable.yml), then preflight runs with its network
# checks (registries, load balancer DNS), the node data disk probe and the
# checks of settings the firewall never reads (public_ipv6, backup export)
# turned off: none of them bear on the firewall, and a firewall fix must not
# wait on an expired registry token. The inventory assertions -- ssh_port,
# ansible_port, the node vars, root connection -- all still run, and an
# attach inventory also gets add-region.yml's attach-mode checks.
#
# `--limit` is safe and meaningful: every rule is rendered from inventory, so
# a limited host's table still lists every peer. Limit to the hosts whose OWN
# table changes -- a changed ssh allowlist or ssh_port on one host is that
# host; a changed node address is every host that accepts from nodes (the
# controller and the metrics host) as well as the node.
#
# `--check --diff` renders each table and shows the diff without installing it
# or restarting cs-firewall.service. (On a v2-built existing_env host whose
# /etc/nftables.d/cs-peers.nft does not exist yet -- one never attached to --
# check mode cannot show the appends, because the file is only created for
# real.)
#
# LOCKOUT. The new table is applied by restarting cs-firewall.service, and the
# connection in progress survives it (`ct state established`); the NEXT one
# would not. Three things stand between a narrowed `firewall_allow_ssh_from`
# and a lockout (README.md, "Restricting ssh"):
#
#   * preflight refuses the run, before any change, on a host whose list does
#     not cover the address this run reaches it from;
#   * roles/firewall applies each table with an automatic rollback, and
#     cancels it only once a fresh ssh connection has come back through it;
#   * with `-e firewall_ssh_allow_this_run=true` -- honored here and nowhere
#     else, which is what `firewall_ssh_allow_this_run_permitted` below marks
#     -- the refusal is skipped and this run's source is allowed for
#     `firewall_ssh_run_allow_timeout` instead.
#
# The controller (on nodes and the registry) and every node (on a backup
# server) are accepted without being listed. When any host's ssh is narrowed,
# the run ends with roles/validate's `ssh` and `borg` checks, which prove those
# two runtime paths still work. Moving sshd itself is not done here -- see the
# README, "Changing the firewall".

# First, before anything gathers facts: ansible drops an unreachable host
# from the play and carries on without it, so this fails the run instead,
# naming every host that did not answer (roles/preflight/README.md).
- name: Every targeted host is reachable
  hosts: all
  gather_facts: false
  tasks:
    - name: Check every targeted host answers over ssh
      ansible.builtin.import_role:
        name: preflight
        tasks_from: reachable
      tags: [always]

# `any_errors_fatal` here regardless of ansible.cfg (which sets it for every
# play): one host failing preflight must stop the run before any host's
# firewall is changed.
- name: Preflight validation
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  vars:
    firewall_ssh_allow_this_run_permitted: true
    preflight_verify_registries: false
    preflight_check_app_domain_dns: false
    preflight_check_node_storage: false
    preflight_check_public_ipv6: false
    preflight_check_backup_export: false
  roles:
    - preflight
  tasks:
    - name: Run the attach-mode inventory checks
      ansible.builtin.include_role:
        name: preflight
        tasks_from: attach
      when: hostvars[groups['controller'] | first].existing_env | default(false) | bool

# The whole table, on every host the playbook that built it renders one for.
# Inventory only, so no facts are needed here (preflight gathered them anyway).
- name: Host firewalls
  hosts: all
  gather_facts: false
  vars:
    firewall_ssh_allow_this_run_permitted: true
  tasks:
    - name: Render and apply the ComputeStacks nftables table
      ansible.builtin.include_role:
        name: firewall
      when:
        - not (existing_env | default(false) | bool)
        - >-
          'nodes' in group_names
          or not (hostvars[groups['controller'] | first].existing_env | default(false) | bool)

# add-region.yml's additive write set on the existing shared hosts, and the
# same three groups: the new node addresses appended, nothing re-rendered.
# Idempotent -- a re-run against an unchanged inventory changes nothing.
- name: Existing shared hosts — new node address appends only
  hosts: controller:metrics:backup
  gather_facts: false
  tasks:
    - name: Append the new node addresses to this host's firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: append
      when: existing_env | default(false) | bool

# The runtime ssh paths a narrowed firewall must keep open, checked after the
# tables are in place: the controller's root ssh to each node and the
# registry, each node's borg ssh to its site's backup server (roles/validate
# `ssh` and `borg`). Each runs only where the ssh it crosses is narrowed; both
# change nothing. Not any_errors_fatal, like every validate play, so one
# failure does not hide the others. A `--limit` that leaves out the nodes
# skips the borg check, which runs from them.
- name: Validate the ssh paths a narrowed firewall keeps open
  hosts: nodes:registry
  gather_facts: false
  any_errors_fatal: false
  tasks:
    - name: Assert the controller can reach this host over root ssh
      ansible.builtin.include_role:
        name: validate
        tasks_from: ssh
      when:
        - not ansible_check_mode
        - not (existing_env | default(false) | bool)
        - firewall_allow_ssh_from | default([]) | length > 0

    - name: Assert this node can reach its backup server as the borg user
      ansible.builtin.include_role:
        name: validate
        tasks_from: borg
      when:
        - not ansible_check_mode
        - "'nodes' in group_names"
        - not (existing_env | default(false) | bool)
        - cs_site in cs_site_backup_hosts
        - hostvars[cs_site_backup_hosts[cs_site]].firewall_allow_ssh_from | default([]) | length > 0
