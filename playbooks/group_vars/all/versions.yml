---
# Every externally-sourced version, in one place. Nothing floats except the
# controller minor tag, which is a deliberate rolling release channel.
#
# Items marked VERIFY must be confirmed by the owning wave before its DoD is
# met (check the named source), then the marker removed.

# Controller (rolling minor line — `cstacks upgrade` pulls latest patch)
controller_image_repo: "ghcr.io/computestacks/controller"
controller_image_tag: "9.7"
# Optional enterprise repo override + pull credentials (vaulted):
# controller_image_repo: "registry.example.com/computestacks/controller-enterprise"
# controller_registry_username / controller_registry_password in secrets.yml

# cs-agent — apt PACKAGE version. Historically this was NOT the agent's
# self-reported version (package 1.5.0 shipped backup-agent 2.0.0), but since
# the node-agent rename the deb is cut straight from the git tag, so package
# == agent version. Verified 2026-08-28 (wave D) against
# https://repo.computestacks.com/public/dists/stable/main/binary-amd64/Packages
# — newest listed package is 3.3.0, which is agent v3.3.0 (the pool is
# append-only, so every older version stays installable for a rollback).
cs_agent_apt_version: "3.3.0"
cs_agent_apt_repo: "https://repo.computestacks.com/public"
cs_agent_apt_key_url: "https://repo.computestacks.com/public/computestacks.gpg.asc"

# Borg — client (container image) and server (upstream release binary) MUST be
# the same borg version; bump these two together, deliberately, never via
# unattended upgrades. Verified 2026-08-28 against cs-docker-images/cs-docker-borg.
borg_version: "1.4.4"
borg_release_gpg_fingerprint: "6D5BEF9ADD2075805747B70F9F88FB52FAF7B393"
borg_image: "ghcr.io/computestacks/cs-docker-borg:1.6"
borg_binary_path: "/opt/computestacks/bin/borg"   # attach mode overrides to the existing server's path

# Node image preloads (controller expects these present)
bastion_image: "ghcr.io/computestacks/cs-docker-bastion:v2"
xtrabackup24_image: "ghcr.io/computestacks/cs-docker-xtrabackup:2.4"
xtrabackup80_image: "ghcr.io/computestacks/cs-docker-xtrabackup:8.0"

# Metrics / logging stack (containers, exact tags).
# Verified 2026-08-28 (wave E): the v2.53 LTS line went EOL 2025-07-31 and its
# successor LTS (3.5) is also now past its 2026-07-31 support window --
# Prometheus's currently-active LTS line is 3.13 (2026-07-01 to 2027-07-31),
# latest patch v3.13.2 (docker hub prom/prometheus, confirmed present,
# linux/amd64). Pinning the active LTS line rather than a dead one, per the
# versions.yml note that VERIFY may resolve to "the v2.53 LTS line OR newer
# stable". The v2->v3 jump does not affect anything this role's templates
# generate: scrape_configs/file_sd_configs/rule_files/alerting sections are
# unchanged across the major version; the only user-visible v3 changes are a
# new default web UI and default-on UTF-8 metric/label names, neither of
# which this repo's config relies on.
prometheus_image: "prom/prometheus:v3.13.2"
# Verified 2026-08-28 (wave E): v0.34.0 is the latest stable tag on Docker Hub
# (prom/alertmanager); alertmanager does not publish a separate LTS line.
alertmanager_image: "prom/alertmanager:v0.34.0"
loki_image: "grafana/loki:2.9.10"                  # fleet parity; controller queries Loki API v1
# Verified 2026-08-28 (wave D): the tag exists on Docker Hub with a linux/amd64
# manifest. The image's tags track the Loki release line, so this stays pinned
# EQUAL to loki_image — bump the two together, or the node ships with a plugin
# built against a different Loki than the one receiving it. (2.9.17 is the
# newest patch of the 2.9 line; wave E owns moving the line as a pair.)
fluentd_loki_image: "grafana/fluent-plugin-loki:2.9.10"
# Verified 2026-08-28 (wave D): `v0.54.0` does NOT exist upstream — that line is
# published unprefixed (`0.54.0`) and only later releases carry the `v`. Pinned
# to the newest release of the current line, which publishes both spellings and
# has a linux/amd64 manifest (index sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe).
cadvisor_image: "ghcr.io/google/cadvisor:v0.60.5"

# Infra containers
# Verified 2026-08-28 (wave B): latest 1.x release line; hashicorp/vault:1.21.4
# exists on Docker Hub (linux/amd64). Vault 2.0 is out but untested here and
# this PKI is retired by cs-agent Phase 4 — stay on 1.x. v1 floated `latest`.
vault_image: "hashicorp/vault:1.21.4"
# Verified 2026-08-28 (wave G): nginx's even minor numbers are the stable
# line, odd ones are mainline. 1.28 has been superseded — the current stable
# line is 1.30 and its newest patch on Docker Hub (library/nginx) is 1.30.4,
# updated 2026-08-25. Pinned to the exact patch rather than the 1.30 alias so
# a converge cannot silently move the TLS terminator under the fleet.
nginx_image: "nginx:1.30.4"

# Docker engine. Installed by geerlingguy.docker (requirements.yml) and then
# HELD by playbooks/site.yml, so an unattended apt upgrade can never restart
# every container on a node under a live region (v1 did the same with
# `apt-mark hold`). The hold is released before each install, so editing this
# list still rolls through on a rerun (contracts rule 3).
#
# VERIFY (wave 4J, 2026-08-28): download.docker.com/linux/ubuntu publishes no
# suite for Ubuntu 26.04 yet -- the newest is `resolute` (25.10) -- so there
# is no apt version string that can honestly be pinned here today, and the
# geerlingguy repo line (built from `ansible_distribution_release`) will not
# resolve until Docker ships that suite. Until then the entries are bare
# package names: the first converge installs whatever the repository offers
# and the hold freezes it there. Add an exact apt version per entry to make
# every host reproducible, e.g.
#   - "docker-ce=5:28.5.2-1~ubuntu.26.04~<codename>"
# (each package has its own version scheme -- containerd.io and the buildx
# plugin do NOT share docker-ce's, so one shared version variable would be
# wrong).
docker_apt_packages:
  - docker-ce
  - docker-ce-cli
  - docker-ce-rootless-extras
  - containerd.io
  - docker-buildx-plugin

# node_exporter is the distro package on every host (the plan keeps it that
# way), installed and held by roles/node_exporter. Empty means "whatever
# 26.04 currently ships, then held"; set an exact apt version to pin it.
# VERIFY (wave 4J): no Ubuntu 26.04 archive is available to read a real
# version string from yet.
node_exporter_apt_version: ""

# Packages
# Verified 2026-08-28 (wave 4J): Ubuntu 26.04 'resolute' ships PostgreSQL 18
# (its `postgresql` metapackage is 18+290ubuntu1) and carries NO postgresql-17
# in resolute, resolute-updates or resolute-backports. 17 is the major the
# controller's schema and CI are validated against, so the fleet takes it from
# PGDG instead: roles/postgres_repo configures apt.postgresql.org's
# resolute-pgdg suite (postgresql-17 is 17.11-1.pgdg26.04+2 there) and pins
# apt to it. That role runs before geerlingguy.postgresql on the controller
# and before roles/powerdns on the nameservers -- the only two places a
# postgres package is installed. Changing this major means changing
# playbooks/vars/Ubuntu-26.yml with it, and re-validating the controller repo.
postgresql_version: 17
# PGDG's long-lived signing key, checksum-pinned: roles/postgres_repo fetches
# it and refuses anything else. Verified 2026-08-28. A deliberate upstream
# rotation means updating this checksum (and the URL if it moves) in one
# commit; any other change is a fetch failure, which is the intent.
pgdg_key_url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
pgdg_key_checksum: "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76"
# acme.sh: pinned release tag, cloned at that tag, --auto-upgrade DISABLED.
# Verified 2026-08-28 (wave G): 3.1.4 is the latest upstream release
# (acmesh-official/acme.sh releases/latest). Note the tag carries NO leading
# 'v' on the 3.x line, unlike the old v2.x tags -- the role clones this string
# verbatim, so do not add one.
acme_sh_version: "3.1.4"
