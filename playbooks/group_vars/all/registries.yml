---
# The composed private-registry login list every role reads. It lives at play
# scope rather than inside roles/docker_config because two roles in two
# different plays need the same answer: roles/preflight verifies the
# credentials before any host is touched, and roles/docker_config writes them
# to /root/.docker/config.json — and a role's vars/ are not visible to a role
# that ran in an earlier play.
#
# NOTHING operator-facing may be DEFAULTED in this file. Playbook group_vars
# outrank inventory group_vars, so a `docker_registries: []` here would
# silently discard the value an operator wrote in their inventory's
# secrets.yml — the feature would no-op and the failure would surface as a
# `docker pull` denial deep in the controller play. Operator inputs are read
# through `| default(...)` at the point of use instead. (versions.yml sets
# values here on purpose: those are repo-owned pins, not operator inputs.)
#
# The operator-facing input is `docker_registries`, one entry per registry
# host, documented in inventories/example/group_vars/all/secrets.yml:
#
#   docker_registries:
#     - registry: registry.gitlab.com
#       username: gitlab+deploy-token-42
#       password: "{{ gitlab_deploy_token }}"

# The registry host of the controller image reference, by docker's own rule:
# the first slash-separated component is a registry host only when it contains
# a '.' or a ':', or is exactly 'localhost'. Everything else is a Docker Hub
# namespace — `cmptstks/controller` is Hub's `cmptstks` org, not a host called
# `cmptstks`, which is what a naive split('/')[0] would try to log in to.
cs_controller_registry_head: "{{ (controller_image_repo | default('')).split('/')[0] }}"

cs_controller_registry: >-
  {{ cs_controller_registry_head
     if ('/' in (controller_image_repo | default(''))
         and (cs_controller_registry_head is search('[.:]')
              or cs_controller_registry_head == 'localhost'))
     else 'docker.io' }}

# The repository path the registry API wants: the reference with its registry
# host stripped off.
cs_controller_repository: >-
  {{ controller_image_repo.split('/', 1)[1]
     if (controller_image_repo | default('')).startswith(cs_controller_registry ~ '/')
     else controller_image_repo | default('') }}

# controller_registry_username / controller_registry_password are the older,
# single-registry spelling of the same thing. They are folded in on controller
# hosts rather than handled separately, so there is exactly one login
# implementation. An explicit docker_registries entry for the same host wins.
cs_controller_registry_entries: >-
  {{ [{'registry': cs_controller_registry,
       'username': controller_registry_username | default(''),
       'password': controller_registry_password | default('')}]
     if ('controller' in group_names
         and (controller_registry_username | default('')) | length > 0)
     else [] }}

# Every registry this host authenticates to.
cs_registry_logins: >-
  {{ (docker_registries | default([]))
     + (cs_controller_registry_entries
        | rejectattr('registry', 'in',
                     docker_registries | default([]) | map(attribute='registry') | list)
        | list) }}
