[defaults]
inventory = inventories/example
# Persistent fact cache: hostvars of hosts OUTSIDE the current --limit carry
# no live facts, so the blessed ansible_local fallback (docs/contracts.md
# §Facts exception) only works if facts persist between runs. The cache never
# expires (timeout 0) because a host that is not in the play never refreshes
# it, and an expired entry is indistinguishable from an absent one.
#
# `gathering` MUST stay `implicit` (the default), NOT `smart`. `smart` skips
# the gather for a host whose facts are already cached, and with timeout 0
# they are cached forever -- so every host in the play would keep re-using
# the facts from its first-ever converge. Verified: under `smart` a second
# run against the same host reports an unchanged `ansible_date_time.epoch`
# and no "Gathering Facts" task at all. `implicit` re-gathers every host that
# IS in the play (fresh facts, contracts rule 3) and still resolves cached
# facts from hostvars for every host that is NOT.
gathering = implicit
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 0
roles_path = roles:galaxy_roles
collections_path = ./collections
retry_files_enabled = False
# Every play stops on the first failed or unreachable host, on every host.
# Without it ansible drops that host from the play and carries on with the
# rest, and every later play targeting it matches nothing and is SKIPPED --
# a run that loses the backup server early "succeeds" at everything else
# and fails much later, somewhere unrelated. A converge is idempotent;
# stopping and re-running is always the cheaper outcome. The preflight plays
# and upgrade-docker.yml also set it as a play keyword, so they do not
# depend on this file; the two validate plays turn it off, because they
# change nothing and one host's failed check should not hide the others'.
# roles/preflight/tasks/reachable.yml turns it off for its probe on purpose.
# Mind it in a new `block:`/`rescue:` on a multi-host play: the rescue runs
# for the failing host, but every other host in the play is failed with it.
any_errors_fatal = True
host_key_checking = True
interpreter_python = auto_silent
forks = 20
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[inventory]
enable_plugins = ansible.builtin.yaml, ansible.builtin.constructed

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ConnectionAttempts=5
