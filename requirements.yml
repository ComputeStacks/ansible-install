---
# Pinned external dependencies. Bump deliberately; never float.
# When bumping, verify each pin still resolves with
# `ansible-galaxy install -r requirements.yml` and adjust to the latest
# release of the same major if a pin is unavailable.
collections:
  - name: community.general
    version: "==10.7.0"
  - name: community.crypto
    version: "==2.26.1"
  - name: community.docker
    version: "==4.6.1"
  - name: community.postgresql
    version: "==3.14.1"
  # Verified 2026-10-14 against galaxy.ansible.com and the collection's
  # CHANGELOG.rst: 2.2.2 is the newest release (requires ansible-core >= 2.16).
  # Only `mount` and `authorized_key` are used here; neither has a breaking
  # change since 1.6.2, and 2.2.1 fixed a symlink privilege escalation in
  # authorized_key.
  - name: ansible.posix
    version: "==2.2.2"
  # Collection (role artis3n.tailscale.machine), replacing the standalone
  # galaxy role of the same name. 1.2.1 is the latest release, verified
  # 2026-10-14 on galaxy.ansible.com and GitHub
  # artis3n/ansible-collection-tailscale (requires_ansible >=2.18.0).
  - name: artis3n.tailscale
    version: "==1.2.1"

roles:
  # Verified 2026-10-14 against galaxy.ansible.com and the GitHub tags of
  # geerlingguy/ansible-role-docker: 8.0.0 is the newest release. It writes
  # the Docker source as deb822 (/etc/apt/sources.list.d/docker.sources, key
  # at /etc/apt/keyrings/docker.asc) and itself deletes the docker.list that
  # 7.x wrote, and it drops the `docker_apt_repository` override (there is no
  # longer a suite override; see inventories/example/group_vars/all/main.yml).
  - name: geerlingguy.docker
    version: "8.0.0"
  - name: geerlingguy.postgresql
    version: "4.0.0"
  - name: geerlingguy.redis
    version: "1.8.0"
