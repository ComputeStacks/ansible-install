---
# Wave 3G syntax-check harness. NOT a converge — site.yml owns the real play
# ordering (docs/contracts.md). Run:
#
#   ansible-playbook --syntax-check tests/wave3g.yml
#
# group_vars under playbooks/ are not auto-loaded for a playbook that lives
# outside that directory, so the two contract files are loaded explicitly.
- name: Controller — cstacks CLI, environment file, portal container
  hosts: controller
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - acme_web
    - controller

- name: Metrics host — the prometheus and loki TLS vhosts
  hosts: metrics
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - acme_web

- name: Registry host — TLS terminator and the registry filesystem
  hosts: registry
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - acme_web
    - registry

# Attach-mode entry point: add-region.yml runs just this against an existing
# v1 controller (existing_env: true). Kept here so a change that breaks the
# tasks_from entry point fails the syntax check.
- name: Attach-mode entry point — controller prep only
  hosts: controller
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  tasks:
    - name: Prepare the existing controller for a new region
      ansible.builtin.include_role:
        name: controller
        tasks_from: attach_prep
