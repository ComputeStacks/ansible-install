---
# Wave 2D syntax-check harness. NOT a converge — playbooks/site.yml owns the
# real play ordering (docs/contracts.md), in particular that cs_agent runs
# AFTER the controller_seed play has created the Node rows. Run:
#
#   ansible-playbook --syntax-check tests/wave2d.yml
#
# group_vars under playbooks/ are not auto-loaded for a playbook that lives
# outside that directory, so the two contract files are loaded explicitly.
- name: Shared backup server
  hosts: backup
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - backup_server

- name: Node load balancer and observability stack
  hosts: nodes
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - haproxy
    - node_observability

- name: Node agent, which really runs after the controller_seed play
  hosts: nodes
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - cs_agent

# Entry points reached on their own — re-enrolling a node, and adding v2's
# borg to an existing backup server. Kept here so a change that breaks them
# fails the syntax check.
- name: Standalone entry points
  hosts: nodes
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  tasks:
    - name: Re-read this node's agent token hash from the controller
      ansible.builtin.include_role:
        name: cs_agent
        tasks_from: enroll
      tags: [enroll]
