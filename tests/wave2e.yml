---
# Wave 2E syntax-check harness. NOT a converge — site.yml owns the real play
# ordering (docs/contracts.md). Run:
#
#   ansible-playbook --syntax-check tests/wave2e.yml
#
# group_vars under playbooks/ are not auto-loaded for a playbook that lives
# outside that directory, so the two contract files are loaded explicitly.
- name: Metrics host — prometheus, alertmanager, loki
  hosts: metrics
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  roles:
    - metrics
    - loki

# Attach-mode entry point: add-region.yml runs just this against an existing
# v1 metrics host (existing_env: true), scoped with --limit to the new
# node's az. Kept here so a change that breaks the tasks_from entry point
# fails the syntax check.
- name: Attach-mode entry point — new region's file_sd fragments only
  hosts: metrics
  gather_facts: false
  vars_files:
    - ../playbooks/group_vars/all/ports.yml
    - ../playbooks/group_vars/all/versions.yml
  tasks:
    - name: Render this new region's prometheus file_sd fragments
      ansible.builtin.include_role:
        name: metrics
        tasks_from: file_sd
