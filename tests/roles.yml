---
# Per-role syntax harness. NOT a converge — playbooks/site.yml and
# playbooks/add-region.yml own the real play ordering (docs/contracts.md).
#
#   ansible-playbook --syntax-check tests/roles.yml
#
# It exists for two things the two real playbooks cannot cover:
#
#   1. every role in isolation, so a role that no play happens to reach
#      still gets parsed;
#   2. every reusable task-file entry point (`tasks_from:`), including the
#      ones only another role includes — a change that breaks one of those
#      would otherwise only surface at converge time.
#
# `tests/group_vars` is a SYMLINK to `playbooks/group_vars`, and it has to be.
#
# Ansible auto-loads group_vars from the directory holding the playbook, so a
# harness living outside playbooks/ sees none of the contract files. Loading
# them per play with `vars_files:` looks equivalent and is not: play vars
# belong to the host currently executing and are NOT part of any other host's
# `hostvars`. `playbooks/group_vars/all/sites.yml` builds its site maps out of
# `map('extract', hostvars, 'cs_site')`, so under `vars_files` every one of
# them collapses to Undefined with
# `object of type 'HostVarsVars' has no attribute 'cs_site'` — while
# playbooks/site.yml, which gets the same file as real group_vars for `all`,
# resolves it fine. Verified both ways.
#
# --syntax-check never templates a variable, so none of that is visible until
# the harness is actually run. The symlink means there is nothing to keep in
# step: every file under playbooks/group_vars/all/ (ports, versions,
# registries, sites) is loaded here exactly as the real playbooks load it.

- name: Every host — preflight, base system, firewall, validate
  hosts: all
  gather_facts: false
  roles:
    - preflight
    - common
    - node_exporter
    - tailscale
    - ubuntu_pro
    - firewall
    - ssh_trust
    - validate

- name: Controller — vault, TLS terminator, portal, seeding, backfills
  hosts: controller
  gather_facts: false
  roles:
    - docker_config
    - vault
    - postgres_repo
    - acme_web
    - controller
    - controller_seed
    - controller_post_enroll

- name: Nodes — kernel, docker TLS, haproxy, observability, agent
  hosts: nodes
  gather_facts: false
  roles:
    - node_kernel
    - docker_config
    - docker_tls
    - haproxy
    - node_observability
    - cs_agent
    - node_storage
    - node_upgrade              # playbooks/upgrade-docker.yml, not site.yml

- name: Metrics host — prometheus, alertmanager, loki
  hosts: metrics
  gather_facts: false
  roles:
    - acme_web
    - metrics
    - loki

- name: Registry host — TLS terminator and the registry filesystem
  hosts: registry
  gather_facts: false
  roles:
    - acme_web
    - registry

- name: Backup server
  hosts: backup
  gather_facts: false
  roles:
    - backup_server

- name: Nameservers
  hosts: nameservers
  gather_facts: false
  roles:
    - postgres_repo
    - powerdns

# The alternate entry points. Most are what add-region.yml (and firewall.yml)
# calls; the two vault ones are included by docker_tls rather than by a play,
# so nothing else parses them.
- name: Reusable task-file entry points
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Ensure the controller vault is unsealed
      ansible.builtin.include_role:
        name: vault
        tasks_from: unseal

    - name: Compute the clamped certificate TTL
      ansible.builtin.include_role:
        name: vault
        tasks_from: ca_ttl

    - name: Issue the node docker daemon certificate
      ansible.builtin.include_role:
        name: docker_tls
        tasks_from: issue

    - name: Clear a stale docker TLS drop-in before the daemon starts
      ansible.builtin.include_role:
        name: docker_tls
        tasks_from: clear_stale_dropin

    - name: Prepare an existing controller for a new region
      ansible.builtin.include_role:
        name: controller
        tasks_from: attach_prep

    - name: Render a new region's prometheus file_sd fragments
      ansible.builtin.include_role:
        name: metrics
        tasks_from: file_sd

    - name: Run the attach-mode inventory checks
      ansible.builtin.include_role:
        name: preflight
        tasks_from: attach

    - name: Check every targeted host answers over ssh
      ansible.builtin.include_role:
        name: preflight
        tasks_from: reachable

    - name: Append new node addresses to an existing host's firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: append

    - name: Append new node addresses to an existing v2 firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: v2_append

    # Pure; roles/preflight includes it on every new node.
    - name: Check the backup export settings
      ansible.builtin.include_role:
        name: cs_agent
        tasks_from: export_check

# The powerdns entry points. add-region.yml includes `lb_records` against an
# existing ns_primary; `lb_records_plan` is the pure step it (and
# tests/lb_records_plan.yml) includes.
- name: Nameserver task-file entry points
  hosts: ns_primary
  gather_facts: false
  tasks:
    - name: Write the load balancer records into the tenant zone
      ansible.builtin.include_role:
        name: powerdns
        tasks_from: lb_records

    - name: Plan the load balancer records
      ansible.builtin.include_role:
        name: powerdns
        tasks_from: lb_records_plan

# The public_ipv6 entry points: preflight's check and controller_seed's
# address step, which their main.yml include, and the pure plan
# tests/lb_public_ipv6.yml drives.
- name: Load balancer public IPv6 task-file entry points
  hosts: controller
  gather_facts: false
  tasks:
    - name: Check every public_ipv6 that is set
      ansible.builtin.include_role:
        name: preflight
        tasks_from: public_ipv6

    - name: Add the load balancer public IPv6 addresses
      ansible.builtin.include_role:
        name: controller_seed
        tasks_from: lb_public_ipv6

    - name: Plan the load balancer public IPv6 addresses
      ansible.builtin.include_role:
        name: controller_seed
        tasks_from: lb_public_ipv6_plan

# The node_upgrade entry points. `detect_live` is the live-node probe that
# site.yml's and add-region.yml's docker plays and roles/common's reboot step
# include; `preflight` is upgrade-docker.yml's fleet-wide first pass; `select`
# and `classify_on` are the pure rules tests/node_upgrade_select.yml drives.
- name: Node upgrade task-file entry points
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Probe whether the node is live
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: detect_live

    - name: Run the upgrade preflight
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: preflight

    - name: Select the containers to record
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: select

    - name: Classify a cs-agent maintenance on result
      ansible.builtin.include_role:
        name: node_upgrade
        tasks_from: classify_on

# The node_storage entry points. `probe` (read-only) and `classify` (pure) are
# what preflight, validate and upgrade-docker.yml include to check the data
# disk before anything changes; tests/node_storage_classify.yml drives
# `classify` alone; `apply` is the converge step main.yml runs after them.
- name: Node storage task-file entry points
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Probe the data disk
      ansible.builtin.include_role:
        name: node_storage
        tasks_from: probe

    - name: Classify the data disk
      ansible.builtin.include_role:
        name: node_storage
        tasks_from: classify

    - name: Put container storage on the data disk
      ansible.builtin.include_role:
        name: node_storage
        tasks_from: apply
