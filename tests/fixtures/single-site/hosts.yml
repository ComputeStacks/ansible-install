---
# FROZEN single-site regression fixture. Do not add a second site here, and
# do not "keep it in sync" with inventories/example — the whole point is that
# it does not move.
#
# inventories/example describes a TWO-site environment, because the site model
# has to be documented by construction. That makes it useless as the baseline
# for "a single-site inventory still behaves exactly as it did before sites
# existed", which is the regression that matters most (docs/contracts.md
# §Site scoping: every host lands in the site called `default` and every map
# has exactly one key). This directory is that baseline: a byte-for-byte copy
# of inventories/example as it stood before the site work, with `site` set
# nowhere at all.
#
# Use it by rendering against it and diffing the result against the same
# render on the pre-change tree:
#
#   ansible-inventory -i tests/fixtures/single-site --graph
#   ansible-playbook --syntax-check -i tests/fixtures/single-site playbooks/site.yml
#   ansible-playbook -i tests/fixtures/single-site playbooks/site.yml --check --diff
#
# It carries no real hostnames, addresses or credentials — RFC 5737 / RFC 1918
# and example.com only (docs/contracts.md rule 6). The secrets file is the
# sample one, unencrypted and full of CHANGEME, exactly as the example ships it.
#
# Vocabulary: `region` == controller Location (e.g. exm001);
#             `az`     == controller Region (e.g. exm-001), exactly ONE node per az.
all:
  children:
    controller:
      hosts:
        ctl1:
          ansible_host: 192.0.2.10
          hostname: ctl1
          primary_ip: 10.100.0.10
          public_ip: 192.0.2.10

    metrics:            # shared by ALL regions
      hosts:
        metrics1:
          ansible_host: 192.0.2.11
          hostname: metrics1
          primary_ip: 10.100.0.11
          public_ip: 192.0.2.11

    backup:             # shared by ALL regions
      hosts:
        backup1:
          ansible_host: 192.0.2.12
          hostname: backup1
          primary_ip: 10.100.0.12
          public_ip: 192.0.2.12

    registry:
      hosts:
        registry1:
          ansible_host: 192.0.2.13
          hostname: registry1
          primary_ip: 10.100.0.13
          public_ip: 192.0.2.13

    # `powerdns_name` is REQUIRED on every nameserver and must be unique: it
    # is that server's FQDN, and it becomes the NS records of the tenant
    # zone (`controller_seed` asserts presence and uniqueness; the leader
    # also uses the first one as the zone's SOA identity). These names must
    # resolve publicly to the addresses below.
    nameservers:
      children:
        ns_primary:
          hosts:
            ns1:
              ansible_host: 198.51.100.10
              hostname: ns1
              primary_ip: 198.51.100.10
              public_ip: 198.51.100.10
              powerdns_name: ns1.example.com
        ns_followers:
          hosts:
            ns2:
              ansible_host: 198.51.100.11
              hostname: ns2
              primary_ip: 198.51.100.11
              public_ip: 198.51.100.11
              powerdns_name: ns2.example.com

    nodes:
      hosts:
        node1001:
          ansible_host: 203.0.113.10
          hostname: node1001
          primary_ip: 10.100.1.10
          public_ip: 203.0.113.10
          region: exm001          # -> Location
          az: exm-001             # -> Region (1 node per az)
          container_network: 10.100.4.0/22
          container_network_name: net-exm-001
          # uplink_interface: eth0
          #   Optional, node-only, no default. Set it on a node that has a
          #   GLOBAL IPv6 address: docker sets
          #   net.ipv6.conf.all.forwarding=1 the first time it creates an
          #   IPv6 network, which withdraws the RA-learned default route
          #   about 30 minutes later. roles/node_kernel pins
          #   accept_ra=2 on this interface to stop that, and skips the fix
          #   (with a note) rather than guessing the name when it is unset.
          # controller_acme_address: 192.0.2.10
          #   Optional, node-only. The address THIS node's haproxy dials the
          #   controller's ACME backend on (`region.acme_server`). Defaults
          #   to the controller's tailnet address when both ends are on the
          #   tailnet, else its primary_ip — override it in a remote region
          #   where primary_ip is not routable.
        node2001:
          ansible_host: 203.0.113.20
          hostname: node2001
          primary_ip: 10.100.2.10
          public_ip: 203.0.113.20
          region: exm002
          az: exm-002
          container_network: 10.100.8.0/22
          container_network_name: net-exm-002
          # tailscale_enabled: false   # opt out for same-L2 nodes
