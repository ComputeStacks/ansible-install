---
# Environment-level settings (non-secret). Secrets live in secrets.yml (vault).

# The playbooks connect as root and use no privilege escalation — there is no
# play-level `become` in this repo. ansible.cfg sets no remote_user, so without
# this ansible connects as your local username and every task fails.
#
# Ubuntu cloud images block root by default: cloud-init installs your key into
# /root/.ssh/authorized_keys behind a forced command that prints "Please login
# as the user ubuntu". Pass `disable_root: false` in the instance's cloud-init
# user-data. Root SSH has to be open on the nodes in any case — the controller
# uses it at runtime for volumes, haproxy certificate deploys and load balancer
# reloads (docs/control-plane.md row 4), and roles/validate asserts it.
ansible_user: root

# Portal / domains
cs_portal_domain: portal.example.com
cs_registry_domain: cr.example.com
cs_metrics_domain: metrics.example.com
cs_app_zone: usercontent.example.com     # tenant Dns::Zone
cs_admin_email: admin@example.com

locale: en
currency: USD

# DNS driver: powerdns | autodns | none
dns_driver: powerdns

# ACME (portal/registry/metrics certs)
# acme_ca: zerossl | letsencrypt | letsencrypt_test (staging, for throwaway
# environments) | google | ... | a full directory URL. Default zerossl.
acme_ca: zerossl
acme_account_email: admin@example.com
# acme_eab_kid: ""            # External Account Binding — required by Google
# acme_eab_hmac_key: in secrets.yml  # Trust Services; optional for ZeroSSL.
# acme_dns_provider: <see docs/acme-providers.md>; default HTTP-01 webroot

# Tailscale (optional): a host is on the tailnet if and only if
# `tailscale_enabled` is true for it (default false). Uncomment to put every
# host on it, and set `tailscale_enabled: false` on hosts or groups that stay
# off (same-L2 regions):
# tailscale_enabled: true
# A member that is not logged in to the tailnet yet joins with a SHORT-LIVED
# `tailscale_authkey` given to that one run (secrets.yml, or a vaulted
# host_vars/<host>/tailscale.yml); once it is logged in, no run needs a key
# again. A host with an auth key must declare `tailscale_enabled` either way,
# or preflight refuses the run.

# Ubuntu Pro (optional): enabled when ubuntu_pro_token is set in secrets.yml.

# Post-install checks (roles/validate). Names: services, containers, agent,
# backfill, prometheus, borg, ssh, portal, dns.
# validate_skip: []
# validate_tls_verify: true    # false while the portal is self-signed

# Docker's apt repository is keyed on the release codename, and
# geerlingguy.docker (8.x) takes it from the host's
# `ansible_facts['distribution_release']`, with no override. On Ubuntu 26.04
# that is `resolute`, which download.docker.com publishes, so nothing needs
# setting here. For a future release Docker has not shipped a suite for yet,
# switch the role's repository off and write
# /etc/apt/sources.list.d/docker.sources yourself; the pinned versions in
# versions.yml (`...~ubuntu.26.04~resolute`) name the `resolute` suite, so
# change them with it:
# docker_add_repo: false

# Attach mode (add-region.yml): set on EXISTING shared hosts in the inventory.
# existing_env: true
# Attach-mode required inputs describing the existing environment:
# backup_host_path: /mnt
# backup_borg_remote_path: /usr/bin/borg
# In secrets.yml, these must ALSO be the existing environment's values, not
# new ones — nothing on a shared host is re-rendered to match them:
#   secret_key_base (asserted byte-for-byte), backups_key,
#   prometheus_basic_auth_password, loki_basic_auth_password.
# See docs/attach-mode.md.
