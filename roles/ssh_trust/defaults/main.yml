---
# Path to the controller's APPLICATION ed25519 pubkey, ON THE CONTROLLER HOST.
#
# DETECTED, not assumed. Leave `ssh_trust_app_pubkey_path` empty (the default)
# and the role probes the candidates below on the controller and takes the
# first that exists; set it to a path to force one.
#
# It used to be selected from the controller's `existing_env` flag, on the
# reasoning that attach mode reaches a v1 controller. That is true of a v1
# migration and false of everything else: `existing_env` means "not mine to
# rebuild, partial inventory", not "v1", so attaching a region to an
# environment THIS repository built sent the role looking in v1's
# ssh_keys_directory on a host that has never had one, and the run died at the
# assert below. Probing costs one stat per candidate and cannot be wrong.
#
# Order matters: v2 first. A controller migrated from v1 can still carry the
# old directory, and the key the running application uses is the v2 one.
ssh_trust_app_pubkey_path: ""
ssh_trust_app_pubkey_candidates:
  # v2 (roles/controller)
  - /etc/computestacks/.ssh/id_ed25519.pub
  # v1 `ssh_keys_directory` (v1 roles/controller/defaults/main.yml)
  - /var/lib/computestacks/sshkeys/id_ed25519.pub
