---
# Installs the controller's root and app ed25519 pubkeys into root's
# authorized_keys on every host in groups['nodes'] and groups['registry']
# (docs/contracts.md control-plane rows #4 and #19). Additive
# authorized_key entries only — never exclusive.

- name: Probe the controller for its application SSH key
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ssh_trust_app_pubkey_candidates }}"
  register: ssh_trust_app_pubkey_probe
  delegate_to: "{{ groups['controller'] | first }}"
  run_once: true
  when: (ssh_trust_app_pubkey_path | length) == 0

- name: Select the controller application SSH key path
  ansible.builtin.set_fact:
    ssh_trust_app_pubkey_resolved: >-
      {{ ssh_trust_app_pubkey_path
         if (ssh_trust_app_pubkey_path | length) > 0
         else ((ssh_trust_app_pubkey_probe.results | default([]))
               | selectattr('stat.exists', 'defined')
               | selectattr('stat.exists')
               | map(attribute='item') | list + ['']) | first }}
  run_once: true

# HARD fail, in every mode. Greenfield: site.yml runs the controller role
# (which creates the key) before this play, so a missing key means the
# controller converge did not do its job. Attach: a live controller of either
# generation always has one. Skipping the app key instead installs only the
# root key and every controller-driven volume/haproxy/LB operation on this
# host fails later, invisibly.
- name: Assert the controller app pubkey exists
  ansible.builtin.assert:
    that:
      - (ssh_trust_app_pubkey_resolved | length) > 0
    fail_msg: >-
      No application SSH key was found on {{ groups['controller'] | first }}.
      Looked for {{ ssh_trust_app_pubkey_candidates | join(', ') }}. The
      controller's application SSH key is what drives volume management,
      haproxy certificate deploys and LB reloads on this host. On a v2
      controller the `controller` role creates it, so run that first; on a v1
      controller it lives in v1's `ssh_keys_directory`. Set
      `ssh_trust_app_pubkey_path` if this environment keeps it somewhere else.
  run_once: true

- name: Slurp the controller root pubkey
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: ssh_trust_root_pubkey_raw
  delegate_to: "{{ groups['controller'] | first }}"
  run_once: true

- name: Slurp the controller app pubkey
  ansible.builtin.slurp:
    src: "{{ ssh_trust_app_pubkey_resolved }}"
  register: ssh_trust_app_pubkey_raw
  delegate_to: "{{ groups['controller'] | first }}"
  run_once: true

- name: Trust the controller root key in root's authorized_keys
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ ssh_trust_root_pubkey_raw.content | b64decode }}"
  when: "'nodes' in group_names or 'registry' in group_names"

- name: Trust the controller app key in root's authorized_keys
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ ssh_trust_app_pubkey_raw.content | b64decode }}"
  when: "'nodes' in group_names or 'registry' in group_names"

- name: Render the controller's /root/.ssh/config (greenfield only)
  ansible.builtin.template:
    src: ssh_config.j2
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: "0600"
  when:
    - "'controller' in group_names"
    - not (existing_env | default(false))
