---
# How to get a root connection, as an operator-facing sentence. Kept here
# rather than inline so the assert's name stays within the line length.
preflight_root_connection_hint: >-
  Set `ansible_user: root` in the inventory (ansible.cfg sets no remote_user,
  so ansible otherwise connects as your local username). On an Ubuntu cloud
  image root is additionally blocked by cloud-init, which installs your key
  into /root/.ssh/authorized_keys behind a forced command — pass
  `disable_root: false` in the instance's user-data. Root is not only an
  install-time convenience: the controller reaches every node over root SSH at
  runtime for volumes, haproxy certificate deploys and load balancer reloads
  (docs/control-plane.md row 4), and roles/validate asserts that connection.

# Why a floating controller tag is refused, as an operator-facing sentence.
# Kept here so the assert's fail_msg stays readable.
preflight_image_pin_hint: >-
  The minor line (e.g. '9.7') is the intended rolling channel — `cstacks
  upgrade` pulls the newest patch within it, so a pin costs you nothing in
  currency and buys you the ability to say which build a host is running.
  Defaults live in playbooks/group_vars/all/versions.yml; to point one
  environment at a different image, set controller_image_repo and
  controller_image_tag as inventory HOST VARS on the controller host (or pass
  -e). An inventory group_vars/all entry is silently ignored, because playbook
  group_vars outrank it. If the image genuinely publishes no immutable line —
  an internal controller build cut on demand — set
  `controller_image_allow_floating_tag: true` as a host var beside the repo
  override, and accept that neither this inventory nor a converge can then
  tell whether the running container is current.

# What a `site` is and where to set it, as an operator-facing sentence.
# Shared by all three site assertions so they stay readable.
preflight_site_hint: >-
  A `site` is the physical facility a host lives in (docs/contracts.md
  §Vocabulary) — the grouping that decides which metrics host a node is
  scraped by and which backup server it writes to. It is neither `region`
  (controller Location) nor `az` (controller Region): two Locations can share
  one metrics server, and a site holds one or more regions. Set `site` as an
  inventory HOST var on each node, metrics host and backup host; a playbook
  or inventory group_vars entry named `site` is the wrong place, because
  playbook group_vars outrank inventory group_vars. A single-site inventory
  sets it nowhere at all and every host lands in the site called 'default'.

# What `app_domain` is and where to set it, as an operator-facing sentence.
# Shared by the app-domain assertions so they stay readable.
preflight_app_domain_hint: >-
  `app_domain` is the domain THAT AZ's load balancer answers on — the name
  tenant containers are published under (<container>.<app_domain>) and the CN
  of the wildcard certificate that load balancer serves. It is an OPTIONAL
  inventory HOST var on a node, and it must lie at or under the
  environment-wide `cs_app_zone`, which keeps the meaning it has today: the
  ONE parent DNS zone (playbooks/group_vars/all/app_domains.yml). A node that
  sets it nowhere takes `cs_app_zone` itself, which is what every inventory
  written before per-az domains existed does. Set it as a HOST var on the
  node, never in group_vars — playbook group_vars outrank inventory
  group_vars, and one value shared by two AZs is a collision this role
  rejects. Each domain needs its own DNS records: `<app_domain>` A -> that
  load balancer's public IP, and `*.<app_domain>` CNAME -> `<app_domain>`.

# The site values this run is working with, from the three groups that have
# one. Read by the assertions in tasks/main.yml, which are all `run_once` —
# these evaluate in the executing host's context, where `hostvars` is in
# scope (docs/contracts.md §Variable scope).
preflight_node_sites: >-
  {{ (groups['nodes'] | default([])) | map('extract', hostvars, 'cs_site') | list | unique }}
preflight_metrics_sites: >-
  {{ (groups['metrics'] | default([])) | map('extract', hostvars, 'cs_site') | list }}
preflight_backup_sites: >-
  {{ (groups['backup'] | default([])) | map('extract', hostvars, 'cs_site') | list }}
preflight_inventory_sites: >-
  {{ (preflight_node_sites + preflight_metrics_sites + preflight_backup_sites) | unique }}

# Sites that hold at least one node but no metrics host — the fatal case.
preflight_sites_without_metrics: >-
  {{ preflight_node_sites | difference(cs_site_metrics_hosts.keys() | list) }}

# The public name each site's metrics host answers on. Two sites resolving to
# the SAME name is the collision the assertion below rejects; the list keeps
# duplicates so it stays visible, because the map has already collapsed them.
preflight_metrics_domains: >-
  {{ cs_site_metrics_domains.values() | list }}

# Every value an operator can put in metrics_site_credentials, flattened.
# Checked for jinja delimiters by the assertion in tasks/main.yml.
preflight_metrics_credential_values: >-
  {{ (metrics_site_credentials | default({})).values()
     | map('dictsort') | flatten | select('string') | list }}

# --- per-az application domains -------------------------------------------
# The contract is playbooks/group_vars/all/app_domains.yml. Same shape as the
# site derivations above and read the same way: every assertion using them is
# `run_once`, so `hostvars` is in scope (docs/contracts.md §Variable scope).
#
# EXPLICITLY SET is the scope that matters, and it is not the same as
# `cs_app_domain`. Every host in every inventory has a `cs_app_domain` —
# unset means `cs_app_zone` — so a uniqueness check over the derived value
# would fail every inventory in this repository, the frozen
# tests/fixtures/single-site included, on the day this file landed. What an
# operator can get wrong is the value they typed, so that is what is checked.
preflight_app_domain_hosts: >-
  {{ groups['all'] | map('extract', hostvars) | selectattr('app_domain', 'defined')
     | map(attribute='inventory_hostname') | list | sort }}

# Nodes only, for the collision check: one az per node (preflight asserts it
# above), so two nodes naming the same domain IS two azs sharing a load
# balancer domain. Not deduped — comparing the list against its own `unique`
# is how the collision is detected, the same way preflight_metrics_sites
# works.
preflight_app_domain_nodes: >-
  {{ (groups['nodes'] | default([])) | map('extract', hostvars)
     | selectattr('app_domain', 'defined')
     | map(attribute='inventory_hostname') | list | sort }}
preflight_node_app_domains: >-
  {{ preflight_app_domain_nodes | map('extract', hostvars, 'app_domain') | list }}

# Explicitly-set domains that are NOT at or under `cs_app_zone`.
#
# The suffix test is deliberately two-part rather than one `endswith`: with a
# zone of `usercontent.example.com`, the domain `notusercontent.example.com`
# ends with that string and is not under that zone. It is either the zone
# itself or something with a label boundary in front of it, which is exactly
# what the controller's LetsEncryptAuth#dns_zone label walk will and will not
# match.
preflight_app_domains_outside_zone: >-
  {{ preflight_app_domain_hosts | map('extract', hostvars, 'app_domain')
     | map('string')
     | reject('equalto', cs_app_zone | default(''))
     | reject('search', '\.' ~ (cs_app_zone | default('') | regex_escape) ~ '$')
     | list | unique | sort }}

# How many labels `cs_app_zone` has. The walk looks at the last 2, 3, 4 and 5
# labels of a container's FQDN and nothing deeper, so a zone outside that
# range can never be matched however correct the DNS is.
preflight_app_zone_labels: >-
  {{ ((cs_app_zone | default('')) | string).split('.') | length }}

# Attach mode, decided by the CONTROLLER's flag and not by the host this role
# happens to be running against — character for character the predicate
# roles/ssh_trust/defaults/main.yml uses. `| first` is the single-controller
# guarantee preflight asserts a few tasks earlier (docs/contracts.md rule 2).
preflight_attach_mode: >-
  {{ hostvars[groups['controller'] | first].existing_env | default(false) | bool }}

# New nodes whose load balancer domain would be the environment-wide zone.
# `cs_app_domain` (not `app_domain`) on purpose: it collapses "set nowhere"
# and "set equal to cs_app_zone" into the one condition that matters, and it
# is the cross-host-safe read the contract blesses (hard rule 10). In attach
# mode both mean the same thing — the legacy single-certificate path — and
# both reseed the EXISTING environment's certificate onto the new region's
# load balancer.
preflight_attach_nodes_sharing_zone: >-
  {{ (cs_new_nodes | default([])) | map('extract', hostvars)
     | selectattr('cs_app_domain', 'equalto', cs_app_zone | default(''))
     | map(attribute='inventory_hostname') | list | sort }}

# Hosts that set the retired `controller_wildcard_domain` to something other
# than `cs_app_zone`. roles/controller's default for it IS `cs_app_zone` and
# role defaults are not in scope here, so anything this finds was written by
# an operator (the same reason the powerdns_name assert in
# roles/controller_seed reads only the inventory).
preflight_wildcard_domain_overrides: >-
  {{ groups['all'] | map('extract', hostvars)
     | selectattr('controller_wildcard_domain', 'defined')
     | rejectattr('controller_wildcard_domain', 'equalto', cs_app_zone | default(''))
     | map(attribute='inventory_hostname') | list | sort }}

# Inventory vars every node in groups['nodes'] must define (docs/contracts.md
# rule 1). Templates elsewhere in the provisioner assume these are present.
preflight_required_node_vars:
  - hostname
  - primary_ip
  - public_ip
  - region
  - az
  - container_network
  - container_network_name

# Every network read in this role, off in one switch. False makes preflight
# purely local again — for an air-gapped converge where the images are already
# on the hosts, or where egress leaves through something the ansible control
# path cannot see.
preflight_verify_registries: true

# Groups whose hosts run a docker daemon, and therefore pull images. Mirrors
# the `hosts:` line of the "Docker hosts" play in playbooks/site.yml. A host
# outside these groups never logs in to a registry, so probing one from there
# would only assert egress it does not need. In attach mode
# (playbooks/add-region.yml) only the NEW nodes run roles/docker_config, which
# is why the probe additionally skips `existing_env` hosts.
preflight_docker_groups:
  - controller
  - metrics
  - registry
  - nodes

# The controller image existence-and-tag check specifically. The credential
# probes stay on — use preflight_verify_registries to turn off the network
# reads altogether.
preflight_verify_controller_image: true

# What a 401 from the token endpoint means, as an operator-facing sentence.
preflight_registry_credentials_hint: >-
  The credentials are wrong, expired, or revoked. On GitLab this must be a
  deploy token (project or group, Settings -> Repository -> Deploy tokens)
  with the `read_registry` scope, and its username is the full
  `gitlab+deploy-token-<n>` string, not your account name. Deploy tokens
  expire — check the expiry date before assuming the password is wrong.

# The two ways a manifest read fails, told apart by status so the operator is
# pointed at the right file.
preflight_registry_manifest_hint_404: >-
  No such repository or tag — check controller_image_repo and
  controller_image_tag in playbooks/group_vars/all/versions.yml, and that the
  tag really exists in that repository.
preflight_registry_manifest_hint_denied: >-
  The credentials were accepted but do not grant pull access to this
  repository.

# Manifest media types the registry may answer with. Both the OCI and the
# older docker spellings, index and single-manifest, because which one comes
# back depends on how the image was built and pushed.
preflight_registry_manifest_accept: >-
  application/vnd.oci.image.index.v1+json,
  application/vnd.docker.distribution.manifest.list.v2+json,
  application/vnd.oci.image.manifest.v1+json,
  application/vnd.docker.distribution.manifest.v2+json

# --- app_domain DNS -------------------------------------------------------
# Check, before anything is built, that every new az's load balancer domain
# already resolves the way docs/install.md §3 requires: the apex to that node's
# own `public_ip`, and the wildcard as a CNAME to the apex. Both records are an
# operator step, both are easy to miss, and neither failure has a symptom until
# a tenant deploys into the region.
#
# Set false for an environment whose records are published after the converge,
# or one whose control machine cannot see the public zone (split horizon). It
# is the only escape hatch: the check itself has no opinion about whether the
# address is routable, so a private-addressed test environment passes it.
#
# When roles/powerdns writes the records (`preflight_lb_records_managed`
# below), there is nothing public to dig for yet, and this same switch turns
# off the check that replaces it instead: the delegation of `cs_app_zone` at
# its parent (tasks/app_zone_delegation.yml). A split-horizon control machine
# cannot see that either. The public check itself then runs in roles/validate
# under its own `validate_skip` key, `lb_domain_public`.
preflight_check_app_domain_dns: true
# Label used to exercise the wildcard. Any label matches a wildcard; a fixed
# one keeps the run reproducible. It must not exist as a real record.
preflight_app_domain_probe_label: cs-preflight-probe

# --- load balancer records managed by roles/powerdns ------------------------
# True when this run WRITES each new az's load balancer pair itself: the
# bundled PowerDNS is the DNS driver, there is a leader to write on, and
# nobody turned `powerdns_manage_lb_records` off. The same expression, spelled
# the same way, gates roles/powerdns and roles/validate — keep all three in
# step.
#
# `powerdns_manage_lb_records` is read from the LEADER's hostvars because that
# is where roles/powerdns reads it: the override belongs on the nameservers
# (group_vars/nameservers or ns_primary's host vars), and the preflight play
# has no other way to see it. The powerdns role's own default (true) is not in
# scope here, which is why the `default(true)` restates it.
#
# When true, the public dig in tasks/app_domain_dns.yml cannot pass before the
# run — the records do not exist until roles/powerdns writes them — so it is
# replaced by the delegation check in tasks/app_zone_delegation.yml, and the
# public resolution check moves to roles/validate (`lb_domain_public`).
preflight_lb_records_managed: >-
  {{ dns_driver | default('none') == 'powerdns'
     and groups['ns_primary'] | default([]) | length > 0
     and (hostvars[groups['ns_primary'][0]].powerdns_manage_lb_records | default(true)) | bool }}

# How many of the parent zone's nameservers to ask for the referral. Every one
# asked must return the same delegation; more than a few adds time without
# adding much (a TLD parent has thirteen, all serving the same data).
preflight_app_zone_delegation_servers: 3
