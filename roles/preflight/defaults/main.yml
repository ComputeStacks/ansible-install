---
# Inventory vars every node in groups['nodes'] must define (docs/contracts.md
# rule 1). Templates elsewhere in the provisioner assume these are present.
preflight_required_node_vars:
  - hostname
  - primary_ip
  - public_ip
  - region
  - az
  - container_network
  - container_network_name

# Every network read in this role, off in one switch. False makes preflight
# purely local again — for an air-gapped converge where the images are already
# on the hosts, or where egress leaves through something the ansible control
# path cannot see.
preflight_verify_registries: true

# Groups whose hosts run a docker daemon, and therefore pull images. Mirrors
# the `hosts:` line of the "Docker hosts" play in playbooks/site.yml. A host
# outside these groups never logs in to a registry, so probing one from there
# would only assert egress it does not need. In attach mode
# (playbooks/add-region.yml) only the NEW nodes run roles/docker_config, which
# is why the probe additionally skips `existing_env` hosts.
preflight_docker_groups:
  - controller
  - metrics
  - registry
  - nodes

# The controller image existence-and-tag check specifically. The credential
# probes stay on — use preflight_verify_registries to turn off the network
# reads altogether.
preflight_verify_controller_image: true

# What a 401 from the token endpoint means, as an operator-facing sentence.
preflight_registry_credentials_hint: >-
  The credentials are wrong, expired, or revoked. On GitLab this must be a
  deploy token (project or group, Settings -> Repository -> Deploy tokens)
  with the `read_registry` scope, and its username is the full
  `gitlab+deploy-token-<n>` string, not your account name. Deploy tokens
  expire — check the expiry date before assuming the password is wrong.

# The two ways a manifest read fails, told apart by status so the operator is
# pointed at the right file.
preflight_registry_manifest_hint_404: >-
  No such repository or tag — check controller_image_repo and
  controller_image_tag in playbooks/group_vars/all/versions.yml, and that the
  tag really exists in that repository.
preflight_registry_manifest_hint_denied: >-
  The credentials were accepted but do not grant pull access to this
  repository.

# Manifest media types the registry may answer with. Both the OCI and the
# older docker spellings, index and single-manifest, because which one comes
# back depends on how the image was built and pushed.
preflight_registry_manifest_accept: >-
  application/vnd.oci.image.index.v1+json,
  application/vnd.docker.distribution.manifest.list.v2+json,
  application/vnd.oci.image.manifest.v1+json,
  application/vnd.docker.distribution.manifest.v2+json
