---
# One registry probe, over the registry HTTP API rather than `docker pull`:
# preflight runs before geerlingguy.docker, so there is no docker daemon on a
# greenfield host yet. Reads only — nothing here changes the host, which is
# also why every request carries `check_mode: false`: under `--check` a
# skipped probe would report green on a credential nobody had verified.
#
# Caller sets, via `vars:`:
#   preflight_probe_registry    host[:port] as written in the image reference
#   preflight_probe_username    '' for an anonymous probe
#   preflight_probe_password    ''
#   preflight_probe_repository  repository path, '' to check credentials only
#   preflight_probe_tag         tag, required when repository is set
#
# The flow is the standard token handshake every OCI registry implements:
# GET /v2/ answers 401 with a `WWW-Authenticate: Bearer realm=...,service=...`
# challenge; the realm mints a token from the credentials; the token reads the
# manifest.
#
# The two requests that carry or return a credential are `no_log`, and neither
# of them decides anything: each is followed by an assert that reads only the
# status code (and, on a transport failure, the module's own message) and
# prints the diagnosis itself. A registered result survives `no_log` intact --
# only the display is suppressed -- so nothing readable is lost.

- name: "Resolve the registry API endpoint for {{ preflight_probe_registry }}"
  ansible.builtin.set_fact:
    # Docker Hub's API host is not the name that appears in an image
    # reference, and a single-segment Hub repository is really `library/<name>`.
    preflight_probe_api_host: >-
      {{ 'registry-1.docker.io'
         if preflight_probe_registry in ['docker.io', 'index.docker.io', 'registry-1.docker.io']
         else preflight_probe_registry }}
    preflight_probe_path: >-
      {{ ('library/' ~ preflight_probe_repository)
         if (preflight_probe_registry in ['docker.io', 'index.docker.io', 'registry-1.docker.io']
             and '/' not in preflight_probe_repository)
         else preflight_probe_repository }}

- name: "Query the registry API of {{ preflight_probe_registry }}"
  ansible.builtin.uri:
    url: "https://{{ preflight_probe_api_host }}/v2/"
    status_code: [200, 401]
    timeout: 20
  check_mode: false
  register: preflight_probe_root

- name: "Read the authentication challenge from {{ preflight_probe_registry }}"
  ansible.builtin.set_fact:
    preflight_probe_realm: >-
      {{ (preflight_probe_root.www_authenticate | default('')
          | regex_search('realm="([^"]+)"', '\1') | default([], true)) | join('') }}
    preflight_probe_service: >-
      {{ (preflight_probe_root.www_authenticate | default('')
          | regex_search('service="([^"]+)"', '\1') | default([], true)) | join('') }}

# A registry that serves /v2/ anonymously issues no challenge, so there is no
# endpoint against which the credentials could be checked. Say so rather than
# letting the probe report a success it did not earn — the login itself still
# happens later, in roles/docker_config, under no_log.
- name: "Warn that no authentication challenge came from {{ preflight_probe_registry }}"
  ansible.builtin.debug:
    msg: >-
      {{ preflight_probe_registry }} answered /v2/ without an authentication
      challenge, so its credentials could NOT be verified here. They are still
      installed, and a wrong one will surface as a censored failure in
      roles/docker_config or as a `docker pull` denial later. This is normal
      for a registry that allows anonymous reads and enforces auth further in.
  when:
    - preflight_probe_realm | length == 0
    - preflight_probe_username | length > 0

# Scope is omitted for a credentials-only probe -- there is no repository to
# name yet. What the assert below reads is the DISTINCTION between 401 and
# 403, not a 200: a self-hosted GitLab answers an unscoped token request with
# 403 even for good credentials (verified against a real instance), while
# wrong credentials get 401 from both gitlab.com and self-hosted. So 401 means
# "these credentials are not valid" and 403 means "valid, but this request
# granted no scope", which is all a credentials-only probe can honestly claim.
# The scoped request the controller image makes is judged by the manifest read
# that follows it instead.
- name: "Request a pull token from {{ preflight_probe_registry }}"
  ansible.builtin.uri:
    url: >-
      {{ preflight_probe_realm }}?service={{ preflight_probe_service | urlencode }}{{
         ('&scope=' ~ ('repository:' ~ preflight_probe_path ~ ':pull') | urlencode)
         if preflight_probe_repository | length > 0 else '' }}
    url_username: "{{ preflight_probe_username if preflight_probe_username | length > 0 else omit }}"
    url_password: "{{ preflight_probe_password if preflight_probe_username | length > 0 else omit }}"
    force_basic_auth: "{{ preflight_probe_username | length > 0 }}"
    status_code: [200, 401, 403]
    timeout: 20
  check_mode: false
  register: preflight_probe_token_result
  # The response body is a working pull credential for the repository until it
  # expires. Ansible prints a task result from -v upward, so without this the
  # token lands in stdout and in any CI log that captured it.
  no_log: true
  failed_when: false
  when: preflight_probe_realm | length > 0

- name: "Assert the credentials are accepted by {{ preflight_probe_registry }}"
  ansible.builtin.assert:
    that:
      - (preflight_probe_token_result.status | default(0)) in [200, 403]
    fail_msg: >-
      {{ preflight_probe_registry }} refused to issue a pull token for
      {{ preflight_probe_username | default('(anonymous)', true) }}
      (HTTP {{ preflight_probe_token_result.status | default('no response') }}).
      {{ preflight_probe_token_result.msg | default('') }}
      {{ preflight_registry_credentials_hint
         if (preflight_probe_token_result.status | default(0)) == 401
         else 'The registry did not answer the token request at all — check that this host can reach it.' }}
    success_msg: >-
      {{ preflight_probe_registry }}: credentials accepted
    quiet: true
  when: preflight_probe_realm | length > 0

- name: "Read the manifest of {{ preflight_probe_path }}"
  ansible.builtin.uri:
    url: >-
      https://{{ preflight_probe_api_host }}/v2/{{ preflight_probe_path }}/manifests/{{ preflight_probe_tag }}
    headers: >-
      {{ {'Accept': preflight_registry_manifest_accept}
         | combine({'Authorization': 'Bearer ' ~ preflight_probe_token}
                   if preflight_probe_token | length > 0 else {}) }}
    status_code: [200, 401, 403, 404]
    timeout: 20
  vars:
    preflight_probe_token: >-
      {{ (preflight_probe_token_result.json | default({})).token
         | default((preflight_probe_token_result.json | default({})).access_token | default(''), true) }}
  check_mode: false
  register: preflight_probe_manifest
  # Carries the bearer token in a request header, which -vvv would print with
  # the rest of the module arguments.
  no_log: true
  failed_when: false
  when: preflight_probe_repository | length > 0

- name: "Assert the image is pullable: {{ preflight_probe_path ~ ':' ~ preflight_probe_tag }}"
  ansible.builtin.assert:
    that:
      - (preflight_probe_manifest.status | default(0)) == 200
    fail_msg: >-
      {{ preflight_probe_registry }}/{{ preflight_probe_path }}:{{ preflight_probe_tag }}
      is not pullable (HTTP {{ preflight_probe_manifest.status | default('no response') }}).
      {{ preflight_probe_manifest.msg | default('') }}
      {{ preflight_registry_manifest_hint_404
         if (preflight_probe_manifest.status | default(0)) == 404
         else preflight_registry_manifest_hint_denied }}
    success_msg: >-
      {{ preflight_probe_registry }}/{{ preflight_probe_path }}:{{ preflight_probe_tag }} is pullable
    quiet: true
  when: preflight_probe_repository | length > 0
