---
# Assert-only role: no host is ever changed by this role. Every task below is
# a hard assertion (or, for the tailscale opt-out case, a loud warning) run
# before any other role touches a host. See docs/contracts.md for the rules
# this role enforces.

# First, because every other role in this repo runs as root and none of them
# escalate — there is no play-level `become` anywhere. A non-root connection
# otherwise passes all of preflight (facts gather as any user) and then dies
# partway through roles/common on a permission error, after this role has
# already promised nothing was changed.
- name: Assert the connection is root
  ansible.builtin.assert:
    that:
      - ansible_user_id == 'root'
    fail_msg: >-
      Connected to {{ inventory_hostname }} as '{{ ansible_user_id }}', not
      root. The playbooks use no privilege escalation, so every task that
      writes to the host would fail. {{ preflight_root_connection_hint }}
    success_msg: "{{ inventory_hostname }}: connected as root"

- name: Assert Ubuntu 26.04 amd64 (skipped on existing_env hosts, which are Debian)
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '26.04'
      - ansible_architecture == 'x86_64'
    fail_msg: >-
      {{ inventory_hostname }} must be running Ubuntu 26.04 LTS (amd64/x86_64);
      found {{ ansible_distribution }} {{ ansible_distribution_version }}
      {{ ansible_architecture }}. Reinstall this host with Ubuntu 26.04 LTS
      server (amd64), or, if this host is part of a pre-existing v1
      (Debian) environment being attached to, set 'existing_env: true' on it
      in the inventory.
    success_msg: "{{ inventory_hostname }}: Ubuntu 26.04 amd64 confirmed"
  when: not (existing_env | default(false))

- name: Assert every node in groups['nodes'] defines the required inventory vars
  ansible.builtin.assert:
    that:
      - hostvars[item.0][item.1] is defined
    fail_msg: >-
      Node '{{ item.0 }}' is missing required host var '{{ item.1 }}'. Set
      '{{ item.1 }}' as a host var for {{ item.0 }} in the inventory (see
      inventories/example/hosts.yml for the full required set: hostname,
      primary_ip, public_ip, region, az, container_network,
      container_network_name).
    success_msg: "{{ item.0 }}: {{ item.1 }} is defined"
  loop: "{{ groups['nodes'] | product(preflight_required_node_vars) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"
  run_once: true

- name: Assert exactly one node per availability zone
  ansible.builtin.assert:
    that:
      - (groups['nodes'] | map('extract', hostvars, 'az') | list | unique | length) == (groups['nodes'] | length)
    fail_msg: >-
      'az' values must be unique across groups['nodes'] (exactly one node per
      availability zone) but are not: {{ groups['nodes'] | map('extract', hostvars, 'az') | list }}.
      Fix the 'az' host var on the affected nodes so each az appears exactly
      once.
    success_msg: "az values are unique across all {{ groups['nodes'] | length }} node(s)"
  run_once: true

- name: Assert exactly one controller host
  ansible.builtin.assert:
    that:
      - (groups['controller'] | default([])) | length == 1
    fail_msg: >-
      groups['controller'] must contain exactly one host (found
      {{ (groups['controller'] | default([])) | length }}). Later roles
      (vault, and the controller-runner delegation cs_agent's enroll task
      uses) assume a single controller and delegate to it directly. Fix the
      inventory so 'controller' has exactly one host.
    success_msg: "groups['controller'] has exactly one host"
  run_once: true

# Metrics and backup hosts are SITE-scoped (docs/contracts.md §Vocabulary):
# one metrics host and at most one backup server per physical site. A
# single-site inventory sets `site` nowhere, every host lands in the site
# called `default`, and the three assertions below reduce to exactly the
# "exactly one metrics host / at most one backup host" they replaced.
#
# This one first, so a multi-site inventory that forgot `site` on a shared
# host is told to add it rather than being told its nodes have no metrics
# host. Nodes are not looped: a node missing `site` falls into `default` and
# is caught by the metrics-host assertion below, which names the site.
- name: Assert metrics and backup hosts declare a site when the inventory holds more than one
  ansible.builtin.assert:
    that:
      - hostvars[item].site is defined
    fail_msg: >-
      This inventory holds more than one site
      ({{ preflight_inventory_sites | sort | join(', ') }}) but '{{ item }}'
      declares no 'site' host var, so it falls into the site called
      'default'. {{ preflight_site_hint }}
    success_msg: "{{ item }}: site '{{ hostvars[item].cs_site }}'"
  loop: "{{ (groups['metrics'] | default([])) + (groups['backup'] | default([])) }}"
  loop_control:
    label: "{{ item }}"
  when: (preflight_inventory_sites | length) > 1
  run_once: true

- name: Assert no site has more than one metrics host
  ansible.builtin.assert:
    that:
      - (preflight_metrics_sites | unique | length) == (preflight_metrics_sites | length)
    fail_msg: >-
      Two metrics hosts share a site —
      {{ dict((groups['metrics'] | default([])) | zip(preflight_metrics_sites)) }}.
      Prometheus, loki,
      alertmanager and the per-AZ file_sd fragments assume ONE metrics host
      per site, and nothing can choose between two. Name exactly one metrics
      host per site, or split them onto separate sites.
      {{ preflight_site_hint }}
    success_msg: >-
      metrics hosts, one per site: {{ cs_site_metrics_hosts }}
  run_once: true

# A node whose site has no metrics host is not a degraded install, it is a
# broken one: the controller's placement queries go to that site's prometheus
# and there is none, so every order for the region is rejected.
- name: Assert every site holding a node has a metrics host
  ansible.builtin.assert:
    that:
      - (preflight_sites_without_metrics | length) == 0
    fail_msg: >-
      No metrics host for site(s)
      {{ preflight_sites_without_metrics | sort | join(', ') }}, which hold
      these nodes:
      {{ groups['nodes'] | default([]) | map('extract', hostvars)
         | selectattr('cs_site', 'in', preflight_sites_without_metrics)
         | map(attribute='inventory_hostname') | sort | join(', ') }}.
      The controller cannot query a node whose site has no prometheus, and
      container placement for its regions breaks. Add a metrics host to that
      site, or correct the 'site' host var on those nodes.
      {{ preflight_site_hint }}
    success_msg: >-
      every site holding a node has a metrics host
      ({{ preflight_node_sites | sort | join(', ') }})
  run_once: true

# Two sites answering on the same metrics name is a copy-paste error in the
# `metrics_domain` host vars, and it is silent everywhere else. roles/
# controller_seed dedupes `metric_clients` / `log_clients` by exact endpoint
# string — because the controller matches a client that way — so a collision
# collapses two sites onto one row and the first site in sorted order supplies
# its credentials. The second site's nodes then authenticate against the wrong
# basic-auth pair, and the only symptom is a 401 at the end of a converge.
# The template cannot resolve this (both sites genuinely name one vhost), so
# it is caught here, before anything is installed.
# A vaulted value is still a jinja template, and this assertion's real work is
# FORCING EVERY ONE OF THEM TO EVALUATE, here, before any host is touched.
#
# Downstream, `cs_site_metrics_credentials` resolves through a chain of
# `default(..., true)` filters (playbooks/group_vars/all/sites.yml). That chain
# is what makes the username/password shorthand work, and it also swallows a
# value that fails to template: the site falls back to the environment-wide
# password and the only symptom is a 401 at the very end of a converge, from a
# vault entry that looks perfectly correct. Referencing every value here, with
# no `default` in the way, turns that into a loud failure in the first play —
# verified: a password containing an unknown variable stops the run with
# `'<name>' is undefined`, and one containing a statement tag with
# `Unexpected end of template`.
#
# The `search` below then catches what still renders: a jinja COMMENT is
# stripped silently rather than raising, so a password containing one would be
# quietly truncated instead of replaced.
#
# Either way the fix is the same and it is not in this repo: change the
# basic-auth credential on the metrics host. No escaping survives the round
# trip intact.
- name: Assert no metrics credential contains jinja delimiters
  ansible.builtin.assert:
    that:
      - preflight_metrics_credential_values | select('search', '\\{[#%\\{]') | list | length == 0
    fail_msg: >-
      A value in metrics_site_credentials contains a jinja delimiter — an
      opening brace followed by another brace, a percent sign, or a hash.
      Ansible templates vaulted values, so such a value cannot survive: it
      either fails to render and is silently replaced by the environment-wide
      credential, or is stripped outright as a comment. Change the basic-auth
      credential on the metrics host to one without those character pairs.
      (The value itself is deliberately not printed.)
    success_msg: "metrics credentials carry no jinja delimiters"
  run_once: true

- name: Assert no two sites answer on the same metrics domain
  ansible.builtin.assert:
    that:
      - (preflight_metrics_domains | unique | length) == (preflight_metrics_domains | length)
    fail_msg: >-
      Two sites resolve to the same metrics domain —
      {{ cs_site_metrics_domains }}. Each site's metrics host answers on its
      own name: set a distinct `metrics_domain` host var on the metrics host
      whose name is wrong, or leave exactly one site on the environment-wide
      `cs_metrics_domain` ({{ cs_metrics_domain | default('unset') }}) and
      name the others. {{ preflight_site_hint }}
    success_msg: >-
      metrics domains are distinct per site: {{ cs_site_metrics_domains }}
  run_once: true

# Zero backup hosts in a site is allowed and means "no backups for that
# site's nodes": cs_agent skips its borg tasks and renders
# `backups.enabled: false`, and validate skips its borg reachability checks.
# Two in ONE site is the real error — every node in a site shares ONE
# repository host, resolved as cs_site_backup_hosts[cs_site].
# Asserted unconditionally rather than gated on a non-empty group, so the
# message and the condition say the same thing.
- name: Assert no site has more than one backup host
  ansible.builtin.assert:
    that:
      - (preflight_backup_sites | unique | length) == (preflight_backup_sites | length)
    fail_msg: >-
      Two backup hosts share a site —
      {{ dict((groups['backup'] | default([])) | zip(preflight_backup_sites)) }}.
      Every node in a site backs
      up to ONE repository host and nothing can choose between two. Name at
      most one backup host per site, or none at all in a site whose nodes
      install without backups. {{ preflight_site_hint }}
    success_msg: >-
      {{ "backup hosts, at most one per site: " ~ cs_site_backup_hosts
         if ((groups['backup'] | default([])) | length > 0)
         else "no backup host — nodes will be configured with backups disabled" }}
  run_once: true

# Per-az application domains (playbooks/group_vars/all/app_domains.yml). Every
# az's load balancer answers on its own domain, and every one of them lives
# under the single environment-wide `cs_app_zone`. All five checks below are
# pure inventory reads, and all five are about a failure that is invisible at
# converge time: a wrong domain here does not break the install, it produces a
# load balancer serving a certificate for a name it does not answer on, or a
# tenant wildcard certificate that never issues, discovered weeks later.
- name: Assert every app_domain that is set is a bare lowercase domain
  ansible.builtin.assert:
    that:
      - (hostvars[item].app_domain | default('', true) | string) | length > 0
      - >-
        (hostvars[item].app_domain | default('', true) | string)
        is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
    fail_msg: >-
      app_domain '{{ hostvars[item].app_domain | default('') }}' on host
      '{{ item }}' is not a bare domain name. It must be lowercase letters,
      digits, hyphens and dots only, with at least one dot — no '*' (the
      wildcard is implied; the certificate carries the SAN and the DNS record
      is a separate CNAME), no scheme, no port, no path, no trailing dot, and
      not empty. An empty value is the worst of them: it is not "unset", it
      renders a blank load balancer domain, and the controller's
      ValidateDomainWorker returns early on a blank domain instead of
      complaining. {{ preflight_app_domain_hint }}
    success_msg: "{{ item }}: app_domain '{{ hostvars[item].app_domain }}' is a bare domain"
  loop: "{{ preflight_app_domain_hosts }}"
  loop_control:
    label: "{{ item }}"
  run_once: true

# Scoped to nodes that SET it, because the derived `cs_app_domain` is
# `cs_app_zone` for every host that does not — an unscoped uniqueness check
# would abort every inventory in this repository (see defaults/main.yml).
- name: Assert no two availability zones are given the same app_domain
  ansible.builtin.assert:
    that:
      - (preflight_node_app_domains | unique | length) == (preflight_node_app_domains | length)
    fail_msg: >-
      Two nodes name the same app_domain —
      {{ dict(preflight_app_domain_nodes | zip(preflight_node_app_domains)) }}.
      There is exactly one node, and therefore one load balancer, per az, and
      each load balancer answers on its own domain with its own certificate.
      Two azs sharing one domain means whichever DNS record you publish sends
      every tenant to one of them. {{ preflight_app_domain_hint }}
    success_msg: >-
      {{ "app_domains are distinct per az: "
         ~ dict(preflight_app_domain_nodes | zip(preflight_node_app_domains))
         if (preflight_app_domain_nodes | length) > 0
         else "no node sets app_domain — every az uses cs_app_zone, as before" }}
  run_once: true

# This one can only see the azs in THIS inventory. In attach mode the
# inventory is a partial view of the fleet (contracts rule 9), so a new
# region colliding with an EXISTING production az's domain is not detectable
# here — check the admin UI. Said again in README.md.

# The controller's LetsEncryptAuth#dns_zone walks up from a container's FQDN —
# the last 2 labels, then 3, then 4, then 5 — and takes the first exact
# Dns::Zone match. A domain outside the zone, or a zone too deep for the walk
# to reach, matches nothing; the controller then has no DNS driver to answer
# the DNS-01 challenge with, and the tenant's wildcard certificate silently
# never issues (event_code 2721edc59787a807 is the related domain-validation
# failure). Nothing about the install fails, which is exactly why this is a
# hard assert and not a warning.
- name: Assert every app_domain lies under cs_app_zone, and the zone is shallow enough to match
  ansible.builtin.assert:
    that:
      - (cs_app_zone | default('')) | length > 0
      - (preflight_app_zone_labels | int) >= 2
      - (preflight_app_zone_labels | int) <= 5
      - (preflight_app_domains_outside_zone | length) == 0
    fail_msg: >-
      cs_app_zone is '{{ cs_app_zone | default('(unset)') }}'
      ({{ preflight_app_zone_labels }} labels)
      {{ ("and these app_domains do not lie under it: "
          ~ (preflight_app_domains_outside_zone | join(', ')))
         if (preflight_app_domains_outside_zone | length) > 0
         else "" }}.
      Every load balancer domain must be `cs_app_zone` itself or sit beneath
      it at a label boundary, and `cs_app_zone` must be 2 to 5 labels long:
      the controller resolves a container's DNS zone by walking up the last
      2, 3, 4 and 5 labels of its FQDN and taking the first exact Dns::Zone
      match, so anything outside that finds no zone, gets no DNS-01
      challenge, and never issues a certificate — with no error at install
      time. There is ONE parent zone per environment; do not create a second.
      {{ preflight_app_domain_hint }}
    success_msg: >-
      cs_app_zone '{{ cs_app_zone | default('') }}' is
      {{ preflight_app_zone_labels }} labels and every app_domain lies under it
  run_once: true

# `is defined` would not be enough here. An app_domain set EQUAL to
# cs_app_zone selects the legacy single-certificate path: roles/controller
# generates nothing new, controller_seed reads the existing environment's
# certificate off the legacy path, and the new region's load balancer is
# seeded with the certificate of the environment it just joined — the precise
# bug this whole contract exists to prevent, while passing a
# `is defined` gate.
- name: Assert every new node names its own app_domain in attach mode
  ansible.builtin.assert:
    that:
      - (preflight_attach_nodes_sharing_zone | length) == 0
    fail_msg: >-
      Attaching to an existing environment, but these new nodes have no
      app_domain of their own:
      {{ preflight_attach_nodes_sharing_zone | join(', ') }} — they either set
      none, or set it to cs_app_zone
      ('{{ cs_app_zone | default('') }}') itself. Both mean the same thing:
      this region's load balancer would be seeded with the EXISTING
      environment's shared certificate, whose CN is the existing environment's
      domain, and no certificate would be generated for the new region at all.
      Give each new node the domain its own load balancer answers on.
      {{ preflight_app_domain_hint }}
    success_msg: >-
      attach mode: every new node names its own app_domain
  when: preflight_attach_mode | bool
  run_once: true

# `controller_wildcard_domain` was the single environment-wide CN, and it is
# RETIRED rather than kept as a single-domain override. Keeping it live would
# be a silent mismatch: the manifest's load balancer `domain` now comes from
# `cs_app_domain`, which knows nothing about it, so an override would change
# the certificate's CN and leave every rendered domain alone.
- name: Assert the retired controller_wildcard_domain is not being used as an override
  ansible.builtin.assert:
    that:
      - (preflight_wildcard_domain_overrides | length) == 0
    fail_msg: >-
      controller_wildcard_domain is set on
      {{ preflight_wildcard_domain_overrides | join(', ') }} and is RETIRED.
      It named one environment-wide certificate CN, and the load balancer
      domain now comes from `app_domain` per az — so this override would move
      the CN and leave every domain where it was, giving every load balancer
      in the fleet a certificate for a name it does not answer on. Delete it
      and set `app_domain` on the nodes instead.
      {{ preflight_app_domain_hint }}
    success_msg: "controller_wildcard_domain is not overridden"
  run_once: true

- name: Assert exactly one primary nameserver when using the powerdns driver
  ansible.builtin.assert:
    that:
      - (groups['ns_primary'] | default([])) | length == 1
    fail_msg: >-
      groups['ns_primary'] must contain exactly one host (found
      {{ (groups['ns_primary'] | default([])) | length }}) when
      dns_driver == 'powerdns' — it is the pdns replication leader and the
      controller's zone-management API target. Fix the inventory so
      'ns_primary' has exactly one host.
    success_msg: "groups['ns_primary'] has exactly one host"
  when: dns_driver | default('') == 'powerdns'
  run_once: true

- name: Assert hostnames (where defined) are a single lowercase word, not an FQDN
  ansible.builtin.assert:
    that:
      - hostvars[item].hostname is match('^[a-z][a-z0-9-]*$')
    fail_msg: >-
      hostname '{{ hostvars[item].hostname }}' for host '{{ item }}' must be a
      single lowercase word (letters, digits, hyphens only) — not an FQDN and
      no uppercase. Fix the 'hostname' host var for {{ item }} in the
      inventory.
    success_msg: "{{ item }}: hostname '{{ hostvars[item].hostname }}' is valid"
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].hostname is defined
  run_once: true

- name: Assert secret_key_base is present, long enough, and not the placeholder
  ansible.builtin.assert:
    that:
      - (secret_key_base | default('')) | length >= 128
      - "'CHANGEME' not in (secret_key_base | default(''))"
    fail_msg: >-
      secret_key_base is missing, shorter than 128 characters, or still the
      CHANGEME sample placeholder. Generate it ONCE with `openssl rand -hex
      64` and set it in the vaulted secrets file — the provisioner NEVER
      generates this value, and rotating it later destroys every encrypted
      credential in the controller (agent tokens, DNS keys, LB certificates).
    success_msg: "secret_key_base is present and >= 128 characters"
  run_once: true

- name: Assert user_auth_secret is present, long enough, and not the placeholder
  ansible.builtin.assert:
    that:
      - (user_auth_secret | default('')) | length >= 128
      - "'CHANGEME' not in (user_auth_secret | default(''))"
    fail_msg: >-
      user_auth_secret is missing, shorter than 128 characters, or still the
      CHANGEME sample placeholder. Generate it ONCE with `openssl rand -hex
      64` and set it in the vaulted secrets file — the provisioner NEVER
      generates this value.
    success_msg: "user_auth_secret is present and >= 128 characters"
  run_once: true

- name: Determine hosts with tailscale explicitly disabled
  ansible.builtin.set_fact:
    preflight_tailscale_disabled_hosts: "{{ preflight_tailscale_disabled_hosts | default([]) + [item] }}"
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: not (hostvars[item].tailscale_enabled | default(true) | bool)
  run_once: true

- name: Warn when tailscale_authkey is set but some hosts opt out
  ansible.builtin.debug:
    msg: >-
      tailscale_authkey is set, but these hosts have 'tailscale_enabled:
      false' and will NOT join the tailnet:
      {{ preflight_tailscale_disabled_hosts | default([]) | join(', ') }}.
      Control-plane traffic to/from them (controller -> agent Bearer,
      metrics scrape) will ride the LAN/public network in cleartext instead
      of the tailnet. Confirm this is intentional (documented same-L2
      opt-out) before proceeding.
  when:
    - (tailscale_authkey | default('')) | length > 0
    - (preflight_tailscale_disabled_hosts | default([])) | length > 0
  run_once: true

# Here rather than only in roles/controller: that role's copy is the backstop,
# and it does not run until the sixth play, by which time docker, vault,
# postgres, redis and a real ACME certificate have all been installed on the
# controller. The tag is a pure inventory value, so checking it costs nothing
# and belongs with the other local assertions — a typo or an unintended
# `latest` should cost seconds, not most of a converge.
#
# Not gated on preflight_verify_registries: that switch turns off NETWORK
# reads, and this one reaches nothing.
- name: Assert the controller image is repo + a non-floating tag
  ansible.builtin.assert:
    that:
      - controller_image_repo | default('') | length > 0
      - controller_image_tag | default('') | length > 0
      - >-
        controller_image_tag not in ['latest', 'stable', 'main', 'master']
        or (controller_image_allow_floating_tag | default(false) | bool)
    fail_msg: >-
      controller_image_tag is
      '{{ controller_image_tag | default("(unset)") }}', which does not name a
      fixed build. {{ preflight_image_pin_hint }}
    success_msg: >-
      controller image {{ controller_image_repo | default('') }}:{{ controller_image_tag | default('') }}
    quiet: true
  when:
    - "'controller' in group_names"
    # Attach mode never reads these: roles/controller's attach_prep recreates
    # the portal from the existing environment file's CS_REG.
    - not (existing_env | default(false))

- name: Warn that the controller image tag floats
  ansible.builtin.debug:
    msg: >-
      controller_image_tag is
      '{{ controller_image_tag }}' and controller_image_allow_floating_tag is
      true, so the pin check is being skipped deliberately. This host's
      controller build is whatever that tag pointed at the last time the image
      was pulled, and nothing here can tell you what that was. A converge will
      NOT notice the tag moving — the upgrade check compares the running
      image's name to '{{ controller_image_repo }}:{{ controller_image_tag }}',
      which still matches — so deploying a rebuild means running `cstacks
      upgrade` on the controller.
  when:
    - "'controller' in group_names"
    - not (existing_env | default(false))
    - controller_image_tag | default('') in ['latest', 'stable', 'main', 'master']
    - controller_image_allow_floating_tag | default(false) | bool

# Network checks last: everything above is a pure inventory/facts assertion
# that costs nothing, and there is no point reaching out to a registry for a
# run that a missing host var was going to stop anyway.
- name: Verify the container registries and the controller image
  ansible.builtin.include_tasks: registry.yml
  when: preflight_verify_registries | bool
