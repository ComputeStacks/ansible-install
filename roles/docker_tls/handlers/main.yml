---
# A full restart, not a reload: the TCP listener and the TLS material are
# ExecStart flags, which SIGHUP does not re-read. This stops tenant containers
# unless live-restore carries them (docker_config sets it), so it only ever
# fires on a real certificate or drop-in change.
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    enabled: true
    daemon_reload: true
