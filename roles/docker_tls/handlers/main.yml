---
# A full restart, not a reload: the TCP listener and the TLS material are
# ExecStart flags, which SIGHUP does not re-read. This stops tenant containers
# unless live-restore carries them (docker_config sets it), so it only ever
# fires on a real certificate or drop-in change.
#
# DEFERRED when `docker_tls_restart_deferred` is true, which
# playbooks/maintain-nodes.yml sets: that playbook converges a LIVE node
# inside a maintenance hold with its tenants running, and decides itself
# whether to stop them. There the restart does not happen here; the second
# handler below records why one is needed, and the maintenance cycle restarts
# dockerd inside the stopped window (roles/node_upgrade/README.md,
# "maintain-nodes"). Every handler in a role that maintain-nodes converges and
# that restarts dockerd must carry this same gate; tests/maintain_nodes.yml
# checks it.
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    enabled: true
    daemon_reload: true
  when: not (docker_tls_restart_deferred | bool)

- name: Record a deferred docker restart
  ansible.builtin.set_fact:
    docker_tls_restart_deferred_reasons: >-
      {{ ((docker_tls_restart_deferred_reasons | default([]))
          + ['docker_tls changed the daemon certificate or its ExecStart drop-in'
             ~ (' (check mode: would change)' if ansible_check_mode else '')])
         | unique }}
  listen: Restart docker
  when: docker_tls_restart_deferred | bool
