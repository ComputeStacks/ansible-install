---
# Issue the host certificate, install it where nginx (and, on the registry
# host, the registry containers) read it, and arm the renewal timer.
#
# Issuance converges on the SAN set: a certificate is (re)issued when none is
# installed, when the names it covers stop matching acme_web_domains (a host
# joined or left the metrics/registry group, a domain var changed), or when
# acme_web_force_issue is set (the CA-switch case -- the SAN set alone cannot
# see letsencrypt_test -> letsencrypt). EXPIRY is deliberately not ansible's
# job: the systemd timer below renews, and re-running the playbook must not
# race it.

- name: Check for an existing certificate
  ansible.builtin.stat:
    path: "{{ acme_web_cert_fullchain }}"
  register: acme_web_cert_stat

- name: Read the installed certificate
  ansible.builtin.slurp:
    src: "{{ acme_web_cert_fullchain }}"
  register: acme_web_cert_pem
  when: acme_web_cert_stat.stat.exists

# On the control machine (docs/contracts.md: the fleet carries no python
# crypto libraries). The fullchain is leaf-first, and the module parses the
# first certificate in the content.
- name: Inspect the installed certificate
  community.crypto.x509_certificate_info:
    content: "{{ acme_web_cert_pem.content | b64decode }}"
  delegate_to: localhost
  become: false
  register: acme_web_cert_info
  when: acme_web_cert_stat.stat.exists

- name: Decide whether to issue
  ansible.builtin.set_fact:
    acme_web_need_issue: >-
      {{ not acme_web_cert_stat.stat.exists
         or acme_web_force_issue | bool
         or ((acme_web_cert_info.subject_alt_name | default([])
              | map('regex_replace', '^DNS:', '') | list)
             | symmetric_difference(acme_web_domains) | length > 0) }}

- name: Report a SAN mismatch
  ansible.builtin.debug:
    msg: >-
      Re-issuing: the installed certificate covers
      [{{ acme_web_cert_info.subject_alt_name | default([]) | join(', ') }}]
      but this host's groups call for [{{ acme_web_domains | join(', ') }}].
  when:
    - acme_web_cert_stat.stat.exists
    - acme_web_need_issue | bool
    - not acme_web_force_issue | bool

# First certificate only: the real vhosts reference the certificate that does
# not exist yet, so nginx cannot start with them. This plain :80 vhost serves
# nothing but the challenge path; vhosts.yml overwrites it once the
# certificate is in place. A RE-issue never comes through here -- nginx is
# already serving the old certificate, and every vhost includes
# common/acme.conf, so the HTTP-01 challenge is reachable without touching
# the running configuration.
- name: Bootstrap the ACME validation vhost
  when: not acme_web_cert_stat.stat.exists
  block:
    - name: Render the bootstrap ACME vhost
      ansible.builtin.template:
        src: acme-bootstrap.conf.j2
        dest: "{{ acme_web_config_dir }}/conf.d/default.conf"
        owner: root
        group: root
        mode: "0644"

    - name: Start nginx for the ACME challenge
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true
        daemon_reload: true

- name: Issue the certificate
  when: acme_web_need_issue | bool
  block:
    - name: Confirm nginx is active before requesting the certificate
      ansible.builtin.systemd_service:
        name: nginx
      register: acme_web_nginx_state
      failed_when: acme_web_nginx_state.status.ActiveState != 'active'
      when: acme_web_challenge_method == 'http'

    - name: Write the nsupdate TSIG key
      ansible.builtin.template:
        src: acme-dns/nsupdate.conf.j2
        dest: "{{ acme_web_dns_tsig_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: acme_web_challenge_method == 'nsupdate'

    - name: Assert the selected DNS-01 provider is known
      ansible.builtin.assert:
        that:
          - acme_web_challenge_method in acme_web_dns_providers
        fail_msg: >-
          acme_web_challenge_method '{{ acme_web_challenge_method }}' is not 'http'
          and is not one of the supported DNS-01 providers
          ({{ acme_web_dns_providers.keys() | join(', ') }}). See
          docs/acme-providers.md.
      when: acme_web_challenge_method != 'http'

    # --force whenever a certificate already exists: we only get here on SAN
    # drift or an explicit force_issue, and acme.sh's own "not due yet" skip
    # must not veto either.
    - name: Request the certificate (HTTP-01 webroot)
      ansible.builtin.command:
        argv: >-
          {{ [acme_web_executable, '--home', acme_web_current_link,
              '--config-home', acme_web_config_home, '--issue',
              '--keylength', acme_web_keylength]
             + acme_web_domain_args
             + ['-w', acme_web_webroot]
             + (['--force'] if acme_web_cert_stat.stat.exists else []) }}
      register: acme_web_issue_http
      changed_when: acme_web_issue_http.rc == 0
      when: acme_web_challenge_method == 'http'

    - name: Request the certificate (DNS-01)
      ansible.builtin.command:
        argv: >-
          {{ [acme_web_executable, '--home', acme_web_current_link,
              '--config-home', acme_web_config_home, '--issue',
              '--keylength', acme_web_keylength]
             + acme_web_domain_args
             + ['--dns', acme_web_dns_providers[acme_web_challenge_method].plugin]
             + (acme_web_dns_providers[acme_web_challenge_method].extra_args | default([]))
             + (['--challenge-alias', acme_web_challenge_alias]
                if acme_web_challenge_alias | length > 0 else [])
             + (['--force'] if acme_web_cert_stat.stat.exists else []) }}
      environment: "{{ acme_web_dns_providers[acme_web_challenge_method].env }}"
      register: acme_web_issue_dns
      changed_when: acme_web_issue_dns.rc == 0
      no_log: true
      when: acme_web_challenge_method != 'http'

- name: Check whether the certificate is installed where nginx reads it
  ansible.builtin.stat:
    path: "{{ acme_web_cert_key }}"
  register: acme_web_key_stat

# --install-cert copies the certificate to its destination AND records the
# reload command acme.sh runs after every renewal. Runs after every (re)issue
# because --issue writes only acme.sh's own store; gated otherwise, because
# on the registry host the reload hook restarts every running registry
# container. --ecc: an ec-* keylength stores under <name>_ecc, and relying on
# acme.sh's fallback lookup breaks the day an RSA cert appears beside it.
- name: Install the certificate for nginx
  ansible.builtin.command:
    argv: >-
      {{ [acme_web_executable, '--home', acme_web_current_link,
          '--config-home', acme_web_config_home,
          '--install-cert', '-d', acme_web_cert_name]
         + (['--ecc'] if acme_web_keylength is match('^ec-') else [])
         + ['--key-file', acme_web_cert_key,
            '--fullchain-file', acme_web_cert_fullchain,
            '--reloadcmd', 'systemctl reload nginx'] }}
  register: acme_web_install_nginx
  changed_when: acme_web_install_nginx.rc == 0
  when: >-
    acme_web_need_issue | bool
    or not acme_web_key_stat.stat.exists
    or acme_web_force_install_cert | bool

- name: Install the container registry certificate
  ansible.builtin.include_tasks: registry_cert.yml
  when: "'registry' in group_names"

- name: Render the acme.sh renewal service
  ansible.builtin.template:
    src: renewal-systemd/acme_renew.service.j2
    dest: "/etc/systemd/system/{{ acme_web_renew_service }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Render the acme.sh renewal timer
  ansible.builtin.copy:
    src: acme_renew.timer
    dest: "/etc/systemd/system/{{ acme_web_renew_service }}.timer"
    owner: root
    group: root
    mode: "0644"

- name: Enable the acme.sh renewal timer
  ansible.builtin.systemd_service:
    name: "{{ acme_web_renew_service }}.timer"
    state: started
    enabled: true
    daemon_reload: true
