---
# acme.sh from the pinned, checksum-verified release tarball. The upstream
# installer never runs: its only jobs are a cron entry, shell-profile edits
# and the self-upgrade machinery (`--upgrade` replaces the install with git
# master), none of which belongs on these hosts. Renewal is the systemd timer
# in acme_cert.yml; upgrades are a versions.yml bump, which unpacks a new
# per-version directory and repoints the `current` symlink. State in
# `data/` -- the ACME account key, DNS provider credentials, issued
# certificates -- is untouched by a version change.

- name: Create the acme.sh directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ acme_web_home }}"
    - "{{ acme_web_config_home }}"

- name: Check for the pinned release
  ansible.builtin.stat:
    path: "{{ acme_web_release_dir }}/acme.sh"
  register: acme_web_release_stat

- name: Install the pinned release
  when: not acme_web_release_stat.stat.exists
  block:
    - name: Download the acme.sh release tarball
      ansible.builtin.get_url:
        url: "{{ acme_web_tarball_url }}"
        dest: "{{ acme_web_home }}/acme.sh-{{ acme_sh_version }}.tar.gz"
        checksum: "sha256:{{ acme_sh_tarball_sha256 }}"
        owner: root
        group: root
        mode: "0600"
      register: acme_web_tarball
      retries: 5
      delay: 5
      until: acme_web_tarball is succeeded

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: "{{ acme_web_home }}/acme.sh-{{ acme_sh_version }}.tar.gz"
        remote_src: true
        dest: "{{ acme_web_home }}"
        owner: root
        group: root
        creates: "{{ acme_web_release_dir }}/acme.sh"

    - name: Remove the tarball
      ansible.builtin.file:
        path: "{{ acme_web_home }}/acme.sh-{{ acme_sh_version }}.tar.gz"
        state: absent

- name: Point `current` at the pinned version
  ansible.builtin.file:
    src: "{{ acme_web_release_dir }}"
    dest: "{{ acme_web_current_link }}"
    state: link
    owner: root
    group: root

- name: Find superseded acme.sh versions
  ansible.builtin.find:
    paths: "{{ acme_web_home }}"
    file_type: directory
    patterns: "acme.sh-*"
    excludes: "acme.sh-{{ acme_sh_version }}"
  register: acme_web_old_releases

- name: Remove superseded acme.sh versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ acme_web_old_releases.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Assert the EAB credentials come as a pair
  ansible.builtin.assert:
    that:
      - (acme_web_eab_kid | length > 0) == (acme_web_eab_hmac_key | length > 0)
    fail_msg: >-
      acme_eab_kid and acme_eab_hmac_key must be set together — External
      Account Binding is a keyed pair, and acme.sh rejects half of one.
    success_msg: EAB credentials are consistent

# `--auto-upgrade 0` is a persisted setting, not a command: acme.sh saves it
# to account.conf, and every later invocation re-saves it in acme.sh's own
# quoting, so ansible never fights the file (a lineinfile here flapped
# `changed` forever). It matters because the renewal timer runs `--cron`,
# which WOULD replace the install with git master if AUTO_UPGRADE were ever
# "1". This task is local-only -- --set-default-ca touches no network.
- name: Select the default certificate authority and pin the self-upgrade off
  ansible.builtin.command:
    argv:
      - "{{ acme_web_executable }}"
      - --home
      - "{{ acme_web_current_link }}"
      - --config-home
      - "{{ acme_web_config_home }}"
      - --set-default-ca
      - --server
      - "{{ acme_web_ca }}"
      - --auto-upgrade
      - "0"
  changed_when: false

# Registration is gated on a stamp of (CA, email, EAB kid): acme.sh's
# --register-account is NOT a local no-op when already registered -- it
# fetches the CA directory and POSTs a signed newAccount request every time,
# so ungated it made every converge depend on the CA being reachable. The
# stamp is written only after a successful registration, so a failed one
# retries on the next run; changing the CA, the email or the EAB credentials
# re-registers.
- name: Read the account registration stamp
  ansible.builtin.stat:
    path: "{{ acme_web_config_home }}/.account-registered"
  register: acme_web_reg_stamp

- name: Compare the stamp to the configured account
  ansible.builtin.slurp:
    src: "{{ acme_web_config_home }}/.account-registered"
  register: acme_web_reg_stamp_content
  when: acme_web_reg_stamp.stat.exists

- name: Decide whether to register
  ansible.builtin.set_fact:
    acme_web_reg_desired: "{{ acme_web_ca }} {{ acme_web_account_email }} {{ acme_web_eab_kid }}"
    acme_web_need_register: >-
      {{ not acme_web_reg_stamp.stat.exists
         or (acme_web_reg_stamp_content.content | b64decode | trim)
            != (acme_web_ca ~ ' ' ~ acme_web_account_email ~ ' ' ~ acme_web_eab_kid) | trim }}

# no_log only when EAB is in play: the HMAC key rides in the argv. Without
# EAB the output stays visible, because "why did registration fail" is the
# question this task usually answers.
- name: Register the ACME account
  ansible.builtin.command:
    argv: >-
      {{ [acme_web_executable, '--home', acme_web_current_link,
          '--config-home', acme_web_config_home,
          '--register-account', '--server', acme_web_ca,
          '-m', acme_web_account_email]
         + (['--eab-kid', acme_web_eab_kid, '--eab-hmac-key', acme_web_eab_hmac_key]
            if acme_web_eab_kid | length > 0 else []) }}
  register: acme_web_register
  changed_when: true
  no_log: "{{ acme_web_eab_kid | length > 0 }}"
  when: acme_web_need_register | bool

- name: Write the account registration stamp
  ansible.builtin.copy:
    content: "{{ acme_web_reg_desired }}\n"
    dest: "{{ acme_web_config_home }}/.account-registered"
    owner: root
    group: root
    mode: "0600"
  when: acme_web_need_register | bool
