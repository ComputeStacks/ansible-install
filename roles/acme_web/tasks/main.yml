---
# nginx TLS terminator + acme.sh. Runs on the controller, metrics and
# registry hosts (playbooks/site.yml).

- name: Assert the nginx image is an exact pin
  ansible.builtin.assert:
    that:
      - nginx_image is defined
      - nginx_image is search(':')
      - not (nginx_image is search(':(latest|stable|mainline)$'))
    fail_msg: >-
      nginx_image must be an exact repo:tag pin from
      playbooks/group_vars/all/versions.yml. 'latest'/'stable'/'mainline'
      float and would silently change the TLS terminator under the fleet.

- name: Assert acme_sh_version is pinned to a checksummed release
  ansible.builtin.assert:
    that:
      - acme_sh_version is defined
      - acme_sh_version | length > 0
      - acme_sh_version not in ['master', 'main', 'HEAD']
      - acme_sh_tarball_sha256 is defined
      - acme_sh_tarball_sha256 | length == 64
    fail_msg: >-
      acme_sh_version must be an upstream acme.sh RELEASE TAG with its tarball
      sha256 beside it (see playbooks/group_vars/all/versions.yml). This role
      installs from the checksum-verified release tarball; bump the version
      and the checksum together.

- name: Assert this host has a certificate domain
  ansible.builtin.assert:
    that:
      - acme_web_domains | length > 0
    fail_msg: >-
      {{ inventory_hostname }} runs acme_web but no domain is configured for
      its group(s) {{ group_names | join(', ') }}. Set cs_portal_domain
      (controller), cs_metrics_domain (metrics) and/or cs_registry_domain
      (registry) in the inventory.

# The usernames are asserted alongside the passwords: a blank `name:` makes
# htpasswd write an entry nginx can never match, which fails identically to a
# wrong password (401) but looks like a working converge. No `no_log` here on
# purpose -- assert reports the unrendered condition text, not the values, so
# nothing leaks, and the operator needs to be told WHICH site is short.
- name: Assert the metrics basic-auth credentials are set
  ansible.builtin.assert:
    that:
      - acme_web_metrics_credentials.prometheus_username | length > 0
      - acme_web_metrics_credentials.prometheus_password | length > 0
      - acme_web_metrics_credentials.loki_username | length > 0
      - acme_web_metrics_credentials.loki_password | length > 0
    fail_msg: >-
      No complete prometheus/loki basic-auth credential for site
      "{{ cs_site }}". Set prometheus_basic_auth_password and
      loki_basic_auth_password in the vaulted secrets file, or give this site
      its own entry under metrics_site_credentials. They are the ONLY thing
      standing between the public internet and prometheus/loki on
      {{ cs_ports.metrics_prometheus }}/{{ cs_ports.metrics_loki }}.
  when: "'metrics' in group_names"

- name: Install the nginx support packages
  ansible.builtin.apt:
    name:
      - python3-passlib      # community.general.htpasswd
      - rsync                # the registry certificate reload hook
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the nginx directory layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ acme_web_config_dir }}"
    - "{{ acme_web_config_dir }}/common"
    - "{{ acme_web_config_dir }}/conf.d"
    - "{{ acme_web_config_dir }}/error_pages"
    - "{{ acme_web_html_dir }}"
    - "{{ acme_web_ssl_dir }}"
    - "{{ acme_web_webroot }}/.well-known/acme-challenge"

# World-readable on purpose (v1 parity): the nginx container's worker
# processes drop to `user nginx` (uid 101) and must read the htpasswd files
# to answer any authenticated request. 0750/0640 root:root makes every
# prometheus/loki request fail with a permission error in the nginx log.
# The tradeoff is accepted: the files hold bcrypt/md5-crypt hashes, not
# plaintext, and this is a single-purpose host with no untrusted local users.
- name: Create the htpasswd directory
  ansible.builtin.file:
    path: "{{ acme_web_htpasswd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nginx.conf
  ansible.builtin.copy:
    src: nginx.conf
    dest: "{{ acme_web_config_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Install the shared error page config
  ansible.builtin.copy:
    src: error_pages.conf
    dest: "{{ acme_web_config_dir }}/common/error_pages.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install the error pages
  ansible.builtin.copy:
    src: "error_files/{{ item }}"
    dest: "{{ acme_web_config_dir }}/error_pages/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 400-error.html
    - 403-error.html
    - 404-error.html
    - 408-error.html
    - 500-error.html
    - 502-error.html
    - 503-error.html
    - 504-error.html

- name: Install the holding page
  ansible.builtin.copy:
    src: error_files/503-error.html
    dest: "{{ acme_web_html_dir }}/index.html"
    owner: root
    group: root
    mode: "0644"

# Shipped as a file, NOT fetched from ssl-config.mozilla.org at converge time.
# ffdhe2048 is the fixed named group from RFC 7919 -- it is a constant, it has
# never changed and cannot, so downloading it bought nothing and made every
# converge depend on a third party being up. It was not: a 503 from that host
# failed this task and took the whole run down with it. `openssl dhparam -text`
# identifies the shipped copy as `GROUP: ffdhe2048`, which is the check that
# matters. See defaults/main.yml for overriding it.
- name: Install the dhparam group
  ansible.builtin.copy:
    src: "{{ acme_web_dhparam_file }}"
    dest: "{{ acme_web_config_dir }}/dhparam"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install the ACME challenge location snippet
  ansible.builtin.template:
    src: acme.conf.j2
    dest: "{{ acme_web_config_dir }}/common/acme.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Pull the nginx image
  community.docker.docker_image_pull:
    name: "{{ nginx_image }}"
    pull: not_present
    # Pinned tag, so a pull that already succeeded has nothing to fetch. The
    # module's default (`pull: always`) re-pulls regardless, reports `changed`
    # every single converge, and fires the restart handler below -- nginx was
    # bouncing on every run for no reason. Convergent by construction instead:
    # the tag is baked into the unit, so a bump in versions.yml re-renders the
    # unit and the handler restarts it then. Same rule as
    # roles/node_observability.
  notify: Restart nginx

- name: Render the nginx systemd unit
  ansible.builtin.template:
    src: nginx.service.j2
    dest: /etc/systemd/system/nginx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Install acme.sh
  ansible.builtin.include_tasks: acme_install.yml

- name: Issue and install the certificate
  ansible.builtin.include_tasks: acme_cert.yml

- name: Render the vhosts
  ansible.builtin.include_tasks: vhosts.yml

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
    daemon_reload: true
