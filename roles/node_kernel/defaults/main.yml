---
# Ported from v1 roles/node/{defaults,tasks/kernel_params.yml}.main.yml.
# See README.md for what each value does and why.

# nf_conntrack hashsize is a module parameter (not a sysctl) — it only takes
# effect at module load time. Sized to conntrack_max / 4, matching the
# kernel's own default ratio.
node_kernel_conntrack_hashsize: "250000"

node_kernel_sysctls:
  vm.max_map_count: "262144"
  net.core.netdev_max_backlog: "30000"
  net.core.rmem_max: "134217728"
  net.core.wmem_max: "134217728"
  net.ipv4.tcp_max_syn_backlog: "3240000"
  net.ipv4.tcp_rmem: "4096 87380 67108864"
  net.ipv4.tcp_wmem: "4096 87380 67108864"
  net.core.somaxconn: "500"
  fs.file-max: "16777216"
  fs.inotify.max_queued_events: "8388608"
  fs.inotify.max_user_instances: "8388608"
  fs.inotify.max_user_watches: "16777216"
  kernel.pid_max: "4194304"
  net.ipv4.tcp_mem: "765828 1021104 3063312"
  fs.aio-max-nr: "2097152"
  vm.min_free_kbytes: "524288"
  net.netfilter.nf_conntrack_max: "1000000"
  # BBR — new in v2, not present in v1.
  net.core.default_qdisc: "fq"
  net.ipv4.tcp_congestion_control: "bbr"
