---
# Container names are a CONTRACT, not a preference: the controller's
# prometheus alert rules carry an ignore-list matched on exactly these names
# (v1 `container_ignore_list`), so a renamed system container starts firing
# tenant alerts. Do not change them.
node_observability_cadvisor_container: cadvisor
node_observability_fluentd_container: fluentd

# --- cadvisor --------------------------------------------------------------
# cadvisor_image is pinned in playbooks/group_vars/all/versions.yml.
node_observability_cadvisor_restart_sec: 30
# Runs on the HOST network (no --publish), so the firewall's input chain
# actually filters the port. All interfaces on purpose: under the pairwise
# scrape rule the metrics host dials a node's TAILSCALE address whenever the
# metrics host is itself tailnet-joined, and a listener bound to primary_ip
# would refuse that connection. See README.md.
node_observability_cadvisor_listen_ip: "0.0.0.0"

# --- fluentd (loki output plugin) ------------------------------------------
# fluentd_loki_image is pinned in playbooks/group_vars/all/versions.yml.
node_observability_fluentd_config_dir: /etc/fluentd
node_observability_fluentd_config: "{{ node_observability_fluentd_config_dir }}/fluent.conf"
# Credentials live here rather than in the unit file so the loki password is
# not world-readable in /etc/systemd/system.
node_observability_fluentd_env_file: "{{ node_observability_fluentd_config_dir }}/loki.env"
# Node-local only: docker's fluentd log driver dials it on the loopback from
# this same host, so it is not part of the cs_ports cross-host contract. The
# container runs on the HOST network, so this bind is what keeps the listener
# off-box — nothing in the firewall needs to (or could) close it.
node_observability_fluentd_forward_bind: "127.0.0.1"
node_observability_fluentd_forward_port: 9432
# The fleet is one restart loop away from losing every tenant log line, so the
# unit backs off rather than hammering docker.
node_observability_fluentd_restart_sec: 30

# --- loki destination (SITE-scoped) ----------------------------------------
# Metrics hosts are SITE-scoped (docs/contracts.md §Vocabulary): a node ships
# its tenant logs to the loki vhost standing in its OWN physical facility, not
# to one platform-wide host. `cs_site_metrics_domains`, `cs_site_metrics_hosts`
# and `cs_site_metrics_credentials` are the frozen spellings, defined once in
# playbooks/group_vars/all/sites.yml. This role consumes them and re-derives
# nothing.
#
# There is deliberately no `node_observability_metrics_group` any more. It
# promised the group name was configurable, and that stopped being true the
# moment the maps in sites.yml became the single source of truth — they are
# built out of a literal groups['metrics'], so a role-local override would
# have named a group nobody reads. Nothing outside this role ever set it.
#
# LOCAL USE ONLY, docs/contracts.md hard rule 10: the host and domain maps
# reference `hostvars`, so they may only be read on the host currently
# executing. Every read below happens on the node itself, keyed by that node's
# own `cs_site`. NEVER `hostvars[n].cs_site_metrics_domains`.
#
# Single-site regression: an inventory that sets `site` nowhere puts every
# host in the site called `default`, each map holds exactly one key, and the
# endpoint resolves to exactly what `cs_metrics_domain` / `groups['metrics'] |
# first` produced before sites existed.

# Every metrics host that claims this node's site. Exactly 1 in a correct
# inventory; the assert in tasks/main.yml is the only consumer, and it wants
# the raw list rather than the map because building the map has already
# collapsed a duplicated site by the time anything can look at it.
node_observability_metrics_hosts_in_site: >-
  {{ (groups['metrics'] | default([])) | map('extract', hostvars)
     | selectattr('cs_site', 'eq', cs_site)
     | map(attribute='inventory_hostname') | list }}

# Basic auth on this site's loki vhost. THE USERNAME IS AS LOAD-BEARING AS THE
# PASSWORD, which is why both halves come from the same per-site source: v2
# defaults to `loguser`, a v1-built metrics host being attached to may use
# something else entirely, and a wrong username is a 401 with *exactly* the
# same symptom as a wrong password — fluentd ships nothing, docker keeps
# logging happily into it, nothing on the node complains, and the first thing
# that notices is roles/validate at the very end of a converge. Taking the
# password per site while leaving the username on a global default would
# recreate that silent failure for every site whose host does not use
# `loguser`.
#
# The fallback goes on the SUBSCRIPT, never on the field (contracts.md §Site
# scoping): a site absent from the optional vaulted `metrics_site_credentials`
# resolves wholly to the environment-wide defaults, whereas
# `…[cs_site].loki_password | default(x)` would swallow a site whose entry
# exists but is malformed, silently shipping the wrong credential.
node_observability_loki_username: "{{ (cs_site_metrics_credentials[cs_site] | default(cs_metrics_credentials_default)).loki_username }}"
node_observability_loki_password: "{{ (cs_site_metrics_credentials[cs_site] | default(cs_metrics_credentials_default)).loki_password }}"

# Loki sits behind the site's metrics host nginx TLS vhost. Prefer that site's
# metrics domain (that is what its certificate is issued for) and fall back to
# that metrics host's inventory primary_ip — an inventory var, never a gathered
# fact (contracts.md rule 1), so a --limit'ed run renders the same endpoint
# even with the metrics host outside the play.
#
# `cs_site_metrics_domains[cs_site]` has already fallen back to the
# environment-wide `cs_metrics_domain` if that site's metrics host names no
# `metrics_domain` host var; the length test here is only for the case where
# BOTH are empty. Both subscripts are unguarded on purpose — tasks/main.yml
# asserts this node's site has a metrics host, and a `| default()` would let a
# misconfigured node ship this site's tenant logs to another site's loki.
node_observability_loki_host: >-
  {{ cs_site_metrics_domains[cs_site]
     if (cs_site_metrics_domains[cs_site] | length > 0)
     else hostvars[cs_site_metrics_hosts[cs_site]].primary_ip }}
node_observability_loki_endpoint: "https://{{ node_observability_loki_host | trim }}:{{ cs_ports.metrics_loki }}"

# --- image preloads --------------------------------------------------------
# Images the controller expects to already be on a node when it schedules work
# (backup, restore, bastion). All pinned in versions.yml.
node_observability_preload_images:
  - "{{ borg_image }}"
  - "{{ bastion_image }}"
  - "{{ xtrabackup24_image }}"
  - "{{ xtrabackup80_image }}"
