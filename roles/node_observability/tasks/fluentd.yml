---
- name: Create the fluentd configuration directory
  ansible.builtin.file:
    path: "{{ node_observability_fluentd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the fluentd configuration
  ansible.builtin.template:
    src: fluent.conf.j2
    dest: "{{ node_observability_fluentd_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart fluentd

- name: Install the fluentd loki credentials
  ansible.builtin.template:
    src: loki.env.j2
    dest: "{{ node_observability_fluentd_env_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart fluentd

- name: Pull the pinned fluentd loki image
  community.docker.docker_image_pull:
    name: "{{ fluentd_loki_image }}"
    pull: not_present
  notify: Restart fluentd

# Same convergence rule as cadvisor: the pinned tag lives in the unit, so a
# version bump re-renders and restarts. v1 restarted fluentd unconditionally
# on every converge, which dropped buffered log lines each run.
- name: Deploy the fluentd systemd unit
  ansible.builtin.template:
    src: fluentd.service.j2
    dest: /etc/systemd/system/fluentd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart fluentd

- name: Enable and start fluentd
  ansible.builtin.systemd_service:
    name: fluentd
    state: started
    enabled: true
    daemon_reload: true
