---
- name: Restart postgres
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted
    enabled: true

- name: Restart pdns
  ansible.builtin.systemd_service:
    name: pdns
    state: restarted
    enabled: true

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
    enabled: true
