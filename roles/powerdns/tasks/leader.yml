---
# ns_primary only. Points postgres at its inventory address, opens
# replication to every host in ns_followers (iterated -- never [0], since
# more than one follower is a real, supported shape), and creates the pdns
# database + schema exactly once.

- name: Set postgres to listen on its inventory address
  ansible.builtin.lineinfile:
    path: "{{ powerdns_postgresql_conf }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = 'localhost,{{ primary_ip }}'"
  notify: Restart postgres

- name: Pin the postgres port to the ports contract
  ansible.builtin.lineinfile:
    path: "{{ powerdns_postgresql_conf }}"
    regexp: "^#?port\\s*="
    line: "port = {{ cs_ports.postgres }}"
  notify: Restart postgres

- name: Allow every follower to stream replication
  community.postgresql.postgresql_pg_hba:
    dest: "{{ powerdns_postgresql_hba_conf }}"
    contype: host
    users: "{{ powerdns_replication_user }}"
    databases: replication
    method: trust
    address: "{{ hostvars[item].primary_ip }}/32"
  loop: "{{ groups['ns_followers'] }}"
  notify: Restart postgres

- name: Apply listener/hba changes before touching database objects
  ansible.builtin.meta: flush_handlers

- name: Confirm postgres is reachable
  community.postgresql.postgresql_ping:
    login_db: postgres
  become: true
  become_user: postgres
  register: powerdns_pg_up
  until: powerdns_pg_up.is_available
  retries: 3
  delay: 5
  failed_when: not powerdns_pg_up.is_available

# These three are individually convergent, so they run unconditionally.
#
# They used to sit in a block gated on "can I connect to the pdns database as
# the pdns user", which conflated "the database exists" with "the database is
# ready to serve". Anything that interrupted the first converge between
# `Create the pdns database` and `Load the pdns base schema` -- a failure, a
# network blip, ^C -- left a database that answered the ping while holding no
# tables. Every later converge then skipped the whole block, including the
# schema load, and pdns crash-looped forever on `relation "domains" does not
# exist` with no way to recover short of dropping the database by hand.
# Observed exactly that. Guard on the schema itself instead (below).
- name: Create the pdns postgres role
  community.postgresql.postgresql_user:
    name: pdns
    role_attr_flags: "superuser,login"
    password: "{{ pdns_db_password }}"
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create the pdns database
  community.postgresql.postgresql_db:
    name: pdns
    owner: pdns
    encoding: UTF-8
    template: template0
    state: present
  become: true
  become_user: postgres

- name: Create the replication role
  community.postgresql.postgresql_user:
    name: "{{ powerdns_replication_user }}"
    role_attr_flags: replication
    state: present
  become: true
  become_user: postgres

# `domains` is the first table the pdns schema creates and the one pdns itself
# queries on startup, so its presence is the honest test of "schema loaded".
- name: Check whether the pdns schema has been loaded
  community.postgresql.postgresql_query:
    db: pdns
    query: "SELECT to_regclass('public.domains') IS NOT NULL AS present"
  become: true
  become_user: postgres
  register: powerdns_schema
  changed_when: false

- name: Load the pdns base schema
  when: not powerdns_schema.query_result[0].present
  block:
    - name: Restore the schema into the pdns database
      community.postgresql.postgresql_db:
        name: pdns
        state: restore
        # Canonical path in the pdns-backend-pgsql package. The
        # /usr/share/doc/pdns-backend-pgsql/schema.pgsql.sql this used to name
        # is only a symlink to it, and points at the same file; prefer the real
        # one. tasks/packages.yml installs the package before this runs.
        target: /usr/share/pdns-backend-pgsql/schema/schema.pgsql.sql
      become: true
      become_user: postgres

    - name: Verify the pdns database is reachable after creation
      community.postgresql.postgresql_ping:
        login_db: pdns
        login_host: 127.0.0.1
        login_port: "{{ cs_ports.postgres }}"
        login_user: pdns
        login_password: "{{ pdns_db_password }}"
      register: powerdns_db_verify
      failed_when: not powerdns_db_verify.is_available
      no_log: true
