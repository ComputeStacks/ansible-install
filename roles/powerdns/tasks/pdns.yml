---
# Runs on both ns_primary and ns_followers, AFTER the database exists.
#
# The packages themselves, and the port-53 handover from systemd-resolved, are
# in tasks/packages.yml and have already run by this point -- the leader needs
# pdns-backend-pgsql on disk before it can load the schema.

- name: Remove the default bind backend files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/powerdns/named.conf
    - /etc/powerdns/pdns.d/bind.conf

- name: Configure the postgres backend
  ansible.builtin.template:
    src: pdns-backend-gpgsql.conf.j2
    dest: /etc/powerdns/pdns.d/pdns.local.gpgsql.conf
    owner: root
    group: pdns
    mode: "0640"
  no_log: true
  notify: Restart pdns

- name: Render pdns.conf
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: root
    group: pdns
    mode: "0640"
  no_log: true
  notify: Restart pdns

- name: Ensure PowerDNS is enabled and running
  ansible.builtin.systemd_service:
    name: pdns
    state: started
    enabled: true

- name: Verify PowerDNS can reach its database
  community.postgresql.postgresql_ping:
    login_db: pdns
    login_host: 127.0.0.1
    login_port: "{{ cs_ports.postgres }}"
    login_user: pdns
    login_password: "{{ pdns_db_password }}"
  register: powerdns_service_db_check
  until: powerdns_service_db_check.is_available
  retries: 3
  delay: 5
  failed_when: not powerdns_service_db_check.is_available
  no_log: true
