---
# PowerDNS authoritative server + PostgreSQL backend on the `nameservers`
# hosts (ns_primary = leader, ns_followers = streaming replicas). See
# README.md for the leader/follower mechanism and the deviations from v1.

# SOA identity used for zones the leader creates. Override this per
# environment (e.g. group_vars/nameservers/main.yml in your inventory) to
# your real primary nameserver hostname -- the sample value below is a
# placeholder, not something to ship.
powerdns_name: "ns1.example.com"
powerdns_default_soa: "{{ powerdns_name }} hostmaster.@ 0 10800 3600 604800 3600"
powerdns_default_ttl: 14400
powerdns_query_cache_ttl: 20

# Dual-stack listener (v1 parity: PowerDNS binds both families from one
# comma-separated local-address list).
powerdns_dns_address: "0.0.0.0, ::"
# The API listener. Bound to this host's inventory address, NOT 0.0.0.0:
# `webserver-allow-from` (pdns.conf.j2) already restricts callers to the
# controller, but that is an application-level check on a socket otherwise
# open to every interface, and this API can rewrite every tenant zone. v1
# bound 0.0.0.0 with `pdns_web_allow: "0.0.0.0/0"` and relied entirely on a
# host firewall.
#
# primary_ip is the address the controller actually dials -- see
# `controller_seed_dns_primary_ip`, which is deliberately not a tailscale
# derivation. Override only if the controller reaches this host on some other
# interface.
powerdns_web_address: "{{ primary_ip }}"

powerdns_replication_user: repuser

# Whether this role owns the host's resolver configuration. True whenever
# systemd-resolved is present, which on Ubuntu means always: pdns cannot bind
# 0.0.0.0:53 while the resolved stub holds 127.0.0.53:53, so tasks/packages.yml
# turns the stub off (NOT resolved itself -- see the comment there) and points
# /etc/resolv.conf at resolved's upstream list. Set false only if something
# else on the host already manages /etc/resolv.conf and has freed port 53.
powerdns_manage_resolved: "{{ 'systemd-resolved.service' in (ansible_facts.services | default({})) }}"

# Run `pdnsutil create-zone` for cs_app_zone on the leader. Set false if the
# zone is managed by hand or by another tool.
powerdns_manage_zone: true

# Write each az's load balancer records into cs_app_zone on the leader
# (tasks/lb_records.yml): `<app_domain>. A <public_ip>`,
# `*.<app_domain>. CNAME <app_domain>.` and the ownership marker
# `_cs-lb.<app_domain>. TXT "owner=<node>"`. Only with `dns_driver: powerdns`.
# Set false if you publish those records yourself; roles/preflight and
# roles/validate read this same variable from ns_primary's hostvars, so set it
# where ns_primary sees it (group_vars/nameservers or ns_primary's host vars),
# NOT on the nodes. README.md has the ownership rules.
powerdns_manage_lb_records: true

# TTL of all three records. Part of convergence: a record carrying another TTL
# is rewritten.
powerdns_lb_record_ttl: 300

# The nodes whose records this run writes. site.yml: every node this repo is
# building. add-region.yml: the new region's nodes (cs_new_nodes there too,
# because the existing hosts carry `existing_env: true`). A node's domain is
# `hostvars[n].cs_app_domain` and its address `hostvars[n].public_ip`.
powerdns_lb_records_nodes: "{{ cs_new_nodes | default([]) }}"

# Per-zone dynamic updates are still fenced by tsig + allow-dnsupdate-from
# metadata (unset here) -- see https://doc.powerdns.com/authoritative/dnsupdate.html
powerdns_enable_dnsupdate: true

# Distro postgresql package paths. postgresql_version is the global pin from
# playbooks/group_vars/all/versions.yml (currently 17) -- the same value the
# controller's geerlingguy.postgresql instance uses; both just mean "major
# version 17", they are unrelated running instances on different hosts.
powerdns_postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}"
powerdns_postgresql_main_dir: "{{ powerdns_postgresql_data_dir }}/main"
powerdns_postgresql_conf: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
powerdns_postgresql_hba_conf: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
