---
# Attach mode (add-region.yml). Prepares an EXISTING, v1-built controller to
# accept a new region without ever rewriting anything it already owns.
#
# docs/contracts.md §Attach mode: /etc/default/computestacks is append-only,
# ALWAYS. The v2 cstacks script is one of the two whole-file exceptions.
#
# Assert first, generate the new regions' certificates, then take a database
# backup, then append, then swap the script, then recreate the container.
# EVERY read-only check belongs above the pg_dump: from there on the play is
# slow (a dump of the production database), then noisy (an append to the
# environment file, v2's cstacks over v1's), then disruptive (a portal
# recreate, 30-60s with the portal, the API and the job queues down). A check
# that runs after all that is not a gate, it is an autopsy.
#
# The certificate generation is the one WRITE above the dump, and it is there
# for the same reason: it only ever creates paths this controller does not
# already have, and failing it after the restart would be an autopsy too. Its
# own block says the rest.

- name: Stat the existing controller environment file
  ansible.builtin.stat:
    path: "{{ controller_env_file }}"
  register: controller_attach_env_stat

- name: Assert the existing controller environment file is present
  ansible.builtin.assert:
    that:
      - controller_attach_env_stat.stat.exists
    fail_msg: >-
      {{ controller_env_file }} does not exist on {{ inventory_hostname }}.
      Attach mode expects an existing, running ComputeStacks controller. If
      this is a greenfield install, drop `existing_env: true` and run
      site.yml instead.

- name: Read the existing controller environment file
  ansible.builtin.slurp:
    src: "{{ controller_env_file }}"
  register: controller_attach_env_raw
  no_log: true

- name: Extract the environment keys attach mode cares about
  ansible.builtin.set_fact:
    controller_attach_env_lines: "{{ (controller_attach_env_raw.content | b64decode).splitlines() }}"
  no_log: true

- name: Extract the existing SECRET_KEY_BASE
  ansible.builtin.set_fact:
    controller_attach_secret_key_base: >-
      {{ (([''] + (controller_attach_env_lines | select('match', '^SECRET_KEY_BASE=') | list))
          | last | split('=', 1) | last | trim) }}
  no_log: true

# The manifest apply encrypts with SECRET_KEY_BASE. Applying under a
# different one writes secrets the running controller decrypts to nil —
# silent, total credential loss for everything the apply touches. This is the
# single most expensive mistake attach mode can make, so it aborts here.
- name: Assert the configured secret_key_base matches the existing controller
  ansible.builtin.assert:
    that:
      - controller_attach_secret_key_base | length > 0
      - secret_key_base == controller_attach_secret_key_base
    fail_msg: >-
      secret_key_base in the vaulted secrets file does not match
      SECRET_KEY_BASE in {{ controller_env_file }} on {{ inventory_hostname }}
      (or that key is missing from the file). Every encrypted column in the
      controller keys off SECRET_KEY_BASE; seeding under a different value
      writes credentials the running application cannot decrypt. Copy the
      EXISTING value into secrets.yml — never the other way around.
    success_msg: "secret_key_base matches the existing controller"
  when: secret_key_base is defined

- name: Assert the cstacks CLI exists on the existing controller
  ansible.builtin.stat:
    path: "{{ controller_bin }}"
  register: controller_attach_bin_stat
  failed_when: not controller_attach_bin_stat.stat.exists

# --- gates on the running controller, still writing nothing ----------------

# v1 hardcoded the name `portal` and never wrote CS_CONTAINER_NAME; v2 reads
# CS_CONTAINER_NAME with `portal` as its fallback. Resolve it the same way the
# script will, so both shapes work and neither is guessed at.
- name: Resolve the portal container name from the existing environment file
  ansible.builtin.set_fact:
    controller_attach_container: >-
      {{ (([''] + (controller_attach_env_lines | select('match', '^CS_CONTAINER_NAME=') | list))
          | last | split('=', 1) | last | trim) | default(controller_container_name, true) }}

- name: Look for the running portal container
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --quiet
      - --filter
      - "name=^{{ controller_attach_container }}$"
  register: controller_attach_container_ps
  changed_when: false

- name: Assert the portal container is running
  ansible.builtin.assert:
    that:
      - (controller_attach_container_ps.stdout | trim) | length > 0
    fail_msg: >-
      No running container named '{{ controller_attach_container }}' on
      {{ inventory_hostname }}. Attach mode prepares a LIVE controller, and the
      next check reads the image that controller is running. Start it
      (`cstacks run`) and run this playbook again.
    success_msg: "the {{ controller_attach_container }} container is running"

# THE prerequisite docs/attach-mode.md states and nothing used to check.
# preflight's two controller-image assertions are both skipped for
# `existing_env`, so a controller that was never `cstacks upgrade`d used to
# get all the way past the dump, the environment append, the script swap, the
# portal restart and a fully-built new node before `cstacks seed` died with
# `Don't know how to build task 'bootstrap:apply'` — leaving a half-attached
# region and a controller that had already been restarted for nothing.
#
# Read with `docker exec`, NOT through `cstacks runner`: the script on disk at
# this point is still v1's, and v1's cstacks has no `runner` subcommand at all
# (it predates that contract) — relying on it here would fail on exactly the
# controllers this check exists for. `rake --all --tasks` loads the Rakefile
# and prints the task list; it executes no task and writes nothing.
#
# The RUNNING container is the right thing to ask. v1's `run()` mounts no rake
# tasks into it (only its `bootstrap` subcommand ever mounted CS_RAKE_PATH),
# so the task list it reports is the image's own — which is what `cstacks
# seed` later starts a fresh container from.
- name: Probe the running controller for the bootstrap:apply rake task
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ controller_attach_container }}"
      - bundle
      - exec
      - rake
      - --all
      - --tasks
  register: controller_attach_rake_tasks
  changed_when: false
  failed_when: false

- name: Assert the running controller defines the bootstrap:apply rake task
  ansible.builtin.assert:
    that:
      - controller_attach_rake_tasks.rc == 0
      - "'bootstrap:apply' in controller_attach_rake_tasks.stdout"
    fail_msg: >-
      The controller image running on {{ inventory_hostname }} does not define
      `rake bootstrap:apply`
      {{ "(the task list could not be read: rc="
         ~ controller_attach_rake_tasks.rc ~ ", "
         ~ (controller_attach_rake_tasks.stderr | default('') | trim | truncate(300))
         ~ ")" if controller_attach_rake_tasks.rc != 0 else "" }}.
      Attach mode seeds the new region through that task, so the existing
      controller must be upgraded to a release carrying it FIRST — run
      `cstacks upgrade` on {{ inventory_hostname }}, confirm the portal comes
      back, then run this playbook again (docs/attach-mode.md §Prerequisites).
      Nothing has been changed on this controller yet.
    success_msg: "the running controller defines bootstrap:apply"

# The v2 cstacks script sources the environment file and then applies
# `: "${VAR:=default}"` fallbacks (roles/controller/files/cstacks.sh). A key
# the file omits therefore silently takes V2's default, and `docker run`
# CREATES a missing bind-mount source as an empty directory — mounting
# nothing over what should have been there, with no error anywhere.
#
# CS_SSH_KEYS_PATH is the one that matters: v1 keeps the application keypair
# in /var/lib/computestacks/sshkeys (v1 roles/controller `ssh_keys_directory`,
# and roles/ssh_trust/defaults/main.yml says the same) while v2 defaults to
# /etc/computestacks/.ssh. Get it wrong and the portal mounts an empty
# lib/ssh: every controller -> node ssh operation in the FLEET fails —
# volumes, haproxy certificate deploys, load balancer reloads, registry
# orders — and nothing in this run notices.
#
# v1's own environment file template writes all three of these keys, so a
# stock v1 controller passes. This is the guard for the ones that are not
# stock. The fallbacks below are the role variables the script's literals were
# taken from; they are the same strings and they move together.
- name: Resolve the directories the v2 cstacks script will bind-mount
  ansible.builtin.set_fact:
    controller_attach_mounts:
      - key: CS_CERT_PATH
        path: >-
          {{ ((([''] + (controller_attach_env_lines | select('match', '^CS_CERT_PATH=') | list))
               | last | split('=', 1) | last | trim) | default(controller_certificates_dir, true))
             ~ '/docker' }}
        purpose: >-
          the portal's docker client certificate, which every controller ->
          node docker operation authenticates with
      - key: CS_BRANDING_PATH
        path: >-
          {{ (([''] + (controller_attach_env_lines | select('match', '^CS_BRANDING_PATH=') | list))
              | last | split('=', 1) | last | trim) | default(controller_branding_dir, true) }}
        purpose: >-
          the branding assets mounted over public/assets/custom; an empty one
          serves the portal with no stylesheet
      - key: CS_SSH_KEYS_PATH
        path: >-
          {{ (([''] + (controller_attach_env_lines | select('match', '^CS_SSH_KEYS_PATH=') | list))
              | last | split('=', 1) | last | trim) | default(controller_ssh_key_dir, true) }}
        purpose: >-
          the application ssh keypair every controller -> node operation uses
          (volumes, haproxy certificate deploys, load balancer reloads)

- name: Stat the directories the v2 cstacks script will bind-mount
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ controller_attach_mounts }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.path }}"
  register: controller_attach_mount_stat

- name: Assert every directory the v2 cstacks script mounts already exists
  ansible.builtin.assert:
    that:
      # `isdir` is absent entirely when the path does not exist, hence the
      # guard: the useful message is the one below, not a templating error.
      - item.stat.exists
      - item.stat.isdir | default(false)
    fail_msg: >-
      {{ item.item.path }} does not exist on {{ inventory_hostname }} (or is
      not a directory), but the v2 cstacks script will bind-mount it as
      {{ item.item.key }} — {{ item.item.purpose }}. Docker would create it
      empty and mount that over the container's own path, silently. Either
      {{ item.item.key }} is missing from {{ controller_env_file }} and this is
      v2's default standing in for a path v1 keeps somewhere else, or the
      directory really is gone. Add the correct
      {{ item.item.key }}=<path> line to {{ controller_env_file }} by hand
      (it is append-only and this playbook will not rewrite it) and run again.
      Nothing has been changed on this controller yet.
    success_msg: "{{ item.item.key }}: {{ item.item.path }}"
  loop: "{{ controller_attach_mount_stat.results }}"
  loop_control:
    label: "{{ item.item.key }}"

# --- the new regions' wildcard certificates --------------------------------
#
# WHY ATTACH MODE GENERATES CERTIFICATES AT ALL. tasks/main.yml never runs
# here, so until now nothing did — and controller_seed then slurped whatever
# sat at `controller_seed_shared_cert_path`, which on a v1-built controller
# is the EXISTING environment's certificate, and seeded
# it as the new region's `shared_certificate` while the manifest rendered the
# new region's own domain. The new load balancer would serve a certificate
# whose CN is another region's name, and every tenant TLS handshake against
# it would mismatch. v1 was accidentally correct here only because it
# regenerated its single certificate on every run, so the cert always matched
# that run's domain.
#
# WHY ABOVE THE pg_dump. The file header's rule, and this is the case it was
# written for: everything below is slow (a dump of the production database),
# then noisy (an append to the environment file, v2's cstacks over v1's),
# then disruptive (a portal recreate — 30-60s with the portal, the API and
# the job queues all down). openssl failing here — an unwritable data
# directory, a domain that is not a domain — after all of that would leave a
# restarted controller and a half-attached region, and controller_seed would
# fail on the missing pem immediately afterwards anyway. This is the one
# thing in this file that writes something the existing controller does not
# already own, so it is also the one write that is safe to do before the
# backup: it creates new paths and touches nothing that exists.
#
# WHY THE TASK LIST IS ENUMERATED rather than reusing tasks/main.yml's. The
# two tasks this depends on live in the greenfield converge next to things
# that must never run here: main.yml's directory-layout loop chmods
# /etc/computestacks, /etc/computestacks/certificates, /var/lib/computestacks
# and the certificate root itself — all v1-owned paths on this host, and
# docs/contracts.md rule 9 permits additive fragments only. Note what the
# tasks below do NOT do: no task names `cs_app_wildcard_dir` on its own, so
# its mode is never touched. `file: state=directory` creates a missing parent
# but applies owner/group/mode only to directories it actually creates, so a
# v1 `.ssl_wildcard` keeps whatever mode v1 gave it.
#
# There is also no `cs_app_wildcard_dir` vs `controller_wildcard_dir`
# consistency assert here, unlike tasks/main.yml. Attach mode never reads or
# writes the legacy path: this role writes `cs_app_wildcard_dir` and
# controller_seed reads `cs_app_wildcard_dir`, one spelling at both ends, and
# `controller_data_dir` on a v1 controller is none of v2's business.
- name: Assert attach mode generates a certificate for every new region
  ansible.builtin.assert:
    that:
      - (controller_per_az_app_domains | length) > 0
      - (controller_per_az_app_domains | length) == (cs_app_domains | length)
    fail_msg: >-
      The new regions in this run resolve to the load balancer domains
      {{ cs_app_domains }}, and
      {{ (cs_app_domains | length) - (controller_per_az_app_domains | length) }}
      of them {{ "is" if ((cs_app_domains | length) - (controller_per_az_app_domains | length)) == 1
                 else "are" }} the environment-wide zone
      '{{ cs_app_zone }}' itself (or the list is empty and no new node reached
      this play at all). Attach mode must never seed a new region from the
      legacy certificate at {{ controller_wildcard_cert }} — that pem is the
      EXISTING environment's, its CN is the existing environment's domain, and
      nothing here would generate anything for the new region. Give every new
      node its own `app_domain` host var
      (playbooks/group_vars/all/app_domains.yml). roles/preflight makes the
      same check with the operator-facing explanation; if you are seeing this
      one, preflight was skipped.
    success_msg: >-
      generating for {{ controller_per_az_app_domains | join(', ') }}

- name: Create a directory for each new region's wildcard certificate
  ansible.builtin.file:
    path: "{{ cs_app_wildcard_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ controller_per_az_app_domains }}"

- name: Write each new region's wildcard openssl config
  ansible.builtin.template:
    src: ssl_wildcard.cnf.j2
    dest: "{{ cs_app_domain_cert_paths[item] | dirname }}/{{ controller_wildcard_config_name }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ controller_per_az_app_domains }}"
  vars:
    controller_wildcard_cn: "{{ item }}"

# GENERATE-ONCE, PER DOMAIN, exactly as the greenfield converge does: a
# second attach run for the same region must find the pem already there and
# do nothing, because controller_seed re-applies the manifest and
# `Bootstrap::Writer#rotate!` writes a `shared_certificate` whose decrypted
# value differs — a regenerated pem here is a rotated certificate on a live
# load balancer.
- name: Generate each new region's self-signed wildcard certificate (once)
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "{{ controller_wildcard_days }}"
      - -newkey
      - "rsa:{{ controller_wildcard_key_bits }}"
      - -sha256
      - -keyout
      - "{{ cs_app_domain_cert_paths[item] }}"
      - -out
      - "{{ cs_app_domain_cert_paths[item] }}"
      - -config
      - "{{ cs_app_domain_cert_paths[item] | dirname }}/{{ controller_wildcard_config_name }}"
      - -extensions
      - v3_req
    creates: "{{ cs_app_domain_cert_paths[item] }}"
  loop: "{{ controller_per_az_app_domains }}"

- name: Restrict each new region's wildcard certificate (it carries the private key)
  ansible.builtin.file:
    path: "{{ cs_app_domain_cert_paths[item] }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ controller_per_az_app_domains }}"

# Gate: nothing below is destructive, but everything after it (the manifest
# apply in controller_seed) writes to the database. A failed pg_dump stops
# the attach here.
- name: Back up the existing controller database
  ansible.builtin.command:
    argv:
      - "{{ controller_bin }}"
      - database-backup
  register: controller_attach_backup
  changed_when: controller_attach_backup.rc == 0

# The fourth mount, and the only one this play may create rather than assert:
# CS_PROXY_IPS_PATH is new in v2, so a v1 environment file never carries it.
# If one DOES -- a controller prepared by an earlier attach run, or an
# operator who set it by hand -- that value wins, because the file is
# append-only and the append below is skipped when the key is present.
# Creating the role's own default instead would leave docker to auto-create
# the real one, empty.
- name: Resolve the proxy IP list directory
  ansible.builtin.set_fact:
    controller_attach_proxy_ips_dir: >-
      {{ (([''] + (controller_attach_env_lines | select('match', '^CS_PROXY_IPS_PATH=') | list))
          | last | split('=', 1) | last | trim) | default(controller_proxy_ips_dir, true) }}

- name: Create the proxy IP list directory
  ansible.builtin.file:
    path: "{{ controller_attach_proxy_ips_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# APPEND ONLY, and only when the key is absent. A key that is already present
# keeps its existing value byte-for-byte — no regexp, so lineinfile can never
# rewrite a line that is already there.
- name: Append NODE_ENROLLMENT_TOKEN to the existing environment file
  ansible.builtin.lineinfile:
    path: "{{ controller_env_file }}"
    line: "NODE_ENROLLMENT_TOKEN={{ node_enrollment_token }}"
    insertafter: EOF
    state: present
  no_log: true
  when: controller_attach_env_lines | select('match', '^NODE_ENROLLMENT_TOKEN=') | list | length == 0
  notify: Recreate the portal container

- name: Append CS_PROXY_IPS_PATH to the existing environment file
  ansible.builtin.lineinfile:
    path: "{{ controller_env_file }}"
    line: "CS_PROXY_IPS_PATH={{ controller_proxy_ips_dir }}"
    insertafter: EOF
    state: present
  when: controller_attach_env_lines | select('match', '^CS_PROXY_IPS_PATH=') | list | length == 0
  notify: Recreate the portal container

- name: Warn when the existing controller carries no NODE_ENROLLMENT_TOKEN of its own
  ansible.builtin.debug:
    msg: >-
      NODE_ENROLLMENT_TOKEN was appended to {{ controller_env_file }}. The new
      node's cs-agent enrollment uses this value; it must be the same one the
      inventory hands the node. If this controller already had a token under a
      different name, stop and reconcile before enrolling.
  when: controller_attach_env_lines | select('match', '^NODE_ENROLLMENT_TOKEN=') | list | length == 0

- name: Install the v2 cstacks CLI
  ansible.builtin.copy:
    src: cstacks.sh
    dest: "{{ controller_bin }}"
    owner: root
    group: root
    mode: "0750"
    backup: true
  notify: Recreate the portal container

- name: Install the cstacks bash completion
  ansible.builtin.copy:
    src: cstacks_completion.sh
    dest: "{{ controller_completion_file }}"
    owner: root
    group: root
    mode: "0644"

# Explicit, not left to the end of the play: controller_seed runs next and
# needs a portal container that carries NODE_ENROLLMENT_TOKEN and the
# proxy_ips mount.
- name: Apply the queued portal recreate
  ansible.builtin.meta: flush_handlers
