---
# Controller host. Owns /etc/default/computestacks, the `cstacks` CLI, the
# portal container, the app ssh keypair and the self-signed tenant wildcard.
# See README.md.

# --- paths (v1 layout, with the two v2 changes noted) ---------------------
controller_config_dir: /etc/computestacks
controller_certificates_dir: "{{ controller_config_dir }}/certificates"
# Written by roles/vault (pki/docker client cert). Watched by this role's
# restart handler: the portal reads it once at boot, so a rotation that
# nobody restarts for leaves the controller talking to nodes with an expired
# client certificate.
controller_docker_certs_dir: "{{ controller_certificates_dir }}/docker"
controller_docker_client_cert: "{{ controller_docker_certs_dir }}/cert.pem"

# v2 CHANGE: v1 kept the app keypair in /var/lib/computestacks/sshkeys. It
# moves under /etc/computestacks because roles/ssh_trust reads
# /etc/computestacks/.ssh/id_ed25519.pub to seed root's authorized_keys on
# every node and on the registry host (control-plane edges #4/#19).
controller_ssh_key_dir: "{{ controller_config_dir }}/.ssh"
controller_ssh_key: "{{ controller_ssh_key_dir }}/id_ed25519"

controller_data_dir: /var/lib/computestacks
controller_backups_dir: "{{ controller_data_dir }}/backups"
controller_branding_dir: "{{ controller_data_dir }}/branding"
# Where the portal image keeps the stock copies of the branding assets. The
# image serves them from `public/custom` in development; in production the
# layout links `/assets/custom/...`, which is where controller_branding_dir is
# mounted, and the image ships nothing there. Seeding is what connects the two.
controller_image_branding_source: /usr/src/app/public/custom
# Copy any of those assets that the branding directory does not already have,
# once the portal container is up. v1 downloaded them from f.cscdn.cc on every
# bootstrap; v2 dropped that (unpinned third-party content in the portal's
# asset path) but nothing replaced it, so a fresh install mounted an EMPTY
# directory over public/assets/custom and every page 404'd on
# `/assets/custom/application.css` — the portal came up unstyled.
# Taking them from the pinned controller image instead keeps the fix inside
# the image the operator already chose.
# Per FILE, never a directory-level overwrite: an operator who drops their own
# logo-login.png keeps it and still gets the stylesheet. Set false to manage
# the directory entirely by hand.
controller_seed_default_branding: true
# v2 NEW: ProxyIpList's persistent store (app/services/proxy_ip_list.rb).
# Bind-mounted onto /usr/src/app/lib/proxy_ips; without it the CDN proxy IP
# lists are re-fetched into a throwaway container filesystem on every restart.
controller_proxy_ips_dir: "{{ controller_data_dir }}/proxy_ips"

# THE LEGACY certificate paths, and only those. They are the path the
# environment-wide `cs_app_zone` gets — every az of every inventory written
# before per-az domains existed — and they keep the exact spelling v1 and v2
# have always used, because `Bootstrap::Writer#rotate!` compares the
# DECRYPTED credential and moving this file would push a brand new
# certificate to every load balancer in the fleet on the next converge.
#
# A per-az domain's certificate does NOT derive from these. It lives at
# `<cs_app_wildcard_dir>/<domain>/sharedcert.pem`, rooted on the ONE global
# spelling in playbooks/group_vars/all/app_domains.yml, because
# roles/controller_seed has to read the same path back and none of the names
# below are in scope in the seeding play. tasks/main.yml asserts that
# `cs_app_wildcard_dir` and `controller_wildcard_dir` still agree — this role
# is the only place both are in scope — so an operator who moves
# `controller_data_dir` is told to set `app_wildcard_dir` too rather than
# quietly ending up with certificates written to one root and read from
# another.
controller_wildcard_dir: "{{ controller_data_dir }}/.ssl_wildcard"
controller_wildcard_cert: "{{ controller_wildcard_dir }}/sharedcert.pem"
# Every certificate's openssl config sits beside the pem it produced, under
# this name — the legacy one in the root, a per-az one in that domain's
# directory. tasks/main.yml and tasks/attach_prep.yml both spell it
# `<that domain's pem> | dirname` + this, so the two layouts need one
# expression and `controller_wildcard_config` below cannot drift away from
# what the legacy domain actually gets.
controller_wildcard_config_name: selfwildcard.conf
controller_wildcard_config: "{{ controller_wildcard_dir }}/{{ controller_wildcard_config_name }}"

controller_env_file: /etc/default/computestacks
controller_db_sentinel: "{{ controller_data_dir }}/.db_provisioned"
controller_docker_cert_state_file: "{{ controller_data_dir }}/.docker_cert.sha256"
controller_bin: /usr/local/bin/cstacks
controller_completion_file: /etc/bash_completion.d/cstacks

# --- self-signed tenant wildcards, one per availability zone ---------------
# The LoadBalancer `shared_certificate` input (manifest
# locations[].regions[].load_balancer.shared_certificate, Wave 4I). Cert and
# key are written into ONE pem, which is the form haproxy wants.
#
# GENERATE-ONCE, PER DOMAIN (`creates:` on that domain's own path). v1
# regenerated its single certificate on every run; under v2's
# convergent-by-default rule that would rotate the shared certificate on
# every converge and roll it out to every load balancer in the fleet.
#
# THERE IS NO `controller_wildcard_domain` ANY MORE, and its absence is the
# feature. It was the one environment-wide CN; every az now has its own load
# balancer domain (`app_domain` -> `cs_app_domain`,
# playbooks/group_vars/all/app_domains.yml) and its own certificate, and the
# CN of each is the loop item in tasks/main.yml. Keeping it alive as a
# "single-domain override" would have been a silent CN/domain mismatch: the
# manifest's load balancer `domain` comes from `cs_app_domain`, which knows
# nothing about it, so the override would have moved every certificate's CN
# and left every rendered domain exactly where it was — every load balancer
# in the fleet serving a certificate for a name it does not answer on.
#
# roles/preflight fails the run when an inventory still sets it. That check
# can only see inventory and extra vars — role defaults are not in scope in
# preflight's play — which is why the default had to be DELETED here rather
# than documented as deprecated. A default left in place is a value that is
# always set, and preflight would never have seen it.
#
# The remaining knobs below apply to every domain's certificate alike.
controller_wildcard_days: 3650
controller_wildcard_key_bits: 2048
controller_wildcard_country: US
controller_wildcard_state: OR
controller_wildcard_locality: Portland
controller_wildcard_org: ComputeStacks
controller_wildcard_org_unit: Deployment

# --- application ----------------------------------------------------------
controller_container_name: portal
# Links bug reports to this installation. Single lowercase word.
controller_app_id: default
controller_locale: "{{ locale | default('en') }}"
controller_currency: "{{ currency | default('USD') }}"

controller_postgres_user: computestacks
controller_postgres_database: cloudportal
controller_postgres_host: 127.0.0.1
controller_postgres_pool: 40
# Peer-auth superuser role + matching database, so `cstacks database-backup`
# can pg_dump as root with no credentials in the command line. v1's
# roles/controller_postgres created these; geerlingguy.postgresql does not.
controller_postgres_root_role: root
controller_postgres_service: postgresql

controller_redis_host: 127.0.0.1

controller_rails_max_threads: 15
controller_rails_min_threads: 15
controller_puma_workers: 2
controller_queue_system: 15
controller_queue_deployments: 20
controller_queue_le: 2
controller_malloc_conf: "dirty_decay_ms:1000,narenas:2,background_thread:true,stats_print:false"
controller_ruby_yjit_enable: 1

# Bug reporting. Empty disables it. Set `sentry_dsn` in the vaulted secrets
# file to report to ComputeStacks' Sentry or to your own installation.
controller_sentry_dsn: "{{ sentry_dsn | default('') }}"

# When the running container's image no longer matches CS_REG (a
# controller_image_tag bump in versions.yml), run the full
# `cstacks upgrade` — database backup, pull, migrate, restart — instead of
# just recreating the container on an unmigrated schema. Set false to make a
# tag bump a manual, operator-driven upgrade.
controller_auto_upgrade: true
