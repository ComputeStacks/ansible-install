---
# Two mutually exclusive paths:
#   * greenfield / v2-built hosts -> our own nftables table (nftables.yml)
#   * attach mode (existing_env)  -> additive appends to whichever firewall the
#                                    host runs (append.yml -> v1_append.yml or
#                                    v2_append.yml)
# The nftables path must NEVER run on an existing_env host: it would replace a
# working v1 INPUT policy with a table built from a PARTIAL inventory view
# (docs/contracts.md rule 9) and lock the operator out of the fleet.

- name: Derive tailnet membership and routing from inventory
  ansible.builtin.import_tasks: tailnet.yml

- name: Apply the additive firewall updates (attach mode)
  ansible.builtin.include_tasks: append.yml
  when: existing_env | default(false) | bool

- name: Apply the ComputeStacks nftables table
  ansible.builtin.include_tasks: nftables.yml
  when: not (existing_env | default(false) | bool)
