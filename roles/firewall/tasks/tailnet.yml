---
# Tailnet membership and tailnet routing, both pure inventory (README
# §Tailnet membership). Its own file so tests/tailscale_routing.yml can derive
# the same two lists the template reads without applying a firewall.

- name: Reset the derived tailnet membership lists
  ansible.builtin.set_fact:
    firewall_tailnet_hosts: []
    firewall_tailnet_routed_hosts: []

- name: Determine which hosts are intended members of the tailnet
  ansible.builtin.set_fact:
    firewall_tailnet_hosts: >-
      {{ firewall_tailnet_hosts
         + ([item] if (hostvars[item].tailscale_enabled | default(false) | bool)
            else []) }}
  loop: "{{ groups['all'] }}"
  # The membership predicate (docs/contracts.md §Tailnet membership), pure
  # inventory like site.yml's gate, so it stays correct under --limit, where
  # un-targeted hosts have no facts at all.

- name: Determine which tailnet members carry control-plane traffic over it
  ansible.builtin.set_fact:
    firewall_tailnet_routed_hosts: >-
      {{ firewall_tailnet_routed_hosts
         + ([item] if not (hostvars[item].tailscale_access_only | default(false) | bool)
            else []) }}
  loop: "{{ firewall_tailnet_hosts }}"
  # docs/contracts.md §Tailscale access-only mode: a member with
  # `tailscale_access_only: true` is on the tailnet for operator access only,
  # so no peer dials it there and it dials no peer there. Its anti-spoof drops
  # and the WireGuard port still follow plain membership.
