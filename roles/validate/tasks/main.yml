---
# Post-install assertions for a finished converge. Nothing here changes a
# host; every task is read-only and `changed_when: false`.
#
# Each check is a separate task file, included under its own tag and skipped
# when its name appears in `validate_skip`. The tags mean a single check can
# be re-run on its own without re-running the converge:
#
#   ansible-playbook -i inventories/<env> playbooks/site.yml \
#     --tags validate --skip-tags borg

- name: Assert every expected service is running
  ansible.builtin.include_tasks:
    file: services.yml
    apply:
      tags: [validate, services]
  when: "'services' not in validate_skip"
  tags: [validate, services]

# roles/node_storage's own probe and classifier, so validate and the converge
# cannot disagree about what a finished node looks like: `ready` is the data
# disk mounted with prjquota and both bind mounts sourced from it.
- name: Assert this node's docker and containerd state lives on its data disk
  ansible.builtin.include_tasks:
    file: storage.yml
    apply:
      tags: [validate, storage]
  when:
    - "'storage' not in validate_skip"
    - "'nodes' in group_names"
    - not (existing_env | default(false) | bool)
  tags: [validate, storage]

- name: Assert the control-plane containers are running
  ansible.builtin.include_tasks:
    file: containers.yml
    apply:
      tags: [validate, containers]
  when:
    - "'containers' not in validate_skip"
    - validate_expected_containers | length > 0
  tags: [validate, containers]

- name: Assert the controller can reach this node's agent
  ansible.builtin.include_tasks:
    file: agent.yml
    apply:
      tags: [validate, agent]
  when:
    - "'agent' not in validate_skip"
    - "'nodes' in group_names"
  tags: [validate, agent]

- name: Assert this node has latched its datachannel backfill
  ansible.builtin.include_tasks:
    file: backfill.yml
    apply:
      tags: [validate, backfill]
  when:
    - "'backfill' not in validate_skip"
    - "'nodes' in group_names"
  tags: [validate, backfill]

- name: Assert prometheus answers the controller's placement query for this node
  ansible.builtin.include_tasks:
    file: prometheus.yml
    apply:
      tags: [validate, prometheus]
  when:
    - "'prometheus' not in validate_skip"
    - "'nodes' in group_names"
  tags: [validate, prometheus]

# The empty-string case is a site with no backup server in it, which is legal
# and means that site's nodes run without backups — cs_agent renders
# `backups.enabled: false` for the same node. It is NOT the silent hole it
# looks like: a node whose `site` is a typo has no metrics host in that site
# either, and roles/preflight fails the run on that long before validate.
- name: Assert this node can reach its site's backup server as the borg user
  ansible.builtin.include_tasks:
    file: borg.yml
    apply:
      tags: [validate, borg]
  when:
    - "'borg' not in validate_skip"
    - "'nodes' in group_names"
    - validate_backup_host | length > 0
  tags: [validate, borg]

- name: Assert the controller can reach this host over root ssh
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: [validate, ssh]
  when:
    - "'ssh' not in validate_skip"
    - "'nodes' in group_names or 'registry' in group_names"
  tags: [validate, ssh]

- name: Assert this node can reach the portal
  ansible.builtin.include_tasks:
    file: portal.yml
    apply:
      tags: [validate, portal]
  when:
    - "'portal' not in validate_skip"
    - "'nodes' in group_names"
  tags: [validate, portal]

- name: Assert this node can reach the controller's ACME backend
  ansible.builtin.include_tasks:
    file: acme_backend.yml
    apply:
      tags: [validate, acme_backend]
  when:
    - "'acme_backend' not in validate_skip"
    - "'nodes' in group_names"
  tags: [validate, acme_backend]

# Per az, as the check below: does public DNS, from the control machine,
# actually hand out this az's pair? Before `lb_domain`, whose wait for the controller's verdict is pointless if
# the names do not resolve. Runs per node (not run_once) so it works on either
# playbook's validate play: site.yml's `hosts: all` and add-region.yml's
# `controller:nodes` both contain every new node.
- name: Assert this az's load balancer records resolve publicly
  ansible.builtin.include_tasks:
    file: lb_domain_public.yml
    apply:
      tags: [validate, lb_domain_public]
  when:
    - "'lb_domain_public' not in validate_skip"
    - "'nodes' in group_names"
    - inventory_hostname in (cs_new_nodes | default([]))
  tags: [validate, lb_domain_public]

# Per az, and only for an az this run actually seeded: `cs_new_nodes` is
# `groups['nodes']` minus every host flagged `existing_env`, and an existing
# region's load balancer was never in this run's manifest. It is read HERE,
# on the node currently executing, never as `hostvars[h].cs_new_nodes`
# (docs/contracts.md rule 10).
- name: Assert this az's load balancer validated its domain and matches its certificate
  ansible.builtin.include_tasks:
    file: lb_domain.yml
    apply:
      tags: [validate, lb_domain]
  when:
    - "'lb_domain' not in validate_skip"
    - "'nodes' in group_names"
    - inventory_hostname in (cs_new_nodes | default([]))
  tags: [validate, lb_domain]

- name: Report the checks that ran on this host
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} validated.
      {{ 'Skipped: ' ~ (validate_skip | join(', ')) if validate_skip | length > 0 else 'No checks skipped.' }}
  tags: [validate]

# Per az, the same scope as lb_domain. Warns, never fails: whether the
# controller can order this az's certificate is a DNS and settings question
# the operator may be fixing at the same time (controller 9.9+).
- name: Report this az's load balancer certificate status and ACME DNS records
  ansible.builtin.include_tasks:
    file: lb_acme.yml
    apply:
      tags: [validate, lb_acme]
  when:
    - "'lb_acme' not in validate_skip"
    - "'nodes' in group_names"
    - inventory_hostname in (cs_new_nodes | default([]))
  tags: [validate, lb_acme]
