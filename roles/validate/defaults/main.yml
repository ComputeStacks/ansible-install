---
# Post-install assertions. Every check is named; a name listed in
# `validate_skip` is not run, and every check also carries its name as a tag
# (plus `validate`), so `--tags prometheus` or `--skip-tags borg` work too.
#
#   validate_skip: [borg, dns]
#
# Check names: services, containers, agent, backfill, prometheus, borg, ssh,
# portal, acme_backend, lb_domain_public, lb_domain, dns, dns_replication,
# pdns_api.
validate_skip: []

# TLS verification for the two checks that dial an HTTPS endpoint by name
# (the prometheus query and the portal reachability probe). Defaults off when
# the environment's CA is an ACME staging endpoint — acme.sh names them all
# with a `test` suffix (`letsencrypt_test`, `buypass_test`, `googletest`) —
# whose chain is untrusted by design; set false yourself while the portal is
# on some other self-signed certificate.
validate_tls_verify: "{{ not (acme_ca | default('zerossl')) is match('.*test$') }}"

# --- services -------------------------------------------------------------
# `systemctl is-active` per unit rather than service_facts: a oneshot
# RemainAfterExit unit (cs-firewall) reports sub-state `exited`, which
# service_facts surfaces as a non-running state, while `is-active` correctly
# reports it active.
#
# Every list below names units these playbooks install. NONE of them is
# asserted on an `existing_env` host — see the long note above
# `validate_expected_services` in vars/main.yml for why, and for which checks
# cover the same ground functionally there.
validate_services_common:
  - prometheus-node-exporter
# Kept as its own list even though the blanket `existing_env` skip in
# vars/main.yml now subsumes it: it is the named home for "units only a
# v2-built host has", and an inventory that overrides one of these lists
# should not silently acquire the other's contents. A v1 host runs
# cs-iptables instead of cs-firewall.
validate_services_v2_only:
  - cs-firewall
validate_services_controller:
  - docker
  - nginx
  - postgresql
  - redis-server
validate_services_metrics:
  - docker
  - nginx
  - prometheus
  - alertmanager
  - loki
validate_services_registry:
  - docker
  - nginx
validate_services_nodes:
  - docker
  - cs-agent
  - cadvisor
  - fluentd
validate_services_nameservers:
  - pdns
  - postgresql
validate_services_backup: []
# haproxy is deliberately enabled-but-not-started until the controller pushes
# a real configuration (roles/haproxy), so it is checked for enablement only.
validate_services_enabled_nodes:
  - haproxy

# --- containers -----------------------------------------------------------
validate_containers_controller:
  - portal
  - vault-bootstrap

# --- backfill -------------------------------------------------------------
# Set to an absolute path if `cstacks` is not on the controller's
# non-interactive PATH (the same knob roles/cs_agent exposes for enrolment).
validate_cstacks_bin: "{{ cs_agent_enroll_command | default('cstacks') }}"

# --- agent ----------------------------------------------------------------
# cs-agent v3.3.0 has NO unauthenticated route: every handler is wrapped in
# requireCustomer/requireAdmin and a request with no Authorization header is
# answered 401 by `authenticate` (httpapi/httpapi.go). A 401 from this path is
# therefore the strongest available liveness signal — it proves the port is
# reachable from the controller AND that cs-agent, not something else, is
# serving it. Anything else (connection refused, timeout, 404 from a stray
# web server) fails the check.
validate_agent_probe_path: /v1/admin/changelog
validate_agent_expected_status: 401
validate_agent_timeout: 10

# --- prometheus -----------------------------------------------------------
# The label contract, verbatim from docs/contracts.md: the controller's
# placement queries match node="<hostname>",region="<az>",job="node-exporter".
# Wrong labels mean every node reports 0 cpu / 0 mem and ALL orders are
# rejected while prometheus itself looks perfectly healthy.
validate_prometheus_metric: node_cpu_seconds_total
validate_prometheus_job: node-exporter

# Credentials and endpoint are BOTH per site (docs/contracts.md §Site
# scoping). `validate_metrics_credentials` in vars/main.yml resolves this
# host's site once; overriding either name below still wins, so an
# environment can pin a single value without unpicking the map.
#
# The username is not decoration. It used to be `acme_web`'s v2 default on
# every host; a metrics VM built by v1 may answer to a different one, and a
# wrong username is a 401 with precisely the same symptom as a wrong password.
validate_prometheus_username: "{{ validate_metrics_credentials.prometheus_username }}"
validate_prometheus_password: "{{ validate_metrics_credentials.prometheus_password }}"

# The vhost this site's prometheus answers on: the `metrics_domain` host var
# of this site's metrics host, else the environment-wide `cs_metrics_domain`.
# The `default()` guards the SUBSCRIPT — a site with no metrics host has no
# key — and resolves to exactly today's value for a single-site inventory,
# where every host is in the site called `default` and that site's metrics
# host sets no `metrics_domain`.
validate_prometheus_endpoint: >-
  https://{{ cs_site_metrics_domains[cs_site] | default(cs_metrics_domain) }}:{{ cs_ports.metrics_prometheus }}

# --- borg -----------------------------------------------------------------
validate_borg_ssh_user: "{{ cs_agent_backup_ssh_user | default('cstacks') }}"
validate_borg_keyfile: "{{ cs_agent_backup_keyfile | default('/etc/computestacks/backup/.ssh/id_ed25519') }}"
validate_borg_remote_path: "{{ backup_borg_remote_path | default(borg_binary_path) }}"
# The client half of every backup is the cs-docker-borg image, whose borg is
# `borg_version` (versions.yml pins the two together). A server on a different
# version breaks repositories in ways that only show up at restore time, so
# the comparison is blocking. Set false to downgrade it to a warning.
validate_borg_version_compare: true

# --- ssh ------------------------------------------------------------------
validate_ssh_timeout: 10

# --- portal ---------------------------------------------------------------
validate_portal_url: "https://{{ cs_portal_domain }}/"
# The portal answers / with a redirect to the login page on a fresh install
# and 200 once a session exists; both prove reachability.
validate_portal_status_codes: [200, 301, 302, 303, 401, 403]

# --- acme_backend ---------------------------------------------------------
# Control-plane row #7, probed from the node on the address the manifest's
# `regions[].acme_server` carries. ANY HTTP response proves the leg: the
# portal answers :3000 directly, and what fails here is routing, not routing
# to a particular page. No `status_code` list is set for that reason: `uri`
# reports status -1 on a connection error, so the assertion is simply "a
# status came back".
validate_acme_timeout: 10

# --- dns_replication ------------------------------------------------------
# Retries for the WAL-receiver query: a healthy follower shows an empty
# pg_stat_wal_receiver for a few seconds while its walreceiver reconnects
# (postgres respawns it every `wal_retrieve_retry_interval`, 5s). `retries`
# counts RE-tries, so 3 x 5s is four attempts over roughly fifteen seconds.
validate_dns_replication_retries: 3
validate_dns_replication_delay: 5

# --- pdns_api -------------------------------------------------------------
# Probe timeout for the PowerDNS HTTP API reachability check.
validate_pdns_api_timeout: 10

# --- lb_domain ------------------------------------------------------------
# How long to wait for the controller to finish validating this az's load
# balancer domain before reporting the verdict as "not yet available".
#
# `LoadBalancerWorkers::ValidateDomainWorker` is enqueued from the load
# balancer's `after_save`, so on a greenfield converge the row is seconds old
# when validate reaches it and the worker's DNS queries (Dnsruby, three
# retries each) routinely outlast the plays in between. The task polls until
# `domain_valid_check` is written and stops on the first non-pending answer,
# so a healthy install pays for one query and only a genuinely pending one
# waits.
#
# Retries x delay is the ceiling: 12 x 10 = two minutes. Set
# `validate_lb_domain_retries: 0` to take whatever answer is there and move
# on -- NOT 1. Ansible's `retries` counts RE-tries, so 1 means two attempts
# with a delay between them; 0 is the value that runs the query once and
# skips the `until` loop. Waiting longer never turns a failure into a pass --
# a verdict of INVALID is final and fails immediately -- it only converts
# "not checked yet", which is reported and NOT asserted, into a real answer.
#
# When the verdict is STILL pending after the ceiling, ansible prints a
# `Task failed: Action failed.` line before the task's own "this is not a
# failure" report. That ERROR line is ansible announcing that `until` never
# came true; `failed_when: false` is what stops it failing the play, and it
# does stop it (verified on ansible-core 2.19.4 -- failed_when wins). It is
# expected on a first `add-region.yml` run, where the controller has usually
# not finished validating by the time validate reaches this task, and the
# remedy is to re-run `--tags lb_domain` rather than to treat it as broken.
validate_lb_domain_retries: 12
validate_lb_domain_delay: 10

# --- load balancer records managed by roles/powerdns ----------------------
# True when this run WROTE each new az's load balancer pair into the bundled
# tenant zone (roles/powerdns/tasks/lb_records.yml). The same expression,
# spelled the same way, gates roles/powerdns and roles/preflight — keep all
# three in step. When true:
#
#   * `dns` additionally asks every nameserver for each new az's apex A and
#     wildcard CNAME — the records this run wrote, served by every server;
#   * `lb_domain_public` resolves the same pair through public DNS from the
#     control machine — the check preflight makes for hand-made records,
#     moved here because these do not exist until the run writes them.
#
# `powerdns_manage_lb_records` is read from the LEADER's hostvars because that
# is where roles/powerdns reads it: override it on the nameservers
# (group_vars/nameservers or ns_primary's host vars). The powerdns role's own
# default (true) is not in scope in the validate play, hence `default(true)`.
# Never read a powerdns role variable here for the same reason — the node list
# is `cs_new_nodes`, which is exactly what that role writes for.
validate_lb_records_managed: >-
  {{ dns_driver | default('none') == 'powerdns'
     and groups['ns_primary'] | default([]) | length > 0
     and (hostvars[groups['ns_primary'][0]].powerdns_manage_lb_records | default(true)) | bool }}

# Label used to exercise each wildcard, by `dns` and `lb_domain_public` both.
# Any label matches a wildcard; a fixed one keeps the run reproducible. It must
# not exist as a real record. It mirrors preflight's
# `preflight_app_domain_probe_label`; the roles cannot share a default.
validate_app_domain_probe_label: cs-validate-probe

# --- lb_domain_public -----------------------------------------------------
# The shared second half of both `lb_domain_public` failure messages: why a
# public lookup can disagree with records this run wrote, and what to do —
# which is never "create them by hand". `powerdns_name` is an inventory var on
# each nameserver, so reading it through hostvars is safe from any host.
validate_lb_public_hint: >-
  These records belong to the provisioner — do not create them by hand; a
  re-run converges them. When the `dns` check passed, every bundled
  nameserver serves them, and a public lookup that disagrees means the path
  to those servers is wrong: the parent of {{ cs_app_zone }} must delegate it
  to exactly
  {% for n in groups['nameservers'] | default([]) | map('extract', hostvars, 'powerdns_name')
     | select('defined') | map('regex_replace', '[.]$', '') %}`{{ cs_app_zone }}. IN NS {{ n }}.` {% endfor %}
  and nothing else (roles/preflight checks this before a greenfield run, but
  not in attach mode). A resolver that looked the name up before the records
  existed serves its cached negative answer until the zone's SOA negative TTL
  runs out; wait, then re-run `--tags lb_domain_public`. If this control
  machine cannot see public DNS by design (split horizon), add
  `lb_domain_public` to `validate_skip`.

# --- dns (load balancer records) ------------------------------------------
# Where to look when a nameserver does not serve a load balancer record this
# run wrote, split by role: the leader holds the only writable copy, a
# follower serves a streaming replica of it. `__RECORD__` is replaced with
# the record in question.
validate_dns_lb_where_leader: >-
  This is the LEADER, where roles/powerdns writes `__RECORD__` into
  {{ cs_app_zone }} — check `pdnsutil list-zone {{ cs_app_zone }}` there and
  re-run; the write converges. If the domain is a zone of its own on these
  servers, roles/powerdns skipped it (it says so in its output) and the
  record is yours to create in that zone. Something else editing the zone
  (the controller writing a stale in-memory copy back) can also remove it; a
  re-run restores it.
validate_dns_lb_where_follower: >-
  This is a FOLLOWER: it serves a streaming postgres replica of the leader and
  nothing writes to it directly, so a record the leader has and this server
  lacks is REPLICATION — check `pg_stat_wal_receiver` here (the
  `dns_replication` check) and compare against
  `pdnsutil list-zone {{ cs_app_zone }}` on the leader. If the leader lacks
  `__RECORD__` too, fix it there first.
