---
# The `converged` phase of tasks/maintain_cycle.yml, inside the hold: the
# converge with the tenant containers running, every handler it notified,
# the wait for cs-agent, the pending OS updates applied LIVE (R3), and the
# decision -- written into state.json with the phase (R2), so a resumed run
# acts on this record and never re-decides from what a later converge
# reports as changed.
#
# The decision is read AFTER the OS updates on purpose: an update that asks
# for a reboot (a kernel, libc) leaves /var/run/reboot-required, and the
# same run then stops the containers and reboots. Anything else they change
# needs no stop.
#
# A run interrupted during the live OS upgrade re-runs this whole phase: the
# docker packages are re-held and apt runs again (apt waits for the dpkg
# lock an orphaned job still holds). If dpkg itself was left half-way, apt
# refuses and the failure (templates/maintain_failed.j2) says to run
# `dpkg --configure -a`; the node stays held, its containers running.
#
# A RESUMED converge (state.json has `converge_started` but not `converged`:
# the previous run died part-way through it) re-applies every handler effect
# the dead run may have lost -- see "Re-apply what an interrupted converge
# may have left pending" below.

# Read BEFORE the next task sets it: this phase only runs while `converged`
# is not done (tasks/maintain_cycle.yml), so a `converge_started` already in
# state.json means an earlier run started this converge and never finished.
- name: Note whether this converge resumes an interrupted one
  ansible.builtin.set_fact:
    node_upgrade_maintain_converge_resumed: "{{ node_upgrade_state.converge_started | default(false) | bool }}"

# From here on the node may change, so a failure no longer releases
# the hold by itself.
- name: Note that the converge has started
  ansible.builtin.set_fact:
    node_upgrade_state: "{{ node_upgrade_state | combine({'converge_started': true}) }}"

- name: Write the maintenance state
  ansible.builtin.include_tasks: state_save.yml

- name: Converge the node-side roles, containers running
  ansible.builtin.include_tasks: maintain_converge.yml

# A run that died after a role changed a file but before the flush below
# lost that role's pending handlers, and on resume the same task reports ok,
# so nothing would notify them again: the node would be released with a
# stale firewall, agent.yml, unit, sysctl or networkd drop-in live. On a
# resumed converge, notify every handler of the converged roles -- by
# `role : name`, so it is the role's own handler, with its own `when` (the
# networkd reload still honors node_kernel_uplink_ra_reload) -- and let the
# flush below run them inside the hold. The roles were included just above,
# so their handlers are in the play. docker_tls is left out on purpose: its
# "Restart docker" must never run here, and a docker_tls file newer than the
# running dockerd is detected by maintain_decide.yml anyway (the deferred
# restart path). The firewall's apply handler is left out too: a plain
# restart would load the table outside roles/firewall's safe apply, and that
# role already re-applies, with its rollback, whenever the table on disk is
# not the one it last verified -- so a lost apply is caught on the resumed
# converge itself. docker_config's handler is a SIGHUP reload, which stops
# nothing. tests/maintain_nodes.yml keeps this list equal to the handlers
# of the converged roles minus docker_tls' and the firewall apply.
- name: Re-apply what an interrupted converge may have left pending
  ansible.builtin.debug:
    msg: >-
      Resumed converge on {{ inventory_hostname }}: re-running the converged
      roles' handlers inside the hold, in case the interrupted run lost them.
  changed_when: true
  notify:
    - "common : Restart ssh"
    - "docker_config : Reload docker"
    - "node_kernel : Load node kernel modules"
    - "node_kernel : Reload sysctl"
    - "node_kernel : Reload systemd-networkd"
    - "node_observability : Restart cadvisor"
    - "node_observability : Restart fluentd"
    - "firewall : Reload systemd for the ComputeStacks firewall"
    - "cs_agent : Restart cs-agent"
  when: node_upgrade_maintain_converge_resumed | bool

# Every handler the converge (or, on a resumed converge, the task above)
# notified runs NOW, inside the hold: the cs-agent restart, the firewall
# re-apply, cadvisor/fluentd, sysctl, networkd. docker_tls' restart only
# records its reason (docker_tls_restart_deferred). The agent wait below
# follows the cs-agent restart either way.
- name: Run the converge handlers inside the hold
  ansible.builtin.meta: flush_handlers

- name: Wait for cs-agent
  ansible.builtin.include_tasks: agent_wait.yml

# Listed BEFORE they are applied, for the report: once applied they no
# longer show as pending. Written into state.json with the phase.
- name: List the pending OS updates, before applying them live
  ansible.builtin.include_tasks: maintain_os_updates.yml

- name: Note the OS updates this run applies live
  ansible.builtin.set_fact:
    node_upgrade_maintain_os_live: >-
      {{ node_upgrade_os_updates | combine({'applied': node_upgrade_apply_os_updates | bool}) }}

# R3: OS updates are never a reason to stop, so they are applied here, with
# the tenant containers running and docker's packages held -- in the same
# file as the stopped window's OS upgrade (tasks/packages.yml).
- name: Apply the pending OS updates live, inside the hold
  ansible.builtin.include_tasks: os_upgrade.yml
  vars:
    node_upgrade_os_upgrade_live: true

# One poll when nothing restarted the agent; it also confirms the hold is
# still in place after the upgrade, before anything is decided.
- name: Wait for cs-agent after the OS updates
  ansible.builtin.include_tasks: agent_wait.yml

- name: Gather the decision's inputs
  ansible.builtin.include_tasks: maintain_decide.yml

- name: Record the converge and the decision
  ansible.builtin.include_tasks: state_phase.yml
  vars:
    node_upgrade_phase: converged
    node_upgrade_state_update:
      decision: "{{ node_upgrade_maintain_decision }}"
      os_live: "{{ node_upgrade_maintain_os_live }}"
