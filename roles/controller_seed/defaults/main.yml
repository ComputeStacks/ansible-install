---
# controller_seed renders the bootstrap manifest and applies it with
# `cstacks seed` (rake bootstrap:apply). The schema is the controller repo's
# doc/bootstrap_manifest.md, schema_version 1 -- FROZEN. An unknown key is a
# hard error there, so every key this role renders must appear in that
# document.

controller_seed_manifest_path: /var/lib/computestacks/manifest.yml
controller_seed_cstacks_bin: /usr/local/bin/cstacks

# Delete the manifest after a SUCCESSFUL apply: it carries the admin password,
# the DNS API keys, the metric/log client credentials, the haproxy stats
# password and the load balancer's private key. A FAILED apply deliberately
# keeps it (root 0600) so the rendered document can be inspected.
controller_seed_remove_manifest: true

# --- attach mode ----------------------------------------------------------
# On an existing controller (existing_env: true) the manifest carries the
# topology only -- locations/regions/nodes/networks/load_balancers, plus the
# user_group region link so the new region is orderable. Set this true to
# also render settings, the DNS driver and the metric/log clients sections
# against a live controller -- none of it is an overwrite: the apply seeds a
# setting only while it is still unconfigured, never reconfigures an existing
# DNS driver or client, and reports any difference from the manifest as
# drift instead of applying it. Do it deliberately anyway, since it is how a
# still-unconfigured setting gets seeded and how the fuller drift report gets
# printed.
controller_seed_full_manifest: false

# Deliberate topology changes ONLY (e.g. rolling tailscale onto an existing
# region, re-homing the pdns host). When true, the apply runs with
# UPDATE_ADDRESSES=1: region.acme_server, node.agent_host (including CLEARING
# it when the pairwise derivation omits it) and the DNS driver endpoint are
# UPDATED on existing rows to the manifest's derived values, reported as
# [readdress] lines. Address derivation depends on complete inventory + fact
# data -- pass this flag only on a FULL run (no --limit) or with a warm fact
# cache, and only when the new path (tailnet etc.) is already up: the
# controller starts dialing the new address on its next agent call. A run
# with this flag always DRY_RUN-previews and pauses first, greenfield or not.
controller_seed_update_addresses: false

# Attach mode always previews with DRY_RUN=1 first and then waits for the
# operator to confirm. Set controller_seed_confirm: false for CI (the pause
# module needs a tty).
controller_seed_dry_run_first: true
controller_seed_confirm: true

# --- settings -------------------------------------------------------------
controller_seed_registry_hosts: "{{ groups['registry'] | default([]) }}"
# Setting.registry_node: the registry server's IP, which the controller SSHes
# to for tenant container registries (schema doc). Built by appending '' to
# the extracted list and taking `first`, so an empty registry group yields ''
# and the four registry settings are omitted -- no [0] indexing anywhere
# (docs/contracts.md rule 2).
controller_seed_registry_node: >-
  {{ ((controller_seed_registry_hosts | map('extract', hostvars, 'primary_ip') | list) + ['']) | first }}
controller_seed_registry_ssh_port: "{{ cs_ports.ssh }}"
# Setting.cr_le: the domain the controller orders the container registry's
# ACME certificate for. v1's bootstrap.rake wrote cs_portal_domain here, which
# is a copy/paste bug -- see README.md.
controller_seed_cr_le: "{{ cs_registry_domain }}"
# Additional Setting rows, name -> value (e.g. company_name, app_name,
# general_support, acme_email). SEED-ONLY: written only while nobody has
# configured that setting, and the apply aborts on a name Setting.setup!
# does not know, so do not invent names here.
controller_seed_settings_extra: {}

# --- metric_clients / log_clients -----------------------------------------
# The endpoints the CONTROLLER reads metrics and logs back from: the nginx TLS
# vhosts roles/acme_web publishes on the metrics host. Matched EXACTLY by the
# apply -- a changed port or scheme is a different client, not a rename.
#
# Both lists carry ONE ENTRY PER SITE this run seeds nodes into, deduped by
# endpoint string, and each az names its own site's endpoint. The two
# variables below are the SINGLE-SITE fallback and are unchanged: a site
# whose metrics host is in the inventory uses that host's own
# `metrics_domain` instead (vars/main.yml, `controller_seed_site_endpoints`),
# and an inventory that never mentions `site` has exactly one site with no
# metrics-host domain of its own, so it renders these strings and nothing
# else -- byte for byte what it rendered before sites existed.
controller_seed_metric_endpoint: "https://{{ cs_metrics_domain }}:{{ cs_ports.metrics_prometheus }}"
controller_seed_log_endpoint: "https://{{ cs_metrics_domain }}:{{ cs_ports.metrics_loki }}"
# The basic-auth credentials are deliberately NOT role knobs. They are per
# site, and there is exactly one spelling for them (docs/contracts.md
# §Site scoping):
#
#   (cs_site_metrics_credentials[<site>] | default(cs_metrics_credentials_default))
#
# Environment-wide values still come from `prometheus_basic_auth_password` /
# `loki_basic_auth_password` and `acme_web_{prometheus,loki}_username`;
# per-site overrides come from the vaulted `metrics_site_credentials`. The
# four `controller_seed_{prometheus,loki}_{username,password}` variables this
# role used to own were single-site by construction and are RETIRED --
# tasks/main.yml fails loudly if an inventory still sets one, rather than
# ignoring it silently and writing the wrong password to a live client (the
# apply rotates a client's username/password unconditionally on an existing
# row -- controller repo doc/bootstrap_manifest.md §Credential rotation).
controller_seed_create_clients: true

# --- dns ------------------------------------------------------------------
controller_seed_dns_username: admin
controller_seed_pdns_zone_type: master
controller_seed_pdns_server: localhost
# The controller must reach the leader on an address that pdns.conf's
# `webserver-allow-from` lists -- roles/powerdns puts the controller's
# primary_ip and public_ip there, NOT its tailnet address, so this is
# deliberately not a tailscale derivation.
controller_seed_dns_primary_ip: >-
  {{ ((groups['ns_primary'] | default([]) | map('extract', hostvars, 'primary_ip') | list) + ['']) | first }}
# Ends at `/servers`, NOT `/servers/localhost`, even though the latter is what
# the PowerDNS API docs call the server path. powerdns-ruby appends the server
# id itself -- Pdns::Client#exec! builds
#
#   path      = "#{Pdns.config[:server]}/#{path}" unless path.include?(server)
#   url_base  = "#{endpoint}/#{path}"
#
# so an endpoint that already ends in `localhost` produces
# `/api/v1/servers/localhost/localhost`, which is a 404, which the gem raises
# as Pdns::UnknownObject. That is what `rake test_connection:all` hit: it calls
# Client#version, whose only job is to GET the server object. Confirmed against
# the live API -- the doubled path returns 404 and this one returns 200.
controller_seed_dns_endpoint: "http://{{ controller_seed_dns_primary_ip }}:{{ cs_ports.pdns_api }}/api/v1/servers"
controller_seed_dns_zone: "{{ cs_app_zone }}"

# --- locations / regions --------------------------------------------------
controller_seed_fill_strategy: least
controller_seed_network_driver: bridge
controller_seed_p_net_size: 27
controller_seed_volume_backend: local
controller_seed_pid_limit: 300
controller_seed_ulimit_nofile_soft: 2500
controller_seed_ulimit_nofile_hard: 3000

# --- nodes ----------------------------------------------------------------
controller_seed_node_ssh_port: "{{ cs_ports.ssh }}"
# Must match the published-port range the node firewall opens.
controller_seed_node_port_begin: "{{ cs_ports.tenant_port_begin }}"
controller_seed_node_port_end: "{{ cs_ports.tenant_port_end }}"

# --- load balancer --------------------------------------------------------
# The shared wildcard domain tenant containers are published under
# (<container>.<domain>). It MUST equal the CN/SAN of the wildcard
# certificate below or every tenant TLS handshake mismatches; both come from
# cs_app_zone through roles/controller's controller_wildcard_domain.
controller_seed_lb_domain: "{{ controller_wildcard_domain | default(cs_app_zone) }}"
controller_seed_lb_stats_bind: "*:{{ cs_ports.haproxy_stats }}"
# The column ships a hard-coded default, so leaving this unset would publish
# the same stats password on every install. Derived deterministically from
# secret_key_base (one-way) unless the operator sets `haproxy_stats_password`
# in the vaulted secrets.
controller_seed_lb_stats_password: >-
  {{ haproxy_stats_password
     | default((secret_key_base ~ '|haproxy-stats') | hash('sha256') | truncate(32, true, '')) }}
controller_seed_lb_direct_connect: false
controller_seed_lb_le: false
# The self-signed tenant wildcard roles/controller generates once (cert AND
# key in one pem). v1 kept it at the same path, so attach mode reads the
# existing environment's certificate here too.
controller_seed_shared_cert_path: >-
  {{ controller_wildcard_cert | default('/var/lib/computestacks/.ssl_wildcard/sharedcert.pem') }}

# --- products / catalog / user group / features / admin --------------------
controller_seed_products_seed: true
controller_seed_catalog_system_content: true
# Slow (seeds the whole container image catalog). Greenfield wants it.
controller_seed_catalog_container_images: true
controller_seed_user_group_name: default
controller_seed_link_regions: all
controller_seed_features_defaults: true
controller_seed_admin_email: "{{ cs_admin_email | default('') }}"
controller_seed_admin_password: "{{ cs_admin_password | default('') }}"
controller_seed_admin_fname: Admin
controller_seed_admin_lname: Admin
controller_seed_admin_currency: "{{ currency | default('USD') }}"
controller_seed_admin_bypass_billing: true

# Node vars the manifest cannot be rendered without.
controller_seed_required_node_vars:
  - hostname
  - primary_ip
  - public_ip
  - region
  - az
  - container_network
  - container_network_name
