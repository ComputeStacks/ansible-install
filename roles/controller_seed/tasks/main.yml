---
# Render the bootstrap manifest from INVENTORY VARS and apply it with
# `cstacks seed` (rake bootstrap:apply). Runs on the controller, after every
# host is built and BEFORE the nodes enrol -- the apply is what creates the
# Node rows whose agent tokens cs_agent reads back. See README.md.

- name: Assert the environment inputs the manifest needs are present
  ansible.builtin.assert:
    that:
      - (cs_portal_domain | default('')) | length > 0
      - (cs_metrics_domain | default('')) | length > 0
      - (cs_app_zone | default('')) | length > 0
      - (cs_new_nodes | default([])) | length > 0
    fail_msg: >-
      cs_portal_domain, cs_metrics_domain and cs_app_zone must be set in the
      inventory, and at least one node must be one this run is BUILDING -- the
      manifest's locations/regions are derived entirely from `cs_new_nodes`
      (groups['nodes'] minus every host flagged `existing_env`), because an
      already-provisioned az must never be re-rendered into the apply. If
      every node in the inventory is an existing one there is nothing to seed.
    quiet: true

- name: Assert the admin account inputs are present
  # Greenfield only: the attach manifest carries no admin_user section.
  ansible.builtin.assert:
    that:
      - (controller_seed_admin_email | default('')) | length > 0
      - (controller_seed_admin_password | default('')) | length > 0
      - "'CHANGEME' not in (controller_seed_admin_password | default(''))"
    fail_msg: >-
      cs_admin_email and cs_admin_password must be set (and cs_admin_password
      must not still be the CHANGEME sample) -- the manifest's admin_user
      section creates the first administrator, and it is create-if-absent
      only, so a bad value here cannot be fixed by re-running the seed.
    quiet: true
  when: not (existing_env | default(false) | bool) or (controller_seed_full_manifest | bool)

- name: Assert no inventory still sets the retired single-site client credentials
  # They were single-site by construction. Ignoring them silently would let an
  # operator believe they had set a password that the manifest never carried --
  # and the apply ROTATES a client's username/password on a row that already
  # exists, so the wrong value lands on a live controller. Not
  # "unconditionally": Bootstrap::Writer#rotate! assigns only the fields it is
  # given and only those that differ. That is no comfort here -- a dropped
  # override is by definition a value that differs from what the row holds,
  # which is exactly when rotate! writes.
  ansible.builtin.assert:
    that:
      - controller_seed_prometheus_username is not defined
      - controller_seed_prometheus_password is not defined
      - controller_seed_loki_username is not defined
      - controller_seed_loki_password is not defined
    fail_msg: >-
      controller_seed_{prometheus,loki}_{username,password} are retired: the
      metric/log client basic-auth is per SITE now. Set the environment-wide
      values as `prometheus_basic_auth_password` / `loki_basic_auth_password`
      (and `acme_web_prometheus_username` / `acme_web_loki_username`), and any
      per-site override in the vaulted `metrics_site_credentials`
      (docs/contracts.md §Site scoping).
    quiet: true

- name: Assert no inventory still sets the retired fleet-wide load balancer domain
  # `controller_seed_lb_domain` was ONE scalar rendered into EVERY az's load
  # balancer. Every az has its own load balancer and in a real estate every
  # one of them answers on a different domain, so the scalar could only ever
  # be right for one of them -- it is the bug this feature exists to fix, and
  # the domain now comes from `cs_app_domain` per node.
  #
  # Fail rather than ignore, for the same reason as the retired client
  # credentials above. An operator who set this meant to CHOOSE the load
  # balancer domain. Silently rendering `cs_app_domain` instead would seed a
  # domain they did not ask for while `roles/controller` generated a wildcard
  # certificate for that same `cs_app_domain` -- so the CN would match the
  # seeded domain, both would be wrong, and the only symptom would be tenant
  # containers published under a name their DNS does not answer for. Nothing
  # in the run, the drift report or `validate` would mention this variable.
  ansible.builtin.assert:
    that:
      - controller_seed_lb_domain is not defined
    fail_msg: >-
      controller_seed_lb_domain is retired: the load balancer domain is PER AZ
      now. Set `app_domain` as a host var on each node
      (playbooks/group_vars/all/app_domains.yml); a node that sets none takes
      `cs_app_zone`, which is what this variable defaulted to. roles/preflight
      validates the shape and the zone relationship, and roles/controller
      generates one wildcard certificate per distinct domain.
    quiet: true

- name: Assert every site this run seeds has metric and log client credentials
  # One entry per site in the manifest's client lists, so the check is per
  # site too: an inventory that sets `metrics_site_credentials` for its
  # second site is entitled to leave the environment-wide password blank, and
  # one that sets neither must still fail here rather than write a blank
  # password the controller then authenticates with. The guard is on the
  # SUBSCRIPT, never the field (docs/contracts.md §Site scoping). Only the
  # expression text is ever printed on failure, never the value.
  ansible.builtin.assert:
    that:
      - ((cs_site_metrics_credentials[item] | default(cs_metrics_credentials_default))['prometheus_password'] | default('')) | length > 0
      - ((cs_site_metrics_credentials[item] | default(cs_metrics_credentials_default))['loki_password'] | default('')) | length > 0
    fail_msg: >-
      Site '{{ item }}' has no prometheus/loki basic-auth password. Set
      prometheus_basic_auth_password and loki_basic_auth_password in the
      vaulted secrets, or give this site an entry in
      `metrics_site_credentials`. They are the credentials the controller uses
      against the acme_web nginx vhosts on that site's metrics host; blank
      ones make every placement query return no data and every order fail with
      "no capacity".
    quiet: true
  loop: "{{ controller_seed_manifest_sites }}"
  when: not (existing_env | default(false) | bool) or (controller_seed_full_manifest | bool)

- name: Assert the region tunables are inside the ranges the models validate
  ansible.builtin.assert:
    that:
      - controller_seed_p_net_size | int > 23
      - controller_seed_p_net_size | int < 30
      - controller_seed_pid_limit | int >= 0
      - controller_seed_ulimit_nofile_soft | int >= 0
      - controller_seed_ulimit_nofile_hard | int >= controller_seed_ulimit_nofile_soft | int
      - controller_seed_volume_backend in ['local', 'nfs']
      - controller_seed_network_driver in ['bridge', 'calico_docker']
      - controller_seed_fill_strategy in ['least', 'full']
    fail_msg: >-
      A region tunable is out of range: p_net_size must be 24-29,
      ulimit_nofile_hard must be >= ulimit_nofile_soft (docker rejects every
      container start otherwise and the model does NOT check it),
      volume_backend must be local|nfs, network_driver bridge|calico_docker
      (bridge for all new installs), fill_strategy least|full (anything else
      silently disables placement).
    quiet: true

- name: Assert every node carries the vars the manifest is rendered from
  ansible.builtin.assert:
    that:
      - hostvars[item.0][item.1] is defined
      - (hostvars[item.0][item.1] | string) | length > 0
    fail_msg: >-
      Node '{{ item.0 }}' is missing required host var '{{ item.1 }}'. The
      manifest maps region -> Location, az -> Region, and cannot be rendered
      without it (see inventories/example/hosts.yml).
    quiet: true
  # cs_new_nodes, not groups['nodes']: an existing host is not rendered into
  # the document, so demanding the manifest's node vars on it would fail a run
  # over something the manifest never reads.
  loop: "{{ cs_new_nodes | sort | product(controller_seed_required_node_vars) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"

- name: Assert Setting.registry_node resolves to exactly one address
  ansible.builtin.assert:
    that:
      - (controller_seed_registry_hosts | length) <= 1
    fail_msg: >-
      groups['registry'] has {{ controller_seed_registry_hosts | length }}
      hosts, but Setting.registry_node is a single address the controller
      SSHes to. Set controller_seed_registry_node explicitly (and
      controller_seed_registry_hosts to that one host) to say which registry
      host the controller should use.
    quiet: true

- name: Assert the dns driver is one this role can seed
  ansible.builtin.assert:
    that:
      - (dns_driver | default('none')) in ['powerdns', 'none']
    fail_msg: >-
      dns_driver is '{{ dns_driver | default('none') }}'. controller_seed
      renders the manifest's dns section for 'powerdns' only, and omits the
      section entirely for 'none'. AutoDNS seeding is not implemented in v2 --
      configure the driver in the admin UI and set dns_driver: none, or raise
      it with the engineering manager.
    quiet: true

- name: Assert the powerdns inputs the dns section needs are present
  ansible.builtin.assert:
    that:
      - (pdns_api_key | default('')) | length > 0
      - (pdns_web_key | default('')) | length > 0
      - (controller_seed_dns_primary_ip | default('')) | length > 0
      - (groups['nameservers'] | default([])) | length > 0
    fail_msg: >-
      dns_driver is 'powerdns' but pdns_api_key / pdns_web_key are unset, or
      the inventory has no nameservers group with a primary_ip on the
      ns_primary host. The manifest's DNS driver cannot be rendered without
      them.
    quiet: true
  when:
    - dns_driver | default('none') == 'powerdns'
    - not (existing_env | default(false) | bool) or (controller_seed_full_manifest | bool)

- name: Assert every nameserver defines a unique powerdns_name
  # These become the zone's NS records. Role defaults are not in scope in this
  # play, so the value has to come from the inventory -- and two nameservers
  # sharing the sample default would publish a broken NS set.
  ansible.builtin.assert:
    that:
      - (groups['nameservers'] | map('extract', hostvars, 'powerdns_name') | select('defined') | list | length)
        == (groups['nameservers'] | length)
      - (groups['nameservers'] | map('extract', hostvars, 'powerdns_name') | list | unique | length)
        == (groups['nameservers'] | length)
    fail_msg: >-
      Every host in groups['nameservers'] must set a unique 'powerdns_name'
      (its FQDN, e.g. ns1.example.com) in the inventory -- these are written
      into the DNS driver's nameservers list and become the NS records of
      every tenant zone. roles/powerdns's default is a placeholder and is not
      visible from this play.
    quiet: true
  when:
    - dns_driver | default('none') == 'powerdns'
    - not (existing_env | default(false) | bool) or (controller_seed_full_manifest | bool)

# `regions[].acme_server` falls back to the controller's primary_ip for every
# node that is not tailnet-paired with the controller. On a node in the same
# datacentre that is correct; on a REMOTE region it is an address that routes
# nowhere, and nothing notices until a tenant certificate fails to issue. This
# only actually lands on a region seeded for the FIRST time by this apply --
# an az that already exists on the controller keeps its own acme_server
# regardless, and the rendered value is only compared against it and reported
# as drift.
# Warn, don't fail: whether primary_ip is routable from a given region is an
# environment fact this role cannot see. `validate`'s `acme_backend` check
# probes the address for real and DOES fail.
- name: Reset the derived acme_server warning list
  ansible.builtin.set_fact:
    controller_seed_acme_primary_ip_nodes: []

- name: Determine which nodes fall back to the controller's primary_ip for acme_server
  ansible.builtin.set_fact:
    controller_seed_acme_primary_ip_nodes: >-
      {{ controller_seed_acme_primary_ip_nodes
         + ([item] if (hostvars[item].controller_acme_address is not defined
                       and not ((controller_seed_controller_tailnet | bool) and (controller_seed_node_tailnet | bool)))
            else []) }}
  loop: "{{ cs_new_nodes | sort }}"
  vars:
    controller_seed_node_ts: >-
      {{ hostvars[item].tailscale_ip
         | default(hostvars[item].ansible_local.computestacks.tailscale_ip | default('')) }}
    controller_seed_node_tailnet: >-
      {{ ((tailscale_authkey | default('')) | length > 0)
         and (hostvars[item].tailscale_enabled | default(true) | bool)
         and ((controller_seed_node_ts | trim) | length > 0) }}

- name: Warn when a node's acme_server is the controller's primary_ip
  ansible.builtin.debug:
    msg: >-
      These nodes are not tailnet-paired with the controller, so their az's
      `acme_server` is rendered as
      {{ hostvars[controller_seed_controller_host].primary_ip | default('the controller primary_ip') }}:{{ cs_ports.controller_acme_backend }}
      — {{ controller_seed_acme_primary_ip_nodes | join(', ') }}.
      That is the address each node's haproxy proxies tenant ACME challenges
      to, for an az seeded for the first time by this apply — an az that
      already exists keeps its own acme_server regardless, and this rendered
      value is only reported as drift if it disagrees. It is correct for a
      node that shares a network with the controller and UNROUTABLE from a
      remote region — where the symptom is not an install failure but tenant
      certificates that never issue. Set `controller_acme_address` as a host
      var on any node that cannot reach it, to an address that is routable
      from there.
  when: (controller_seed_acme_primary_ip_nodes | length) > 0

# ONE CERTIFICATE PER LOAD BALANCER DOMAIN, not one for the fleet. Each az's
# load balancer serves the wildcard whose CN is that az's own `cs_app_domain`,
# so the four tasks below are per domain: stat, assert, slurp, map. Only
# domains of `cs_new_nodes` are looked at (`cs_app_domains`) -- an
# already-provisioned az is not in the document, and on an attach run against
# a v1 controller its pem is not on this host at all.
- name: Check that every load balancer domain's tenant wildcard certificate exists
  ansible.builtin.stat:
    path: "{{ cs_app_domain_cert_paths[item] }}"
  register: controller_seed_cert_stats
  loop: "{{ cs_app_domains }}"

- name: Assert every load balancer domain's tenant wildcard certificate is present
  # Deliberately NOT no_log, unlike the slurp below: nothing here has read the
  # file, the only values in play are a domain and a path, and hiding them
  # would leave an operator with "a certificate is missing" and no way to know
  # which one. The path is named because that is the actionable half.
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      No tenant wildcard certificate for load balancer domain
      '{{ item.item }}' at {{ cs_app_domain_cert_paths[item.item] }}.
      Greenfield: roles/controller generates one pem per distinct
      `app_domain` (run the controller role first, and note that it generates
      ONCE per domain -- a domain added to the inventory after the controller
      was built needs that role re-run). Attach mode: `tasks_from:
      attach_prep` generates the NEW az's domain only, which is why a new az
      must set an `app_domain` of its own; for the existing environment's
      default domain, point controller_seed_shared_cert_path at that
      environment's shared certificate pem. Never let this render empty --
      the load balancer would be created with no certificate at all.
    quiet: true
  loop: "{{ controller_seed_cert_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read every load balancer domain's tenant wildcard certificate
  # Carries the private keys: never logged, never diffed. `no_log` suppresses
  # the CALLBACK output, not the registered value, so the map below still gets
  # real content. This being a loop rather than a single slurp is exactly the
  # shape where a key leaks -- a looped task prints one result per item, and
  # `-v` on an un-no_log'd slurp puts the base64 of a private key on the
  # terminal and in the ansible log. Every task from here to the manifest
  # write carries it.
  ansible.builtin.slurp:
    src: "{{ cs_app_domain_cert_paths[item] }}"
  register: controller_seed_cert_raw
  loop: "{{ cs_app_domains }}"
  no_log: true

- name: Keep every domain's certificate for the manifest render
  # domain -> pem text. Built in ONE task from the registered results rather
  # than by accumulating with `combine` over a second loop: one task is one
  # place for `no_log` to be missing from, and an accumulator prints the whole
  # growing map on every iteration if it ever is.
  ansible.builtin.set_fact:
    controller_seed_shared_certificates: >-
      {{ dict(controller_seed_cert_raw.results | map(attribute='item') | list
              | zip(controller_seed_cert_raw.results | map(attribute='content')
                    | map('b64decode') | list)) }}
  no_log: true

- name: Render the manifest in memory
  # Rendered first, written second, so the YAML can be validated before a
  # secrets-bearing file lands on disk.
  ansible.builtin.set_fact:
    controller_seed_manifest_content: "{{ lookup('ansible.builtin.template', 'manifest.yml.j2') }}"
  no_log: true

- name: Assert the rendered manifest parses and carries only schema-1 sections
  ansible.builtin.assert:
    that:
      - (controller_seed_manifest_content | from_yaml) is mapping
      - (controller_seed_manifest_content | from_yaml).schema_version == 1
      - ((controller_seed_manifest_content | from_yaml).keys() | list | difference(controller_seed_schema_sections)) | length == 0
      - ((controller_seed_manifest_content | from_yaml).locations | default([])) | length > 0
    fail_msg: >-
      The rendered manifest is not a schema_version 1 document: it either does
      not parse as a YAML mapping, carries a top-level key the apply does not
      know (an unknown key is a hard error there, never a warning), or has no
      locations. This is a template bug -- nothing was written.
    quiet: true

- name: Seed the controller
  block:
    - name: Write the manifest
      # 0600 root: admin password, DNS API keys, client credentials, stats
      # password and the load balancer private key. diff:false as well as
      # no_log so a --diff run can never print it either.
      ansible.builtin.copy:
        content: "{{ controller_seed_manifest_content }}"
        dest: "{{ controller_seed_manifest_path }}"
        owner: root
        group: root
        mode: "0600"
      diff: false
      no_log: true

    # UNCONDITIONAL, and the `when:` this task used to carry is the reason.
    #
    # The preview began life as the operator-facing half of two deliberate
    # operations -- an apply against an existing environment, and any run with
    # the address-update flag on -- so it ran only for those, and only when
    # `controller_seed_dry_run_first` was left true. Gate G below then reads
    # its output, and a gate that reads a task which did not run does not fail:
    # it passes, silently, having checked nothing.
    #
    # Both skips cover the case the gate exists FOR. A v2 environment that has
    # already converged has nothing flagged `existing_env` -- it is a
    # greenfield inventory that happens to have been applied once -- so an
    # operator who adds `app_domain` to those nodes and re-runs would have got
    # no preview, no gate, and a certificate rotated onto every load balancer
    # whose domain the apply will not touch. `dry_run_first: false`, the flag
    # reached for to skip the prompt in CI, removed the gate the same way.
    #
    # So the PREVIEW is now a safety scan that always runs, and the PAUSE below
    # keeps the deliberate-operation gating it always had. DRY_RUN=1 writes
    # nothing (the apply is one transaction and the preview rolls it back), so
    # the cost of the split is one extra read-only `cstacks seed` on a
    # greenfield converge, which buys the only automated check that stands
    # between a stale `app_domain` and nine mismatched tenant certificates.
    - name: Preview the apply (DRY_RUN) -- always, so gate G has something to read
      ansible.builtin.command:
        argv:
          - "{{ controller_seed_cstacks_bin }}"
          - seed
          - "{{ controller_seed_manifest_path }}"
      environment:
        DRY_RUN: "1"
        UPDATE_ADDRESSES: "{{ '1' if controller_seed_update_addresses | bool else '0' }}"
      register: controller_seed_dry_run
      changed_when: false

    # The DISPLAY keeps the gating the preview used to carry, so a greenfield
    # converge does not start dumping a diff it never printed before, and
    # `controller_seed_dry_run_first: false` still means what
    # docs/automation.md says it means -- "the preview is for humans", no
    # human-facing output in CI. What it no longer does is remove gate G:
    # the gate reads the registered result, not this task, and its own
    # fail_msg carries the drifted lines an operator needs.
    - name: Show what the apply would change
      ansible.builtin.debug:
        var: controller_seed_dry_run.stdout_lines
      when:
        - (existing_env | default(false) | bool) or (controller_seed_update_addresses | bool)
        - controller_seed_dry_run_first | bool
        - (controller_seed_dry_run.stdout_lines | default([])) | length > 0

    # GATE G -- refuse to rotate a certificate onto a load balancer whose
    # domain we cannot change.
    #
    # `Bootstrap::ApplyService#apply_load_balancer` splits the row's fields two
    # ways, and the split is the whole reason this gate exists:
    #
    #   * `domain` goes in `attrs`, so on an EXISTING row
    #     `Writer#create_or_report!` calls `report_drift` and never writes it.
    #     No `addresses:` hash is passed either, so UPDATE_ADDRESSES=1 does not
    #     reach it. The domain of a live load balancer is operator-owned: it is
    #     edited by humans in the admin UI for years and a stale manifest must
    #     not roll it back.
    #   * `shared_certificate` goes in `credential_secrets`, and `rotate!` DOES
    #     write it whenever the decrypted value differs.
    #
    # Left alone, an inventory whose `app_domain` disagrees with an
    # already-seeded row therefore replaces that load balancer's CERTIFICATE
    # and leaves its DOMAIN untouched -- a production load balancer serving a
    # wildcard whose CN no longer matches the name it answers on, which fails
    # every tenant TLS handshake in that az. That is this feature's own worst
    # failure, inverted, and it would happen inside a green run.
    #
    # Changing the domain of an existing load balancer is deliberately out of
    # scope for the provisioner and stays a human action in the admin UI. So
    # the gate does not try to fix it: it stops before the real apply and says
    # what to do. It is a guard against a future mistake, not a migration tool
    # -- production's rows were created by v1 with their correct per-region
    # domains already.
    #
    # It fires on EVERY run, greenfield included, because the preview above is
    # unconditional. An earlier draft of this gate ran only where the preview
    # did -- attach mode, or a run with the address flag -- on the reasoning
    # that greenfield has no existing rows to drift from. That reasoning is
    # wrong, and the case it misses is the one the gate exists for: a v2
    # environment that has already converged has nothing flagged
    # `existing_env`, so it is still a greenfield inventory, and an operator
    # who adds `app_domain` to its nodes and re-runs would have got no preview
    # and no gate. See the preview task for the full argument.
    - name: Find any load balancer domain drift in the preview
      # `Recorder#drift` prints a subject line and then one line per changed
      # attribute (recorder.rb, `drift`):
      #
      #     [warn  ] LoadBalancer exm-005 — manifest differs from database, ...
      #              domain: database "a.example.com", manifest "b.example.com"
      #
      # (two leading spaces on the subject, thirteen on the attribute), so the
      # attribute line does NOT name its own subject and a grep for
      # `domain:` alone would also catch a drifted Region or Setting. The scan
      # tracks the last subject line -- every one starts at column 2 with a
      # bracketed action -- and only counts a `domain:` line underneath a
      # `LoadBalancer` one. Both lines are kept verbatim: the operator gets the
      # apply's own words, including which value is the database's.
      ansible.builtin.set_fact:
        controller_seed_lb_domain_drift: "{{ controller_seed_lb_domain_drift_json | from_json }}"
      vars:
        controller_seed_lb_domain_drift_json: >-
          {% set ns = namespace(subject='') %}
          {% set drifted = [] %}
          {% for line in (controller_seed_dry_run.stdout_lines | default([])) %}
          {% if line.startswith('  [') %}
          {% set ns.subject = line | trim %}
          {% elif ('] LoadBalancer ' in ns.subject)
                  and line.strip().startswith('domain: database ') %}
          {% set _ = drifted.append(ns.subject ~ '\n    ' ~ line.strip()) %}
          {% endif %}
          {% endfor %}
          {{ drifted | to_json }}

    - name: Refuse to seed a load balancer whose domain the apply cannot change
      ansible.builtin.assert:
        that:
          - (controller_seed_lb_domain_drift | default([])) | length == 0
        fail_msg: >-
          The DRY_RUN preview reports DOMAIN drift on {{ (controller_seed_lb_domain_drift | length) }}
          load balancer(s) that already exist, and nothing has been applied:


          {{ controller_seed_lb_domain_drift | join('\n\n  ') }}


          `domain` is bootstrap-only. The apply reports it and never writes it,
          not even under UPDATE_ADDRESSES=1 -- but it DOES rotate that same row's
          `shared_certificate`. Letting this run would give each load balancer
          above a wildcard certificate whose CN is the manifest's domain while
          it keeps answering on the database's, and every tenant TLS handshake
          in that az would fail. Change the domain in the controller's admin UI
          first (or correct `app_domain` in the inventory to match what the
          database already holds), then re-run. This role will not do it for
          you: a load balancer's domain is operator-owned and a stale manifest
          must never roll it back.
        quiet: true

    - name: Confirm the apply against the existing controller
      ansible.builtin.pause:
        prompt: >-
          Review the DRY_RUN diff above. Press ENTER to apply it to the live
          controller, or Ctrl-C then A to abort. (Set
          controller_seed_confirm: false to skip this prompt in CI.)
      when:
        - (existing_env | default(false) | bool) or (controller_seed_update_addresses | bool)
        - controller_seed_confirm | bool

    - name: Apply the manifest
      ansible.builtin.command:
        argv:
          - "{{ controller_seed_cstacks_bin }}"
          - seed
          - "{{ controller_seed_manifest_path }}"
      environment:
        UPDATE_ADDRESSES: "{{ '1' if controller_seed_update_addresses | bool else '0' }}"
      register: controller_seed_apply
      changed_when: "'0 created, 0 seeded, 0 rotated, 0 linked were applied' not in controller_seed_apply.stdout"

    - name: Show what the apply changed
      # Safe to print: the apply redacts every secret it touches.
      ansible.builtin.debug:
        var: controller_seed_apply.stdout_lines
      when: (controller_seed_apply.stdout_lines | default([])) | length > 0

    - name: Remove the manifest now the apply has succeeded
      ansible.builtin.file:
        path: "{{ controller_seed_manifest_path }}"
        state: absent
      when: controller_seed_remove_manifest | bool
  rescue:
    - name: Report where the failed manifest was left
      ansible.builtin.debug:
        msg: >-
          The seed FAILED and nothing was written to the controller database
          (the whole apply is one transaction, and gate G stops before the
          apply runs at all). {{ controller_seed_manifest_path }}
          has been kept for debugging -- it is root 0600 and carries secrets,
          so delete it once you are done. Re-running this role re-renders and
          re-applies it; the apply is idempotent.

    - name: Fail the play
      ansible.builtin.fail:
        msg: >-
          The seed step failed on {{ inventory_hostname }} -- see the error
          above. From `cstacks seed` it names the manifest section and key
          path; from the load balancer domain gate it names the load balancer
          and the two domains, and nothing was applied.
