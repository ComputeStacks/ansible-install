---
# The frozen top-level key set of bootstrap manifest schema_version 1
# (controller repo doc/bootstrap_manifest.md, Bootstrap::Manifest::SECTIONS).
# The apply treats an unknown top-level key as an ERROR, not a warning --
# "it is almost always a typo in the provisioner template" -- so the rendered
# document is checked against this list before it is written. Role vars, not
# defaults: this mirrors the controller's constant and is not an operator
# knob.
### Pairwise tailnet state for the acme_server derivation.
# Same expressions manifest.yml.j2 uses (membership is pure inventory; the
# ADDRESS is the blessed facts exception, docs/contracts.md). Role vars, not
# defaults: they mirror the template and are not operator knobs.
controller_seed_controller_host: "{{ groups['controller'] | first }}"
controller_seed_controller_ts: >-
  {{ hostvars[controller_seed_controller_host].tailscale_ip
     | default(hostvars[controller_seed_controller_host].ansible_local.computestacks.tailscale_ip
               | default('')) }}
controller_seed_controller_tailnet: >-
  {{ ((tailscale_authkey | default('')) | length > 0)
     and (hostvars[controller_seed_controller_host].tailscale_enabled | default(true) | bool)
     and ((controller_seed_controller_ts | trim) | length > 0) }}

### Site scoping (docs/contracts.md §Site scoping). Role vars, not defaults:
# they mirror the frozen contract and are not operator knobs. Every one of
# them reads the site maps LOCALLY (rule 10) -- this role runs on the
# controller, which is the host rendering the manifest.

# The sites this run actually seeds, sorted. Derived from `cs_new_nodes`, NOT
# from groups['nodes']: an existing host's az is not in the document (its load
# balancer would be re-rendered, and Bootstrap::Writer#create_or_report!
# ROTATES stats_password and shared_certificate on a row that already exists,
# where every other column is only reported as drift -- see the note in
# templates/manifest.yml.j2 for why "unchanged values are skipped" is not the
# same as "safe"), so a client row for a site that contributes no new node
# would be created with nothing referencing it.
controller_seed_manifest_sites: >-
  {{ cs_new_nodes | map('extract', hostvars, 'cs_site') | list | unique | sort }}

# site -> {"metric": <endpoint>, "log": <endpoint>} -- the exact strings the
# apply matches clients on. A site whose metrics host is in this inventory
# uses that host's own domain (`cs_site_metrics_domains`, which is
# `metrics_domain` on the metrics host falling back to `cs_metrics_domain`);
# a site with no metrics host in the inventory -- which is every host of an
# inventory that never mentions `site` -- falls back to the role's
# single-site `controller_seed_{metric,log}_endpoint` defaults, so a
# single-site inventory renders exactly the strings it always rendered.
#
# Built as JSON and parsed back, the same idiom and for the same reason as
# playbooks/group_vars/all/sites.yml: the per-site fallback needs a `{% for %}`,
# a template carrying one renders to a string, and the round-trip is what
# turns it back into a mapping.
controller_seed_site_endpoints_json: >-
  {
  {% for cs_seed_site in controller_seed_manifest_sites %}
  {{ cs_seed_site | to_json }}: {
  "metric":
  {{ (('https://' ~ cs_site_metrics_domains[cs_seed_site] ~ ':' ~ cs_ports.metrics_prometheus)
      if cs_seed_site in cs_site_metrics_domains
      else controller_seed_metric_endpoint) | to_json }},
  "log":
  {{ (('https://' ~ cs_site_metrics_domains[cs_seed_site] ~ ':' ~ cs_ports.metrics_loki)
      if cs_seed_site in cs_site_metrics_domains
      else controller_seed_log_endpoint) | to_json }}
  }{{ ',' if not loop.last else '' }}
  {% endfor %}
  }
controller_seed_site_endpoints: "{{ controller_seed_site_endpoints_json | from_json }}"

### Per-az application domains (playbooks/group_vars/all/app_domains.yml).
# Role vars, not defaults: the spellings are frozen cross-role contract, not
# operator knobs. The operator knobs are `app_domain` (per node),
# `app_wildcard_dir` (environment-wide) and, for the one legacy entry,
# `controller_seed_shared_cert_path`.
#
# BOTH MAPS ARE LOCAL USE ONLY -- read them HERE, on the controller, which is
# the host rendering the manifest. They are derived from `hostvars`, so
# `hostvars[h].cs_app_domains` / `hostvars[h].cs_app_domain_cert_paths` are
# silently Undefined and a hard-rule violation (docs/contracts.md §Variable
# scope, rule 10). The value that DOES survive a cross-host read is
# `cs_app_domain`, which is deliberately trivial for exactly that reason, and
# it is the one the template uses per node. Same shape as the site maps: the
# cross-host read is a plain scalar; anything needing `hostvars` is a map the
# rendering host indexes locally.
#
# These two are defined IDENTICALLY in roles/controller/vars/main.yml, which
# is the role that generates the certificates these paths point at. The one
# difference is the `cs_app_zone` entry: roles/controller has
# `controller_wildcard_cert` in scope and uses it; this role does not (it is a
# roles/controller default, and the seeding play -- and the whole of attach
# mode -- never loads that role), so it uses
# `controller_seed_shared_cert_path`, which carries the same literal as its
# fallback and doubles as the attach-mode override. See defaults/main.yml.
#
# THE `# noqa: var-naming[no-role-prefix]` MARKERS ARE DELIBERATE, and they
# are in roles/controller/vars/main.yml for the same reason. Every other
# variable this role owns is `controller_seed_`-prefixed and ansible-lint's
# production profile enforces that -- but these spellings are a cross-role
# contract, not this role's property. Prefixing them per role would give one
# frozen contract two names, in the two roles that MUST agree about which
# domain maps to which pem: one writes those files, the other reads them back.
# That disagreement is exactly what the contract exists to prevent.

# Every distinct load balancer domain this run seeds, deduplicated and sorted.
# Character-for-character what roles/controller derives -- diff the two blocks.
#
# `cs_new_nodes`, NOT `groups['nodes']`, for the same reason
# `controller_seed_manifest_sites` above uses it: an already-provisioned az is
# not in the document, so demanding its domain's certificate on disk (and
# slurping it) would fail a run over a pem the manifest never reads. On an
# attach run against a v1 controller the other regions' pems are not on this
# host at all. In a greenfield converge the two lists are identical.
#
# `| sort` is not decoration: `cs_new_nodes` is built with `difference()`,
# which does not preserve inventory order, and this list is the loop order of
# three tasks whose output a human reads.
cs_app_domains: >-  # noqa: var-naming[no-role-prefix]
  {{ (cs_new_nodes | default([])) | map('extract', hostvars, 'cs_app_domain')
     | map('string') | list | unique | sort }}

# domain -> the pem holding that domain's certificate AND key (one file,
# which is the form haproxy wants).
#
#   domain == cs_app_zone  ->  controller_seed_shared_cert_path   (LEGACY)
#   otherwise              ->  <cs_app_wildcard_dir>/<domain>/sharedcert.pem
#
# The ONLY line that differs from roles/controller's copy is the legacy
# branch, and it has to: that role names `controller_wildcard_cert` directly,
# which is a roles/controller DEFAULT and is not in scope in the seeding play
# or anywhere in attach mode. `controller_seed_shared_cert_path` carries the
# identical literal as its own fallback, so the two agree by construction --
# and it is also the operator's attach-mode override, which is the one case
# where they are MEANT to differ (defaults/main.yml says when and why).
#
# `cs_app_wildcard_dir` is the ONE spelling of the path root and it is a
# hostvars-free global (playbooks/group_vars/all/app_domains.yml), so it is in
# scope in the seeding play and in attach mode. Neither role may re-derive the
# root from `controller_wildcard_dir`: two role vars each carrying the same
# literal are two literals that drift.
#
# Built as JSON and parsed back, the same idiom and for the same reason as
# `controller_seed_site_endpoints` above and playbooks/group_vars/all/sites.yml:
# the legacy branch needs a jinja for-loop, a template carrying one renders to
# a string, and the round-trip is what turns it back into a mapping. `to_json`
# on every scalar is what makes an arbitrary domain safe to embed.
cs_app_domain_cert_paths_json: >-  # noqa: var-naming[no-role-prefix]
  {
  {% for cs_ad in cs_app_domains %}
  {{ cs_ad | to_json }}:
  {{ (controller_seed_shared_cert_path | trim
      if cs_ad == cs_app_zone
      else (cs_app_wildcard_dir ~ '/' ~ cs_ad ~ '/sharedcert.pem')) | to_json }}{{ ',' if not loop.last else '' }}
  {% endfor %}
  }
cs_app_domain_cert_paths: "{{ cs_app_domain_cert_paths_json | from_json }}"  # noqa: var-naming[no-role-prefix]

controller_seed_schema_sections:
  - schema_version
  - settings
  - metric_clients
  - log_clients
  - dns
  - locations
  - products
  - catalog
  - user_group
  - features
  - admin_user
