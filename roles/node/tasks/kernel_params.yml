---
- name: Set vm.max_map_count
  sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: yes

##
# nf_conntrack and br_netfilter have to be loaded before systemd-sysctl runs. Their
# sysctls do not exist until the module is loaded, so a boot-time write against
# /etc/sysctl.conf fails silently and the tunable is left at the kernel default --
# 262144 for nf_conntrack_max, which a node running hundreds of containers with
# --userland-proxy=false will exhaust. systemd-sysctl.service is ordered
# After=systemd-modules-load.service, so listing the modules here fixes the ordering.
- name: Load netfilter modules on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/computestacks.conf
    content: |
      nf_conntrack
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Load netfilter modules now
  ansible.builtin.command: modprobe -a nf_conntrack br_netfilter
  changed_when: false

##
# hashsize is a module parameter rather than a sysctl, so it only applies at module
# load time and needs a reboot (or module reload) to take effect. Sized to
# nf_conntrack_max / 4, which matches the kernel's own default ratio -- leaving it at
# the default 65536 buckets would hash a million entries into a table sized for a
# quarter of that.
- name: Size the conntrack hash table
  ansible.builtin.copy:
    dest: /etc/modprobe.d/nf_conntrack.conf
    content: "options nf_conntrack hashsize={{ nf_conntrack_hashsize }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Set net.netfilter.nf_conntrack_max
  ansible.builtin.sysctl:
    name: net.netfilter.nf_conntrack_max
    value: "{{ nf_conntrack_max }}"
    sysctl_file: /etc/sysctl.d/99-computestacks-conntrack.conf
    state: present
    reload: yes

- name: "Set net.core.netdev_max_backlog"
  sysctl:
    name: net.core.netdev_max_backlog
    value: "30000"
    state: present
    reload: yes

- name: "Set net.core.rmem_max"
  sysctl:
    name: net.core.rmem_max
    value: "134217728"
    state: present
    reload: yes

- name: "Set net.core.wmem_max"
  sysctl:
    name: net.core.wmem_max
    value: "134217728"
    state: present
    reload: yes

- name: "Set net.ipv4.tcp_max_syn_backlog"
  sysctl:
    name: net.ipv4.tcp_max_syn_backlog
    value: "3240000"
    state: present
    reload: yes

- name: "Set net.ipv4.tcp_rmem"
  sysctl:
    name: net.ipv4.tcp_rmem
    value: "4096 87380 67108864"
    state: present
    reload: yes

- name: "Set net.ipv4.tcp_wmem"
  sysctl:
    name: net.ipv4.tcp_wmem
    value: "4096 87380 67108864"
    state: present
    reload: yes

- name: "Set net.core.somaxconn"
  sysctl:
    name: net.core.somaxconn
    value: "500"
    state: present
    reload: yes

##
# The following are for lots of containers. Source: https://github.com/systemd/systemd/issues/17992#issuecomment-765007653

# View current usage with `sysctl fs.file-nr`
- name: "Set fs.file-max"
  sysctl:
    name: fs.file-max
    value: "16777216"
    state: present
    reload: yes

- name: "Set fs.inotify.max_queued_events"
  sysctl:
    name: fs.inotify.max_queued_events
    value: "8388608"
    state: present
    reload: yes

- name: "Set fs.inotify.max_user_instances"
  sysctl:
    name: fs.inotify.max_user_instances
    value: "8388608"
    state: present
    reload: yes

- name: "Set fs.inotify.max_user_watches"
  sysctl:
    name: fs.inotify.max_user_watches
    value: "16777216"
    state: present
    reload: yes

- name: "Set kernel.pid_max"
  sysctl:
    name: kernel.pid_max
    value: "4194304"
    state: present
    reload: yes

- name: "Set net.ipv4.tcp_mem"
  sysctl:
    name: net.ipv4.tcp_mem
    value: "765828 1021104 3063312"
    state: present
    reload: yes

- name: "Set nfs.aio-max-nr"
  sysctl:
    name: fs.aio-max-nr
    value: "2097152"
    state: present
    reload: yes

##
# Raise the kernel's free-memory reserve. The auto-computed value is capped at 64MB
# regardless of RAM, which is thin on a node with no swap and a large page cache -- an
# allocation that cannot wait fails at the watermark rather than stalling in reclaim, which
# shows up as dockerd failing an NFS volume mount with ENOMEM ("cannot allocate memory")
# while mounts either side of it succeed. Own file rather than sysctl.conf so the value is
# visible where it was set and can be removed by deleting one file.
- name: Raise the kernel free-memory reserve
  ansible.builtin.sysctl:
    name: vm.min_free_kbytes
    value: "{{ vm_min_free_kbytes }}"
    sysctl_file: /etc/sysctl.d/99-computestacks-memory.conf
    state: present
    reload: true

- name: Configure inotify limits for high container density
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-docker-inotify.conf
    reload: true
    state: present
  loop:
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches,   value: "1048576" }

