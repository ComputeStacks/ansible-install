---
config_directory: "/etc/computestacks"

# Conntrack sizing. Every published-port connection consumes a conntrack slot because
# nodes run dockerd with --userland-proxy=false, so the kernel default is far too low.
nf_conntrack_max: 1000000
nf_conntrack_hashsize: 250000

# Kernel free-memory reserve, in KB. The auto-computed default is capped at 64MB no matter
# how much RAM the machine has, which is thin on a node with no swap and tens of GB in page
# cache: an allocation that cannot wait then fails at the watermark instead of stalling in
# reclaim. That surfaces as a backup failing with "cannot allocate memory" while the kernel
# mounts an NFS volume, with mounts a second either side succeeding. Costs roughly this much
# page cache. Lower it for nodes with less than 16GB, where 512MB is a large share of RAM.
vm_min_free_kbytes: 524288
