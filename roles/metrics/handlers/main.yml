---
# Full restarts, not reloads: both units run the container in the foreground
# via `docker run --rm` with no ExecReload wired up, so an image bump or a
# structural config change (prometheus.yml, alertmanager.yml, the unit files
# themselves) always goes through a restart. This deliberately does NOT fire
# for per-AZ file_sd fragment changes (tasks/file_sd.yml never notifies
# anything) -- Prometheus's file_sd_configs watch those files on their own
# and reload within one scrape interval, with no coordination needed. That is
# what makes attach mode safe against an existing, unmanaged v1 prometheus.
- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted
    enabled: true
    daemon_reload: true
