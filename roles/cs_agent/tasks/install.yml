---
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ cs_agent_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch the ComputeStacks apt signing key
  ansible.builtin.get_url:
    url: "{{ cs_agent_apt_key_url }}"
    dest: "{{ cs_agent_keyring_asc }}"
    owner: root
    group: root
    mode: "0644"
  register: cs_agent_apt_key_download

- name: Check whether the dearmored keyring exists
  ansible.builtin.stat:
    path: "{{ cs_agent_keyring }}"
  register: cs_agent_keyring_stat

# apt refuses an ASCII-armored key in signed-by, so the fetched .asc is
# converted to a binary keyring. Re-runs only when the upstream key changed or
# the keyring is missing — a rotated key rolls through on the next converge.
- name: Dearmor the ComputeStacks apt signing key
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      --output {{ cs_agent_keyring }}
      {{ cs_agent_keyring_asc }}
  when: cs_agent_apt_key_download is changed or not cs_agent_keyring_stat.stat.exists
  changed_when: true

- name: Ensure the dearmored keyring is world readable
  ansible.builtin.file:
    path: "{{ cs_agent_keyring }}"
    owner: root
    group: root
    mode: "0644"

# Earlier versions of this role wrote the source as a one-line .list file
# (ansible.builtin.apt_repository). Removed first, so a host converged by
# that version never carries the repository twice. The key stays where it
# was: both forms point Signed-By at the same dearmored keyring.
- name: Remove the one-line ComputeStacks apt source written by earlier versions
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ cs_agent_apt_sources_filename }}.list"
    state: absent

# ansible.builtin.deb822_repository parses and writes the .sources file with
# python-debian, on the target host.
- name: Install the apt tooling deb822_repository needs
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the ComputeStacks apt repository
  ansible.builtin.deb822_repository:
    name: "{{ cs_agent_apt_sources_filename }}"
    types: [deb]
    # uris/suites are list-typed: passed as lists so a value is never
    # comma-split into two sources.
    uris: ["{{ cs_agent_apt_repo }}"]
    suites: ["{{ cs_agent_apt_suite }}"]
    components: ["{{ cs_agent_apt_component }}"]
    signed_by: "{{ cs_agent_keyring }}"
    enabled: true
    state: present

# No separate cache refresh: the pinned install below always runs with
# update_cache, which picks up the new source.
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

# A held package cannot be moved to a new pin, so the hold is released before
# the install and re-applied after it. That is what makes a version bump in
# versions.yml roll through on a rerun (docs/contracts.md rule 3).
- name: Release the cs-agent apt hold before installing the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ cs_agent_package }}"
    selection: install
  when: cs_agent_package in ansible_facts.packages

- name: Install the pinned cs-agent package
  ansible.builtin.apt:
    name: "{{ cs_agent_package }}={{ cs_agent_apt_version }}"
    state: present
    # true by default, so a pin moved back in versions.yml rolls back on a
    # site.yml re-run. playbooks/maintain-nodes.yml sets it false: a live
    # node's agent is never downgraded, and its preflight refuses a pin below
    # what is installed before anything is held (README.md).
    allow_downgrade: "{{ cs_agent_allow_downgrade | bool }}"
    update_cache: true
  notify: Restart cs-agent

- name: Hold the cs-agent package at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ cs_agent_package }}"
    selection: hold
