---
- name: Assert the inventory vars cs_agent renders from are present
  ansible.builtin.assert:
    that:
      - hostname is defined and (hostname | length > 0)
      - primary_ip is defined and (primary_ip | length > 0)
      - backups_key is defined and (backups_key | length > 0)
      - cs_agent_apt_version is defined and cs_agent_apt_version != 'VERIFY'
    fail_msg: >-
      cs_agent needs the inventory vars `hostname` and `primary_ip` on every
      node, `backups_key` in the vaulted secrets file, and a resolved
      `cs_agent_apt_version` in playbooks/group_vars/all/versions.yml.

# One shared backup server PER SITE is architectural (docs/control-plane
# graph, docs/contracts.md §Vocabulary), and roles/preflight asserts it across
# the whole inventory in the first play. This is the role-local backstop, and
# it is not redundant with preflight for one specific reason: sites.yml builds
# `cs_site_backup_hosts` by zipping sites onto hosts, so a second backup host
# declaring this node's site does not raise anything — it simply wins, and
# every node in the site quietly starts writing its borg repository to a
# different server than it did last run. That failure has no symptom until a
# restore, so the role checks the raw list rather than trusting the map it is
# about to read. Preflight is also a separate play: a `--tags`/`--limit` run
# can reach this role without having passed through it.
#
# Zero is NOT an error: a backup server is optional per site (see
# cs_agent_backup_configured in defaults). The node still gets its agent, and
# every borg-dependent task below is skipped rather than the run dying on a
# server the operator never had to provide.
- name: Assert at most one backup server stands in this node's site
  ansible.builtin.assert:
    that:
      - (cs_agent_backup_hosts_in_site | length) <= 1
    fail_msg: >-
      cs_agent found {{ cs_agent_backup_hosts_in_site | length }} backup hosts
      declaring site '{{ cs_site }}'
      ({{ cs_agent_backup_hosts_in_site | sort | join(', ') }}) and cannot
      choose between them. The borg SSH backend points every node in a site at
      one shared backup server: name exactly one backup host per site, or none
      at all in a site whose nodes should run without backups.
    # The inline `if` is load-bearing, not cosmetic: `success_msg` is
    # templated when the task's args are FINALIZED, before the assertion runs
    # (the same trap as `delegate_to` below), so an unguarded
    # `cs_site_backup_hosts[cs_site]` would raise on every node whose site has
    # no backup server — the supported case. Jinja's inline `if` is lazy, so
    # the subscript is only reached when the key exists.
    success_msg: >-
      {{ "backup server for site '" ~ cs_site ~ "': " ~ cs_site_backup_hosts[cs_site]
         if (cs_agent_backup_configured | bool)
         else "no backup server in site '" ~ cs_site ~ "' — backups will be disabled on this node" }}
    quiet: true

- name: Install the cs-agent package from the ComputeStacks apt repository
  ansible.builtin.include_tasks: install.yml

- name: Ensure the ComputeStacks configuration directory exists
  ansible.builtin.file:
    path: "{{ cs_agent_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# All three are inert without a backup server to authorize the key against.
- name: Configure the node's borg access to the backup server
  when: cs_agent_backup_configured | bool
  block:
    - name: Ensure the borg SSH key directory exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ cs_agent_backup_dir }}"
        - "{{ cs_agent_backup_ssh_dir }}"

    - name: Generate the node's borg SSH keypair
      community.crypto.openssh_keypair:
        path: "{{ cs_agent_backup_keyfile }}"
        type: ed25519
        owner: root
        group: root
        mode: "0600"
        comment: "cs-agent {{ hostname }}"
        regenerate: never
        state: present
      register: cs_agent_backup_keypair

    # Additive, per-node entry — safe against an existing_env backup server
    # that already carries every other node's key.
    - name: Authorize the node's borg key on the backup server
      ansible.posix.authorized_key:
        user: "{{ cs_agent_backup_ssh_user }}"
        key: "{{ cs_agent_backup_keypair.public_key }}"
        comment: "cs-agent {{ hostname }}"
        state: present
        manage_dir: true
      # `delegate_to` is templated when the task is SET UP, before any `when`
      # is evaluated — the enclosing block's gate does NOT protect it, so this
      # expression must render for EVERY node, including one whose site has no
      # backup server at all. A bare `cs_site_backup_hosts[cs_site]` raises
      # there and fails the task despite it being skipped, so the lookup stays
      # total: `.get` supplies this node itself for a site with no entry, and
      # a site with no backup host also covers the case of no groups['backup']
      # at all (sites.yml defaults that group to an empty list, which yields an
      # empty map). The fallback host is never contacted, because the block's
      # `when` — cs_agent_backup_configured, the same "is this site's key
      # present" test — is what actually decides whether this runs.
      # Same trap as roles/docker_tls/tasks/issue.yml.
      delegate_to: "{{ cs_site_backup_hosts.get(cs_site, inventory_hostname) }}"

- name: Read the admin token hash already present in agent.yml
  ansible.builtin.include_tasks: read_token_hash.yml
  tags: [enroll]

- name: Fetch this node's admin token hash from the controller
  ansible.builtin.include_tasks: enroll.yml
  tags: [enroll]

# no_log because agent.yml carries `backups.key` (the borg repository
# passphrase for the whole fleet) and the admin token hash. Without it a
# `--diff` run prints both to the terminal and into any log the operator is
# capturing, which is the one place a 0600 file was supposed to keep them out
# of. The changed/ok status and the handler notification are unaffected.
- name: Deploy agent.yml
  ansible.builtin.template:
    src: agent.yml.j2
    dest: "{{ cs_agent_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [enroll]
  notify: Restart cs-agent

- name: Enable and start cs-agent
  ansible.builtin.systemd_service:
    name: "{{ cs_agent_service }}"
    state: started
    enabled: true
    daemon_reload: true
