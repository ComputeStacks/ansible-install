---
# cs-agent (v3.3.0) node agent. Schema of agent.yml is cs-agent's
# config/config.go — NOT the upstream agent.sample.yml, which is wrong in
# places (see README.md and docs/contracts.md).

# --- apt -------------------------------------------------------------------
# cs_agent_apt_version / cs_agent_apt_repo / cs_agent_apt_key_url are pinned in
# playbooks/group_vars/all/versions.yml (contracts.md rule 4).
cs_agent_package: cs-agent
cs_agent_service: cs-agent
cs_agent_keyring_dir: /etc/apt/keyrings
cs_agent_keyring_asc: "{{ cs_agent_keyring_dir }}/computestacks.asc"
cs_agent_keyring: "{{ cs_agent_keyring_dir }}/computestacks.gpg"
cs_agent_apt_suite: stable
cs_agent_apt_component: main
# Basename of the sources.list.d file: <name>.sources (deb822). Earlier
# versions wrote <name>.list, which tasks/install.yml removes.
cs_agent_apt_sources_filename: computestacks

# --- paths -----------------------------------------------------------------
# /etc/computestacks is the ONLY host directory bind-mounted into the borg
# container, so the borg ssh key has to live under it (docs/contracts.md).
cs_agent_config_dir: /etc/computestacks
cs_agent_config_file: "{{ cs_agent_config_dir }}/agent.yml"
cs_agent_backup_dir: "{{ cs_agent_config_dir }}/backup"
cs_agent_backup_ssh_dir: "{{ cs_agent_backup_dir }}/.ssh"
cs_agent_backup_keyfile: "{{ cs_agent_backup_ssh_dir }}/id_ed25519"

# --- metadata front door ---------------------------------------------------
# Pairwise tailscale derivation (docs/contracts.md): the listener binds all
# interfaces ONLY when this node routes control-plane traffic over the tailnet,
# because the controller may then dial it over the tailnet address. Otherwise
# (off the tailnet, or on it with `tailscale_access_only: true`) it binds
# primary_ip. It is NEVER the tailscale address itself — containers reach the
# agent through metadata.internal, which resolves to primary_ip.
cs_agent_tailnet_routed: >-
  {{ ((tailscale_authkey | default('')) | length > 0)
     and (tailscale_enabled | default(true) | bool)
     and not (tailscale_access_only | default(false) | bool) }}
cs_agent_listen_addr: >-
  {{ (':' ~ cs_ports.agent_http) if (cs_agent_tailnet_routed | bool)
     else (primary_ip ~ ':' ~ cs_ports.agent_http) }}

# Hex sha256 of the per-node admin Bearer the controller authenticates with.
# Filled in by tasks/enroll.yml from the controller; pre-seeded from whatever
# is already in agent.yml so a re-render can never blank a working node.
cs_agent_admin_token_hash: ""

# --- agent behavior -------------------------------------------------------
cs_agent_iptables_cmd: iptables
cs_agent_ip6tables_cmd: ip6tables
cs_agent_store_data_dir: /var/lib/cs-agent
cs_agent_queue_numworkers: 3
# Optional; the enrollment snippet parses it. Rendered only when
# cs_portal_domain is set in the inventory.
cs_agent_controller_host: "{{ ('https://' ~ cs_portal_domain) if (cs_portal_domain | default('') | length > 0) else '' }}"

# --- backups ---------------------------------------------------------------
# Backup servers are SITE-scoped (docs/contracts.md §Vocabulary): a node backs
# up to the ONE backup server standing in its own physical facility, not to a
# single platform-wide server. `cs_site_backup_hosts` (site -> backup
# inventory_hostname) is the frozen spelling for that map, defined once in
# playbooks/group_vars/all/sites.yml. This role consumes it and re-derives
# nothing.
#
# There is deliberately no `cs_agent_backup_group` any more. It promised the
# group name was configurable, and that stopped being true the moment the map
# in sites.yml became the single source of truth — sites.yml builds it out of
# a literal groups['backup'], so a role-local override would have named a
# group nobody reads. Nothing outside this role ever set it.
#
# LOCAL USE ONLY, docs/contracts.md hard rule 10: `cs_site_backup_hosts`
# references `hostvars`, so it may only be read on the host currently
# executing. Every read below happens on the node itself and is keyed by that
# node's own `cs_site`. NEVER `hostvars[n].cs_site_backup_hosts` — across
# hosts that evaluates to Undefined with no error at all, and a `| default()`
# guard would turn it into a wrong-but-plausible backup server.
#
# Single-site regression: an inventory that sets `site` nowhere puts every
# host in the site called `default`, so the map holds exactly one key and this
# resolves to precisely the host `groups['backup'] | first` used to return.

# A backup server is OPTIONAL, and it is now optional PER SITE. When this
# node's site names none, the node still gets its agent -- it simply runs
# without backups, rather than the whole run failing on a server that was
# never required. roles/preflight allows a site with zero backup hosts for
# exactly this reason, roles/validate treats it the same way (tasks/main.yml
# gates the borg checks on the same emptiness), and playbooks/site.yml's
# `hosts: backup` play simply matches fewer hosts.
#
# One per site is still the ceiling, but it is now structural rather than
# counted: a map keyed by site cannot hold two entries for one site. What that
# structure makes SILENT -- two backup hosts both claiming this node's site,
# where building the map keeps whichever came last -- is what the backstop
# assert in tasks/main.yml exists to catch.
cs_agent_backup_configured: "{{ cs_site in cs_site_backup_hosts }}"

# Every backup host that claims this node's site. Length 0 or 1 in a correct
# inventory; the assert in tasks/main.yml is the only consumer, and it needs
# the raw list rather than the map precisely because the map has already
# collapsed a duplicate site by the time anything can look at it.
cs_agent_backup_hosts_in_site: >-
  {{ (groups['backup'] | default([])) | map('extract', hostvars)
     | selectattr('cs_site', 'eq', cs_site)
     | map(attribute='inventory_hostname') | list }}

# Operator intent, not the rendered value. agent.yml gets
# `cs_agent_backups_enabled AND cs_agent_backup_configured`: there is nothing
# to back up TO without a server in this node's site, and the borg block
# cannot even be templated (cs_agent_backup_ssh_host below subscripts the map
# with a site that has no entry). Set this false to switch backups off on a
# node that DOES have a backup server.
cs_agent_backups_enabled: true

cs_agent_backup_ssh_user: cstacks
# Inventory var, never a gathered fact (contracts.md rule 1): a --limit'ed run
# must render the same backup endpoint as a full run, including when the
# backup host itself is outside the limit. The subscript is unguarded on
# purpose -- every consumer is gated on cs_agent_backup_configured, and a
# `| default()` here would let a node whose site has no backup server render
# as though it had one (or, worse, borrow another site's).
cs_agent_backup_ssh_host: "{{ hostvars[cs_site_backup_hosts[cs_site]].primary_ip }}"
# Path ON the backup server. Attach mode MUST set backup_host_path to the
# existing server's path (v1 default was /mnt).
cs_agent_backup_host_path: "{{ backup_host_path | default('/var/lib/computestacks/backups') }}"
# Path to the borg binary ON the backup server. Attach mode MUST set
# backup_borg_remote_path (v1 servers use the distro borg at /usr/bin/borg;
# the v2 default is the wrapper the backup_server role installs).
cs_agent_borg_remote_path: "{{ backup_borg_remote_path | default(borg_binary_path) }}"
# sshd port ON the backup server: that server's own `ssh_port` host var, else
# cs_ports.ssh. `backup_ssh_port` still overrides both, for a server reached on
# a different port than its sshd's (a NAT or forward in between). Unguarded
# for the same reason as cs_agent_backup_ssh_host above.
cs_agent_backup_ssh_port: "{{ backup_ssh_port | default(hostvars[cs_site_backup_hosts[cs_site]].ssh_port | default(cs_ports.ssh)) }}"
# NOT `compress` — the upstream sample's key is a bug, the code reads
# backups.borg.compression (config/config.go).
cs_agent_borg_compression: "zstd,3"

# --- backup export to S3 (optional) ----------------------------------------
# backups.export.* — "download backup": the agent streams a borg archive to S3
# and hands back a presigned URL. OFF until cs_agent_s3_export_bucket is set;
# with it empty no `export:` block is rendered at all. Once it is set,
# tasks/export_check.yml (also run by preflight) requires the region and both
# credentials and checks the numbers. Every default below is cs-agent's own
# (config/config.go), so setting only the bucket, endpoint and keys renders
# exactly what the agent would have assumed.
#
# Per region or per site: set these in the inventory's group_vars for a
# region_<name> / az_<name> group, or in a node's host_vars — operators
# commonly point each region at its own S3 endpoint. The credentials
# s3_export_access_key / s3_export_secret_key are secrets: keep them in the
# vaulted secrets file (or a vaulted per-region group_vars file). They are
# rendered into agent.yml, which is 0600 and written with no_log.
#
# The exported tar is PLAINTEXT (the borg repo's encryption does not carry
# over): keep the bucket private, leave SSE on, and give it an object-expiry
# lifecycle rule plus AbortIncompleteMultipartUpload.
cs_agent_s3_export_bucket: ""
cs_agent_s3_export_endpoint: ""          # empty = real AWS; else an https:// URL (MinIO/Ceph/...)
cs_agent_s3_export_region: "us-east-1"
cs_agent_s3_export_prefix: "exports/"
cs_agent_s3_export_force_path_style: false   # true for MinIO / path-style endpoints
# Dedicated export workers; each large export holds about
# part_size_mb * concurrency of RAM.
cs_agent_s3_export_workers: 1
# borg --tar-filter for the exported tar; "" uploads it uncompressed (full
# plaintext size — the repo's own compression does not carry over).
cs_agent_s3_export_tar_filter: "gzip"
# Hard cap on one export, so a hung borg or S3 cannot hold the repo lock (4h).
cs_agent_s3_export_timeout_sec: 14400
# Multipart part size; >= 5. S3 allows 10,000 parts, so 64 MB caps one
# archive at ~625 GB.
cs_agent_s3_export_part_size_mb: 64
cs_agent_s3_export_concurrency: 4
# Server-side encryption: AES256, aws:kms, aws:kms:dsse, or "" for none.
cs_agent_s3_export_sse: "AES256"
# Presigned URL lifetime when the request names none (12h), and the cap on a
# requested one (24h). max must stay below cs_agent_upstream_tasks_retention_sec.
cs_agent_s3_export_default_ttl_sec: 43200
cs_agent_s3_export_max_ttl_sec: 86400

# NOT a knob: cs-agent's compiled-in tasks.retention_sec (config/config.go,
# 7d), which this role deliberately does not render. Terminal task rows must
# outlive the longest presigned URL, so export_check.yml refuses a
# cs_agent_s3_export_max_ttl_sec at or above it. Update it if a cs-agent bump
# changes that default.
cs_agent_upstream_tasks_retention_sec: 604800

cs_agent_s3_export_enabled: "{{ (cs_agent_s3_export_bucket | default('') | string | trim | length) > 0 }}"

# --- mariadb ---------------------------------------------------------------
# TOP-LEVEL in the schema. The upstream sample nests these under `backups:`,
# which the code never reads (config/config.go registers `mariadb.*`).
cs_agent_mariadb_lock_wait_query_type: "ALL"
cs_agent_mariadb_lock_wait_timeout: 60
cs_agent_mariadb_long_queries_query_type: "SELECT"
cs_agent_mariadb_long_queries_timeout: 20

# --- enrollment ------------------------------------------------------------
cs_agent_controller_group: controller
# The cstacks CLI (roles/controller) runs this inside the portal container.
cs_agent_enroll_command: cstacks
