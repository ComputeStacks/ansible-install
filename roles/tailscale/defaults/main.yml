---
# Thin wrapper around the artis3n.tailscale collection's `machine` role
# (pinned in requirements.yml). The playbooks run it on tailnet members
# (`tailscale_enabled: true`, docs/contracts.md §Tailnet membership).
# `tailscale_authkey` is not a default: a short-lived key the run carries
# only to join a member that is not logged in yet (README "Joining once").

# False makes a run that meets a member that is not logged in fail instead of
# joining it. maintain-nodes sets it: maintenance never joins a node.
tailscale_join_allowed: true

# Where the tailscale package puts its CLI; its absence means "not installed".
tailscale_binary: /usr/bin/tailscale

# Passed to the collection role's `state` variable. 'present' installs the
# package and leaves it alone; the upstream default of 'latest' would upgrade
# tailscale on every converge, which contradicts docs/contracts.md rule 4
# (every version pinned, nothing floats). See README §Decisions.
tailscale_package_state: present

# MagicDNS would rewrite /etc/resolv.conf on every host. Servers here resolve
# through their own resolver and the controller dials addresses, not names, so
# DNS is deliberately left alone.
tailscale_accept_dns: false

# No exit node, no subnet routes, no tags by default. Extra flags for
# `tailscale up` go here (e.g. "--advertise-tags=tag:cs" needs tailscale_tags
# on the collection role instead).
tailscale_extra_args: ""
tailscale_up_args: >-
  --accept-dns={{ tailscale_accept_dns | bool | lower }}
  {{ tailscale_extra_args }}
tailscale_up_timeout: "120"

# Apt source files left by the standalone artis3n.tailscale role (and by
# tailscale's install script). Removed before the collection role writes its
# deb822 source; see tasks/main.yml.
tailscale_legacy_apt_files:
  - /etc/apt/sources.list.d/tailscale.list
  - /usr/share/keyrings/tailscale-archive-keyring.gpg

# Local facts. Written so LATER runs and plays can read this host's tailnet
# address out of hostvars without re-deriving it (see README §consumers).
tailscale_facts_dir: /etc/ansible/facts.d
tailscale_fact_file: "{{ tailscale_facts_dir }}/computestacks.fact"
