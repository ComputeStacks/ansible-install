---
# Keep a tailnet member installed and joined, then record its tailnet address
# so the plays that need PAIRWISE derivation (prometheus scrape targets,
# manifest node.agent_host) can read it out of hostvars. See README.
#
# The node's login state decides everything (README "Joining once"):
#   * not logged in -- the first join: `tailscale up` with the short-lived
#     tailscale_authkey this run carries, through the collection role;
#   * logged in -- never joined again and never `up` with a key: its settings
#     are compared with the role's flags (tasks/status.yml, which refuses on
#     any difference), and the collection role only keeps the package.

- name: Assert this host is a tailnet member
  ansible.builtin.assert:
    that:
      - tailscale_enabled | default(false) | bool
    fail_msg: >-
      The tailscale role ran on {{ inventory_hostname }}, which is not a tailnet
      member: membership is `tailscale_enabled: true` (docs/contracts.md
      §Tailnet membership), and the playbooks gate this role on it.
    quiet: true

# A node joined earlier whose tailscaled is stopped would read as "not logged
# in" and be joined again with a key. Start an installed daemon first, so the
# state read below is the node's real one.
- name: Look for an installed tailscale
  ansible.builtin.stat:
    path: "{{ tailscale_binary }}"
  register: tailscale_installed

- name: Start an installed tailscaled before reading its state
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
  when: tailscale_installed.stat.exists

- name: Read the login state and check a logged-in node's settings
  ansible.builtin.include_tasks: status.yml

- name: Gate - this run may join a node
  ansible.builtin.assert:
    that:
      - tailscale_logged_in | bool or (tailscale_join_allowed | bool)
    fail_msg: >-
      {{ inventory_hostname }} is a tailnet member (tailscale_enabled: true) but is not
      logged in to the tailnet (state {{ tailscale_backend_state }}), and this run never
      joins a node. Join it outside a maintenance run -- add-region.yml or site.yml with a
      short-lived tailscale_authkey for that run -- or by hand, then re-run.
    quiet: true

- name: Gate - the first join needs an auth key
  ansible.builtin.assert:
    that:
      - tailscale_logged_in | bool or ((tailscale_authkey | default('')) | length > 0)
    fail_msg: >-
      {{ inventory_hostname }} is a tailnet member (tailscale_enabled: true) but is not
      logged in to the tailnet yet (state {{ tailscale_backend_state }}). The first join
      needs a short-lived tailscale_authkey for this run (for example a vaulted
      host_vars/{{ inventory_hostname }}/tailscale.yml); it is never needed again.
      Nothing was changed.
    quiet: true

- name: Remove the apt source the standalone artis3n.tailscale role wrote
  # The standalone role (and tailscale's own install script) wrote a one-line
  # tailscale.list signed by this keyring; the collection writes a deb822
  # tailscale.sources signed by a key under /etc/apt/keyrings. Left in place,
  # the two disagree on Signed-By for the same repository and apt refuses to
  # update at all. Absent on a fresh host, so a no-op there.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ tailscale_legacy_apt_files }}"

# Two includes, exactly one of which runs.
- name: Install tailscale and join this node with the run's auth key
  ansible.builtin.include_role:
    name: artis3n.tailscale.machine
  vars:
    # Collection role variables. 'state' is the upstream name (a generic one —
    # it is scoped to this include). tailscale_authkey and
    # tailscale_up_timeout already carry the upstream names.
    state: "{{ tailscale_package_state }}"
    tailscale_args: "{{ tailscale_up_args | trim }}"
  when: not (tailscale_logged_in | bool)

# A logged-in node: `tailscale_up_skip` turns the collection's `tailscale up`
# task off outright (its state-file and online checks never get a say), and
# the key is blanked so nothing in the collection can use one. It installs or
# keeps the package and the service, nothing more.
- name: Keep tailscale installed on a logged-in node, without joining
  ansible.builtin.include_role:
    name: artis3n.tailscale.machine
  vars:
    state: "{{ tailscale_package_state }}"
    tailscale_args: "{{ tailscale_up_args | trim }}"
    tailscale_up_skip: true
    tailscale_authkey: ""
  when: tailscale_logged_in | bool

- name: Read this host's tailnet IPv4 address
  ansible.builtin.command:
    argv:
      - tailscale
      - ip
      - "-4"
  register: tailscale_ip_result
  changed_when: false
  check_mode: false

- name: Assert the host actually joined the tailnet
  ansible.builtin.assert:
    that:
      - tailscale_ip_result.stdout_lines | default([]) | length > 0
      - tailscale_ip_result.stdout_lines[0] is match('^100\\.')
    fail_msg: >-
      'tailscale ip -4' did not return a tailnet address on
      {{ inventory_hostname }} (got: {{ tailscale_ip_result.stdout | default('') }}).
      Every consumer of the tailnet address (prometheus scrape targets, the
      manifest's node.agent_host) would silently fall back to the public path,
      so this fails loudly instead.
    quiet: true

- name: Record the tailnet address for this play
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout_lines[0] | trim }}"

- name: Ensure the local facts directory exists
  ansible.builtin.file:
    path: "{{ tailscale_facts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the existing local fact file
  ansible.builtin.slurp:
    src: "{{ tailscale_fact_file }}"
  register: tailscale_existing_fact
  failed_when: false
  changed_when: false
  check_mode: false

- name: Persist the tailnet address as a local fact
  # Merged, not overwritten: computestacks.fact is a shared namespace, and this
  # role only owns the 'tailscale_ip' key in it.
  ansible.builtin.copy:
    dest: "{{ tailscale_fact_file }}"
    content: >-
      {{ ((tailscale_existing_fact.content | default('') | b64decode | from_json)
          if (tailscale_existing_fact.content is defined) else {})
         | combine({'tailscale_ip': tailscale_ip}) | to_nice_json }}
    owner: root
    group: root
    mode: "0644"

- name: Refresh local facts so ansible_local is current for later plays
  # Cheap (one filtered gather) and unconditional: the later plays that read
  # hostvars[h].ansible_local.computestacks.tailscale_ip must never see the
  # pre-join value.
  ansible.builtin.setup:
    filter:
      - ansible_local
