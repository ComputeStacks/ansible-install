# /etc/tmux.conf — managed by the provisioner (roles/common); local edits are
# overwritten. Put personal settings in ~/.tmux.conf, which tmux reads after this.

# Terminal and responsiveness
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -sg escape-time 50          # short enough for vim, long enough for SSH jitter (Windows Terminal)
set -g focus-events on
set -g history-limit 50000      # scrollback
set -g display-time 3000

# Mouse: click to focus panes, drag borders to resize, wheel scrolls into history
set -g mouse on

# Copying: drag to select, release to copy. OSC 52 sends the selection to the
# *local* clipboard through SSH, so nothing (xclip etc.) is needed on the server.
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-selection-no-clear

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file /etc/tmux.conf \; display "tmux.conf reloaded"

# Bells (activity in background windows)
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell on

# Status bar: make it obvious which server you are on
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour31,fg=colour255,bold] #h #[default] "
set -g status-right "#[fg=colour244]#S  %Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=colour255,bold"
set -g pane-active-border-style "fg=colour31"
